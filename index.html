<body>

<header>
<h1>🚚 NGURIR SIMPEL</h1>
</header>

<div id="app"></div>

<script>

/* =====================================================
   NGURIR SIMPEL
   SATU FILE HTML + CSS + JAVASCRIPT
   ===================================================== */


/* =====================================================
   DATABASE SEMENTARA LOCAL STORAGE
   ===================================================== */

const DB_KEY = "NGURIR_SIMPEL_DATABASE";

function getDB(){

    let db = localStorage.getItem(DB_KEY);

    if(!db){

        return {
            counters:{
                kurir:0,
                kedai:0,
                pelanggan:0,
                pesanan:0
            },

            kurir:[],
            kedai:[],
            pelanggan:[],
            pesanan:[]
        };

    }

    return JSON.parse(db);

}

function saveDB(db){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(db)
    );

}


/* =====================================================
   SESSION
   ===================================================== */

const SESSION_KEY = "NGURIR_SIMPEL_SESSION";

function getSession(){

    let data = localStorage.getItem(SESSION_KEY);

    return data ? JSON.parse(data) : null;

}

function setSession(type,id){

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            type:type,
            id:id
        })
    );

}

function logout(){

    localStorage.removeItem(SESSION_KEY);

    location.href =
        location.pathname;

}


/* =====================================================
   URL PARAMETER
   ===================================================== */

function getParam(name){

    let params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(name);

}


/* =====================================================
   FORMAT RUPIAH
   ===================================================== */

function rupiah(n){

    return "Rp" +
        Number(n || 0)
        .toLocaleString("id-ID");

}


/* =====================================================
   ID OTOMATIS
   ===================================================== */

function generateID(type){

    let db = getDB();

    db.counters[type]++;

    saveDB(db);

    let number =
        String(
            db.counters[type]
        ).padStart(3,"0");

    if(type === "kurir")
        return "KURIR-" + number;

    if(type === "kedai")
        return "KEDAI-" + number;

    if(type === "pelanggan")
        return "PELANGGAN-" + number;

    if(type === "pesanan")
        return "ORDER-" + number;

}


/* =====================================================
   RENDER
   ===================================================== */

function render(html){

    document.getElementById("app").innerHTML =
        '<div class="container">' +
        html +
        '</div>';

}


/* =====================================================
   HALAMAN AWAL
   ===================================================== */

function startApp(){

    let mode = getParam("mode");
    let kurirID = getParam("kurir");

    if(mode === "kedai"){

        halamanDaftarKedai(kurirID);
        return;

    }

    if(mode === "pelanggan"){

        halamanPelangganAwal(kurirID);
        return;

    }

    if(mode === "cekstok"){

        let orderID = getParam("order");
        let kedaiID = getParam("kedai");

        halamanCekStok(
            orderID,
            kedaiID
        );

        return;

    }

    let session = getSession();

    if(session){

        if(session.type === "kurir"){

            halamanKurir(session.id);
            return;

        }

        if(session.type === "kedai"){

            halamanKedai(session.id);
            return;

        }

        if(session.type === "pelanggan"){

            halamanPelanggan(
                session.id,
                session.kurirID
            );

            return;

        }

    }

    halamanDaftarKurir();

}


/* =====================================================
   DAFTAR KURIR
   ===================================================== */

function halamanDaftarKurir(){

render(`

<div class="card">

<div class="center">

<h2>🚚 SELAMAT DATANG</h2>

<p>NGURIR SIMPEL</p>

</div>

<h3>DAFTAR AKUN KURIR</h3>

<label>Nama</label>

<input
id="namaKurir"
placeholder="Masukkan nama">

<label>Alamat</label>

<textarea
id="alamatKurir"
placeholder="Masukkan alamat"></textarea>

<label>Nomor WhatsApp</label>

<input
id="waKurir"
placeholder="08xxxxxxxxxx"
type="tel">

<button
class="btn-orange"
onclick="ambilLokasiKurir()">

📍 BAGIKAN LOKASI

</button>

<div
id="lokasiStatus"
class="info">

Lokasi belum dibagikan

</div>

<br>

<button
class="btn"
onclick="daftarKurir()">

SELESAI

</button>

</div>

`);

}


/* =====================================================
   LOKASI KURIR
   ===================================================== */

let lokasiKurir = null;

function ambilLokasiKurir(){

    if(!navigator.geolocation){

        alert(
            "Browser tidak mendukung lokasi"
        );

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(pos){

            lokasiKurir = {

                latitude:
                    pos.coords.latitude,

                longitude:
                    pos.coords.longitude

            };

            document
            .getElementById("lokasiStatus")
            .innerHTML =
            "✅ Lokasi berhasil disimpan";

        },

        function(){

            alert(
                "Lokasi tidak dapat diambil. Pastikan GPS aktif."
            );

        }

    );

}


/* =====================================================
   SIMPAN KURIR
   ===================================================== */

function daftarKurir(){

    let nama =
        document
        .getElementById("namaKurir")
        .value.trim();

    let alamat =
        document
        .getElementById("alamatKurir")
        .value.trim();

    let wa =
        document
        .getElementById("waKurir")
        .value.trim();


    if(!nama || !alamat || !wa){

        alert(
            "Lengkapi semua data"
        );

        return;

    }

    if(!lokasiKurir){

        alert(
            "Silakan bagikan lokasi terlebih dahulu"
        );

        return;

    }


    let id =
        generateID("kurir");

    let db =
        getDB();


    let kurir = {

        id:id,
        nama:nama,
        alamat:alamat,
        wa:wa,
        lokasi:lokasiKurir

    };


    db.kurir.push(kurir);

    saveDB(db);

    setSession(
        "kurir",
        id
    );

    halamanKurir(id);

}


/* =====================================================
   MENU UTAMA KURIR
   ===================================================== */

function getKurir(id){

    let db = getDB();

    return db.kurir.find(
        k => k.id === id
    );

}


function halamanKurir(id){

    let kurir =
        getKurir(id);

    if(!kurir){

        logout();
        return;

    }


    render(`

<div class="card">

<h2>🚚 MENU UTAMA KURIR</h2>

<p>

Selamat datang,

<b>${kurir.nama}</b>

</p>

<p>

ID Kurir:

<span class="badge">

${kurir.id}

</span>

</p>

<button
class="btn"
onclick="editKurir('${id}')">

⚙️ EDIT AKUN

</button>

<button
class="btn-green"
onclick="aturLayanan('${id}')">

🛒 ATUR LAYANAN PESANAN

</button>

<button
class="btn-orange"
onclick="buatLinkPelanggan('${id}')">

🔗 SALIN LINK PELANGGAN

</button>

<button
class="btn-gray"
onclick="logout()">

KELUAR

</button>

</div>

`);

}


/* =====================================================
   EDIT KURIR
   ===================================================== */

function editKurir(id){

    let kurir =
        getKurir(id);


render(`

<div class="card">

<button
class="back"
onclick="halamanKurir('${id}')">

← KEMBALI

</button>

<h2>⚙️ EDIT AKUN KURIR</h2>

<input
id="editNama"
value="${kurir.nama}">

<textarea
id="editAlamat">${kurir.alamat}</textarea>

<input
id="editWA"
value="${kurir.wa}">

<button
class="btn"
onclick="simpanEditKurir('${id}')">

SIMPAN PERUBAHAN

</button>

</div>

`);

}


function simpanEditKurir(id){

    let db =
        getDB();

    let kurir =
        db.kurir.find(
            k => k.id === id
        );


    kurir.nama =
        document
        .getElementById("editNama")
        .value;


    kurir.alamat =
        document
        .getElementById("editAlamat")
        .value;


    kurir.wa =
        document
        .getElementById("editWA")
        .value;


    saveDB(db);

    alert(
        "Data berhasil diperbarui"
    );

    halamanKurir(id);

}


/* =====================================================
   ATUR LAYANAN
   ===================================================== */

function aturLayanan(kurirID){

render(`

<div class="card">

<button
class="back"
onclick="halamanKurir('${kurirID}')">

← KEMBALI

</button>

<h2>🛒 ATUR LAYANAN PESANAN</h2>

<button
class="btn-green"
onclick="buatLinkKedai('${kurirID}')">

🔗 BUAT LINK PENDAFTARAN KEDAI

</button>

<button
class="btn"
onclick="lihatKedaiKurir('${kurirID}')">

🏪 LIHAT KEDAI SAYA

</button>

</div>

`);

}


/* =====================================================
   LINK KEDAI
   ===================================================== */

function buatLinkKedai(kurirID){

    let url =
        location.origin +
        location.pathname +
        "?mode=kedai&kurir=" +
        kurirID;


render(`

<div class="card">

<button
class="back"
onclick="aturLayanan('${kurirID}')">

← KEMBALI

</button>

<h2>🔗 LINK PENDAFTARAN KEDAI</h2>

<p>
Kirim link ini kepada pemilik kedai.
</p>

<div class="link-box">

${url}

</div>

<br>

<button
class="btn"
onclick="salinText('${url}')">

📋 SALIN LINK

</button>

</div>

`);

}


/* =====================================================
   SALIN TEXT
   ===================================================== */

function salinText(text){

    navigator.clipboard
    .writeText(text)
    .then(function(){

        alert(
            "Link berhasil disalin"
        );

    })
    .catch(function(){

        prompt(
            "Salin link berikut:",
            text
        );

    });

}


/* =====================================================
   LIHAT KEDAI MILIK KURIR
   ===================================================== */

function lihatKedaiKurir(kurirID){

    let db =
        getDB();


    let daftar =
        db.kedai.filter(
            k =>
            k.kurirID === kurirID
        );


    let html = `

<button
class="back"
onclick="aturLayanan('${kurirID}')">

← KEMBALI

</button>

<h2>🏪 KEDAI SAYA</h2>

`;


    if(daftar.length === 0){

        html += `

<div class="card">

<p>
Belum ada kedai terdaftar.
</p>

<p class="info">

Kedai akan muncul setelah
pemilik kedai membuka link
pendaftaran dan mengirim datanya.

</p>

</div>

`;

    }


    daftar.forEach(kedai => {

        html += `

<div class="kedai-item">

<h3>
🏪 ${kedai.nama}
</h3>

<p>
${kedai.alamat}
</p>

<button
class="btn-small"
onclick="lihatMenuKedaiKurir('${kurirID}','${kedai.id}')">

LIHAT MENU

</button>

<button
class="btn-small btn-orange"
onclick="editKedaiKurir('${kurirID}','${kedai.id}')">

EDIT

</button>

<button
class="btn-small btn-red"
onclick="hapusKedai('${kurirID}','${kedai.id}')">

HAPUS

</button>

</div>

`;

    });


    render(html);

}


/* =====================================================
   HAPUS KEDAI
   ===================================================== */

function hapusKedai(
    kurirID,
    kedaiID
){

    if(!confirm(
        "Hapus kedai ini?"
    )) return;


    let db =
        getDB();


    db.kedai =
        db.kedai.filter(
            k =>
            k.id !== kedaiID
        );


    saveDB(db);

    lihatKedaiKurir(kurirID);

}


/* =====================================================
   DAFTAR KEDAI
   ===================================================== */

function halamanDaftarKedai(kurirID){

    let kurir =
        getKurir(kurirID);


    if(!kurir){

        render(`

<div class="card danger">

<h2>Link Tidak Valid</h2>

<p>
ID Kurir tidak ditemukan.
</p>

</div>

`);

        return;

    }


render(`

<div class="card">

<h2>🏪 DAFTAR KEDAI</h2>

<p>

Anda akan terhubung ke:

<b>${kurir.nama}</b>

</p>

<p>

<span class="badge">

${kurirID}

</span>

</p>

<label>Nama Kedai</label>

<input
id="namaKedai"
placeholder="Masukkan nama kedai">

<label>Nomor WhatsApp</label>

<input
id="waKedai"
placeholder="08xxxxxxxxxx">

<label>Alamat Kedai</label>

<textarea
id="alamatKedai"
placeholder="Masukkan alamat kedai"></textarea>

<button
class="btn"
onclick="daftarKedai('${kurirID}')">

LANJUT

</button>

</div>

`);

}


function daftarKedai(kurirID){

    let nama =
        document
        .getElementById("namaKedai")
        .value.trim();

    let wa =
        document
        .getElementById("waKedai")
        .value.trim();

    let alamat =
        document
        .getElementById("alamatKedai")
        .value.trim();


    if(!nama || !wa || !alamat){

        alert(
            "Lengkapi semua data kedai"
        );

        return;

    }


    let db =
        getDB();

    let id =
        generateID("kedai");


    let kedai = {

        id:id,

        kurirID:kurirID,

        nama:nama,

        wa:wa,

        alamat:alamat,

        menu:[]

    };


    db.kedai.push(kedai);

    saveDB(db);

    setSession(
        "kedai",
        id
    );


    halamanKedai(id);

}


/* =====================================================
   MENU UTAMA KEDAI
   ===================================================== */

function getKedai(id){

    let db =
        getDB();

    return db.kedai.find(
        k => k.id === id
    );

}


function halamanKedai(kedaiID){

    let kedai =
        getKedai(kedaiID);


render(`

<div class="card">

<h2>
🏪 ${kedai.nama}
</h2>

<p>
${kedai.alamat}
</p>

<button
class="btn-green"
onclick="kelolaMenuKedai('${kedaiID}')">

🍽️ KELOLA MENU

</button>

<button
class="btn"
onclick="editAkunKedai('${kedaiID}')">

⚙️ EDIT DATA KEDAI

</button>

<button
class="btn-gray"
onclick="logout()">

KELUAR

</button>

</div>

`);

}


/* =====================================================
   KELOLA MENU KEDAI
   ===================================================== */

function kelolaMenuKedai(kedaiID){

    let kedai =
        getKedai(kedaiID);


    let html = `

<button
class="back"
onclick="halamanKedai('${kedaiID}')">

← KEMBALI

</button>

<h2>
🍽️ MENU ${kedai.nama}
</h2>

<button
class="btn-green"
onclick="formTambahMenu('${kedaiID}')">

+ TAMBAH MENU

</button>

`;


    if(kedai.menu.length === 0){

        html += `

<div class="card">

Belum ada menu.

</div>

`;

    }


    kedai.menu.forEach(menu => {

        html += `

<div class="card">

<div class="menu-row">

<div class="menu-name">

${menu.nama}

</div>

<div class="menu-price">

${rupiah(menu.harga)}

</div>

</div>

`;

        if(menu.varian &&
            menu.varian.length > 0){

            html +=
            "<b>Varian:</b>";

            menu.varian.forEach(v => {

                html += `

<div class="variant-item">

• ${v}

</div>

`;

            });

        }


        html += `

<button
class="btn-small btn-orange"
onclick="formEditMenu('${kedaiID}','${menu.id}')">

EDIT MENU

</button>

<button
class="btn-small btn-red"
onclick="hapusMenu('${kedaiID}','${menu.id}')">

HAPUS MENU

</button>

</div>

`;

    });


    render(html);

}


/* =====================================================
   TAMBAH MENU
   ===================================================== */

function formTambahMenu(kedaiID){

render(`

<div class="card">

<button
class="back"
onclick="kelolaMenuKedai('${kedaiID}')">

← KEMBALI

</button>

<h2>+ TAMBAH MENU</h2>

<label>Nama Menu</label>

<input
id="namaMenu"
placeholder="Contoh: Bakso Bakar">

<label>Harga</label>

<input
id="hargaMenu"
type="number"
placeholder="15000">

<label>Varian</label>

<div id="varianContainer">

<input
class="varianInput"
placeholder="Contoh: Pedas">

</div>

<button
class="btn-orange"
onclick="tambahInputVarian()">

+ TAMBAH VARIAN

</button>

<button
class="btn"
onclick="simpanMenu('${kedaiID}')">

SIMPAN MENU

</button>

</div>

`);

}


function tambahInputVarian(){

    let div =
        document
        .getElementById("varianContainer");

    div.innerHTML += `

<input
class="varianInput"
placeholder="Masukkan varian">

`;

}


function simpanMenu(kedaiID){

    let nama =
        document
        .getElementById("namaMenu")
        .value.trim();

    let harga =
        document
        .getElementById("hargaMenu")
        .value;


    if(!nama || !harga){

        alert(
            "Nama dan harga menu wajib diisi"
        );

        return;

    }


    let varian =
        Array.from(
            document
            .querySelectorAll(
                ".varianInput"
            )
        )
        .map(
            input =>
            input.value.trim()
        )
        .filter(
            v => v !== ""
        );


    let db =
        getDB();

    let kedai =
        db.kedai.find(
            k =>

/* =====================================================
   GET QTY
   ===================================================== */

function getQty(
    kedaiID,
    menuID,
    varian
){

    if(!cart[kedaiID])
        return 0;


    let item =
        cart[kedaiID]
        .items
        .find(
            i =>
            i.menuID === menuID &&
            i.varian === varian
        );


    return item ?
        item.qty :
        0;

}


/* =====================================================
   UBAH JUMLAH
   ===================================================== */

function ubahQty(
    kedaiID,
    menuID,
    varian,
    perubahan
){

    let kedai =
        getKedai(kedaiID);

    let menu =
        kedai.menu.find(
            m =>
            m.id === menuID
        );


    if(!cart[kedaiID]){

        cart[kedaiID] = {

            kedaiID:kedaiID,

            namaKedai:kedai.nama,

            items:[]

        };

    }


    let items =
        cart[kedaiID].items;


    let item =
        items.find(
            i =>
            i.menuID === menuID &&
            i.varian === varian
        );


    if(!item){

        if(perubahan < 0)
            return;


        item = {

            menuID:menuID,

            nama:menu.nama,

            harga:menu.harga,

            varian:varian,

            qty:0

        };


        items.push(item);

    }


    item.qty += perubahan;


    if(item.qty < 0)
        item.qty = 0;


    if(item.qty === 0){

        cart[kedaiID].items =
            items.filter(
                i =>
                !(
                    i.menuID === menuID &&
                    i.varian === varian
                )
            );

    }


    let safe =
        varian ?
        varian.replace(
            /\s/g,
            "_"
        ) :
        "none";


    let el =
        document.getElementById(
            "qty-" +
            kedaiID +
            "-" +
            menuID +
            "-" +
            safe
        );


    if(el){

        el.innerText =
            getQty(
                kedaiID,
                menuID,
                varian
            );

    }

}

    status
){

        getDB();

        db.pesanan.find(
            p =>
            p.id === orderID
        );


    let kedai =
        order.kedai.find(
            k =>
            k.kedaiID === kedaiID
        );


    kedai.items[index].stok =
        status;


    saveDB(db);


    let el =
        document.getElementById(
            "stok-" + index
        );


    if(el){

        el.innerHTML =
            status === "ADA" ?
            "🟢 ADA" :
            "🔴 KOSONG";

    }

}

   KIRIM HASIL STOK
   ===================================================== */

function kirimHasilStok(
    orderID,
    kedaiID
){

    let db =
        getDB();

    let order =
        db.pesanan.find(
            p =>
            p.id === orderID
        );


    let kedai =
        order.kedai.find(
            k =>
            k.kedaiID === kedaiID
        );


    let belum =
        kedai.items.some(
            i =>
            !i.stok
        );


    if(belum){

        alert(
            "Pilih ADA atau KOSONG untuk semua menu"
        );

        return;

    }


    kedai.stokSelesai =
        true;


    saveDB(db);

🏪 ${k.namaKedai}
</h3>

`;

        if(!k.stokSelesai){

            html += `

<p class="info">

Menunggu kedai mengecek stok.

</p>

`;

        }else{

            k.items.forEach(item => {

                html += `

<div class="menu-row">

<div class="menu-name">

${item.nama}

${item.varian ?
"- " + item.varian :
""}

× ${item.qty}

</div>

<div>

${item.stok === "ADA" ?
"🟢 ADA" :
"🔴 KOSONG"}

</div>

</div>

`;

            });


            html += `

<button
class="btn-green"
onclick="prosesKedai('${orderID}','${k.kedaiID}')">

PROSES PESANAN SAYA

</button>

<button
class="btn-red"
onclick="batalKedai('${orderID}','${k.kedaiID}')">

BATALKAN PESANAN SAYA

</button>

`;

        }


        html += `

</div>

`;

    });


    html += `

<button
class="btn"
onclick="halamanPelanggan('${pelangganID}','${kurirID}')">

KEMBALI KE MENU

</button>

`;


    render(html);

}


/* =====================================================
   PROSES KEDAI
   ===================================================== */

function prosesKedai(
    orderID,
    kedaiID
){

    let db =
        getDB();

    let order =
        db.pesanan.find(
            p =>
            p.id === orderID
        );


    let kedai =
        order.kedai.find(
            k =>
            k.kedaiID === kedaiID
        );


    kedai.keputusan =
        "DIPROSES";


    kedai.items =
        kedai.items.filter(
            i =>
            i.stok === "ADA"
        );


    saveDB(db);

    alert(
        "Pesanan kedai diproses"
    );

}


/* =====================================================
   BATAL KEDAI
   ===================================================== */

function batalKedai(
    orderID,
    kedaiID
){

    let db =
        getDB();

    let order =
        db.pesanan.find(
            p =>
            p.id === orderID
        );


    let kedai =
        order.kedai.find(
            k =>
            k.kedaiID === kedaiID
        );


    kedai.keputusan =
        "DIBATALKAN";


    saveDB(db);

    alert(
        "Pesanan kedai dibatalkan"
    );

}


/* =====================================================
   RIWAYAT PESANAN
   ===================================================== */

function riwayatPesanan(
    pelangganID,
    kurirID
){

    let db =
        getDB();


    let daftar =
        db.pesanan.filter(
            p =>
            p.pelangganID === pelangganID
        );


    let html = `

<button
class="back"
onclick="halamanPelanggan('${pelangganID}','${kurirID}')">

← KEMBALI

</button>

<h2>
📋 RIWAYAT PESANAN
</h2>

`;


    if(daftar.length === 0){

        html += `

<div class="card">

Belum ada riwayat pesanan.

</div>

`;

    }


    daftar.forEach(order => {

        html += `

<div class="card">

<h3>
${order.id}
</h3>

<p>
${order.waktu}
</p>

`;

        order.kedai.forEach(k => {

            html += `

<p>

🏪 ${k.namaKedai}

<br>

<span class="status proses">

${k.keputusan}

</span>

</p>

`;

        });


        html += `

<p>

Ongkir:

${rupiah(order.ongkir)}

</p>

<button
class="btn-small"
onclick="halamanResi('${pelangganID}','${kurirID}','${order.id}')">

LIHAT RESI

</button>

</div>

`;

    });


    render(html);

}


/* =====================================================
   RESI
   ===================================================== */

function halamanResi(
    pelangganID,
    kurirID,
    orderID
){

    let db =
        getDB();

    let order =
        db.pesanan.find(
            p =>
            p.id === orderID
        );


    let total = 0;


    let html = `

<button
class="back"
onclick="riwayatPesanan('${pelangganID}','${kurirID}')">

← KEMBALI

</button>

<h2>
🧾 RESI PESANAN
</h2>

<div class="card">

<p>

ID:

<b>${order.id}</b>

</p>

`;


    order.kedai.forEach(k => {

        if(k.keputusan !==
            "DIPROSES")
            return;


        html += `

<h3>
🏪 ${k.namaKedai}
</h3>

`;


        let subtotal = 0;


        k.items.forEach(item => {

            let jumlah =
                item.harga *
                item.qty;


            subtotal += jumlah;


            html += `

<div class="menu-row">

<div>

${item.nama}

${item.varian ?
"- " + item.varian :
""}

× ${item.qty}

</div>

<div>

${rupiah(jumlah)}

</div>

</div>

`;

        });


        total += subtotal;


        html += `

<p>

Subtotal:

<b>${rupiah(subtotal)}</b>

</p>

`;

    });


    let pembayaran =
        total +
        Number(order.ongkir);


    html += `

<hr>

<h3>

TOTAL PESANAN

${rupiah(total)}

</h3>

<h3>

🚚 ONGKIR

${rupiah(order.ongkir)}

</h3>

<h2>

💵 TOTAL PEMBAYARAN

${rupiah(pembayaran)}

</h2>

</div>

`;


    render(html);

}

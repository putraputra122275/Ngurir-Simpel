function money(value){
    value = Number(value) || 0;

    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(value);
}

function escapeHtml(value){
    if(value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function randomToken(length=32){
    const chars =
    "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let result="";

    for(let i=0;i<length;i++){
        result += chars.charAt(
            Math.floor(Math.random()*chars.length)
        );
    }

    return result;
}

function normalizePhone(phone){
    return String(phone || "")
        .replace(/\s+/g,"")
        .replace(/-/g,"");
}

function waNumber(phone){
    let n = normalizePhone(phone);

    if(n.startsWith("0")){
        n = "62" + n.substring(1);
    }

    if(n.startsWith("+")){
        n = n.substring(1);
    }

    return n;
}

function waLink(phone,message){
    return "https://wa.me/" +
        waNumber(phone) +
        "?text=" +
        encodeURIComponent(message);
}

function baseUrl(){
    return window.location.origin +
        window.location.pathname;
}

/* =========================================================
   URL COURIER CUSTOMER LINK
========================================================= */

function encodeCourierId(id){
    try{
        return btoa(id)
            .replace(/\+/g,"-")
            .replace(/\//g,"_")
            .replace(/=/g,"");
    }catch(e){
        return id;
    }
}

function decodeCourierId(value){
    try{
        let s = value
            .replace(/-/g,"+")
            .replace(/_/g,"/");

        while(s.length % 4){
            s += "=";
        }

        return atob(s);
    }catch(e){
        return null;
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

function go(page,extra={}){
    const params = new URLSearchParams();

    params.set("page",page);

    Object.keys(extra).forEach(key=>{
        if(
            extra[key] !== undefined &&
            extra[key] !== null &&
            extra[key] !== ""
        ){
            params.set(key,extra[key]);
        }
    });

    history.pushState(
        {},
        "",
        window.location.pathname +
        "?" +
        params.toString()
    );

    urlParams = new URLSearchParams(
        window.location.search
    );

    render();
}

window.onpopstate = function(){
    urlParams = new URLSearchParams(
        window.location.search
    );

    render();
};

function showCourierRegister(){

        </div>
    `;
}

function getCourierLocation(){

    if(!navigator.geolocation){
        alert("GPS tidak tersedia pada perangkat ini.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position=>{

            window.courierLocation = {
                latitude:position.coords.latitude,
                longitude:position.coords.longitude
            };

            document.getElementById(
                "courierLocationInfo"
            ).innerHTML =
            "✅ Lokasi berhasil diambil";
        },
        error=>{
            alert(
                "Lokasi belum berhasil diambil. " +
                "Pastikan izin lokasi diberikan."
            );
        },
        {
            enableHighAccuracy:true,
            timeout:15000
        }
    );
}

async function registerCourier(){

    const name =
        document.getElementById("courierName")
        .value.trim();

    const whatsapp =
        document.getElementById("courierWhatsapp")
        .value.trim();

    if(!name || !whatsapp){
        alert("Nama dan nomor WhatsApp wajib diisi.");
        return;
    }

    if(!window.courierLocation){
        alert("Silakan Bagikan Lokasi / Serlok terlebih dahulu.");
        return;
    }

    app().innerHTML =
        `<div class="card loading">
            Menyimpan data kurir...
        </div>`;

    const code =
        String(
            Math.floor(
                100 + Math.random()*900
            )
        );

    let uniqueCode = code;

    for(let i=0;i<20;i++){

        const check =
            await db
            .from("couriers")
            .select("id")
            .eq("courier_code",uniqueCode)
            .maybeSingle();

        if(!check.data){
            break;
        }

        uniqueCode =
            String(
                Math.floor(
                    100 + Math.random()*900
                )
            );
    }

    const {data,error} =
        await db
        .from("couriers")
        .insert({
            courier_code:uniqueCode,
            name:name,
            whatsapp:whatsapp,
            latitude:window.courierLocation.latitude,
            longitude:window.courierLocation.longitude
        })
        .select("*")
        .single();

    if(error){

        app().innerHTML = `
            <div class="card">
                <div class="error-box">
                    Gagal menyimpan data kurir.<br><br>
                    ${escapeHtml(error.message)}
                </div>

                <button onclick="showCourierRegister()">
                    KEMBALI
                </button>
            </div>
        `;

        return;
    }

    currentCourier = data;

    saveCourier(data);

    alert(
        "Pendaftaran berhasil.\n\n" +
        "ID Kurir Anda: " +
        data.courier_code
    );

    showCourierDashboard();
}

function updateCourierLocation(){

    navigator.geolocation.getCurrentPosition(
        position=>{

            window.editCourierLocation = {
                latitude:position.coords.latitude,
                longitude:position.coords.longitude
            };

            document.getElementById(
                "editCourierLocation"
            ).innerHTML =
            "✅ Lokasi baru berhasil diambil";
        },
        ()=>{
            alert("Lokasi gagal diambil.");

        {
            enableHighAccuracy:true,
            timeout:15000

    );
}

async function saveCourierChanges(){

    const name =
        document.getElementById(
            "editCourierName"
        ).value.trim();

    const whatsapp =
        document.getElementById(
            "editCourierWhatsapp"
        ).value.trim();

    if(!name || !whatsapp){
        alert("Nama dan WhatsApp wajib diisi.");
        return;
    }

    const updateData = {
        name:name,
        whatsapp:whatsapp
    };

    if(window.editCourierLocation){

        updateData.latitude =
            window.editCourierLocation.latitude;

        updateData.longitude =
            window.editCourierLocation.longitude;
    }

    const {data,error} =
        await db
        .from("couriers")
        .update(updateData)
        .eq("id",currentCourier.id)
        .select("*")
        .single();

    if(error){

        alert(
            "Gagal menyimpan perubahan:\n" +
            error.message
        );

        return;
    }

    currentCourier = data;

    saveCourier(data);

    alert("Perubahan berhasil disimpan.");

    showCourierDashboard();
}

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

    }catch(e){

        const input =
            document.createElement("textarea");

        input.value = text;

        document.body.appendChild(input);

        input.select();

        document.execCommand("copy");

        input.remove();
    }
}

function openWhatsAppLink(link){
    window.open(link,"_blank");
}

function showShopMenuSetup(){

    app().innerHTML = `
        <div class="card">

            <h2>🏪 DATA MENU KEDAI</h2>

            <div class="info">
                Menu boleh tanpa varian.
                Varian bersifat opsional.
            </div>

            </button>

        </div>
    `;

    if(shopDraftMenus.length === 0){
        addDraftMenu();
    }else{
        renderDraftMenus();
    }
}

function syncDraftMenus(){

    document.querySelectorAll(
        ".menu-draft"
    ).forEach((card,index)=>{

        if(!shopDraftMenus[index]) return;

        const name =
            card.querySelector(
                ".draft-menu-name"
            );

        const price =
            card.querySelector(
                ".draft-menu-price"
            );

        if(name){
            shopDraftMenus[index].name =
                name.value;
        }

        if(price){
            shopDraftMenus[index].price =
                price.value;
        }

        card.querySelectorAll(
            ".draft-variant-name"
        ).forEach((input,vIndex)=>{

            if(
                shopDraftMenus[index]
                .variants[vIndex]
            ){

                shopDraftMenus[index]
                    .variants[vIndex]
                    .name =
                    input.value;
            }
        });
    });
}

function addDraftMenu(){

    syncDraftMenus();

    shopDraftMenus.push({
        name:"",
        price:"",
        variants:[],
        selection_type:"single"
    });

    renderDraftMenus();
}

function addDraftVariant(menuIndex){

    syncDraftMenus();

    shopDraftMenus[
        menuIndex
    ].variants.push({
        name:""
    });

    renderDraftMenus();
}

function removeDraftVariant(menuIndex,variantIndex){

    syncDraftMenus();

    shopDraftMenus[
        menuIndex
    ].variants.splice(
        variantIndex,
        1
    );

    renderDraftMenus();
}

function removeDraftMenu(index){

    syncDraftMenus();

    shopDraftMenus.splice(
        index,
        1
    );

    renderDraftMenus();
}

function changeSelectionType(index,type){

    syncDraftMenus();

    shopDraftMenus[index]
        .selection_type = type;
}

function renderDraftMenus(){

    const box =
        document.getElementById(
            "draftMenus"
        );

    if(!box) return;

    box.innerHTML = "";

    shopDraftMenus.forEach(
        (menu,index)=>{

        let variantsHtml = "";

        menu.variants.forEach(
            (variant,vIndex)=>{

            variantsHtml += `
                <div class="variant-draft">

                    <input
                        class="draft-variant-name"
                        value="${escapeHtml(
                            variant.name
                        )}"
                        placeholder="Nama varian">

                    <button
                        class="danger"
                        onclick="
                        removeDraftVariant(
                            ${index},
                            ${vIndex}
                        )">
                        ×
                    </button>

                </div>
            `;
        });

        box.innerHTML += `
            <div class="menu-draft">

                <h3>MENU ${index+1}</h3>

                <label>NAMA MENU</label>

                <input
                    class="draft-menu-name"
                    value="${escapeHtml(menu.name)}"
                    placeholder="Contoh: Bakso">

                <label>HARGA</label>

                <input
                    class="draft-menu-price"
                    type="number"
                    value="${escapeHtml(menu.price)}"
                    placeholder="Contoh: 10000">

                <div class="variant-box">

                    <b>VARIAN</b>

                    ${variantsHtml}

                    <button
                        class="small"
                        onclick="
                        addDraftVariant(${index})">
                        + TAMBAH VARIAN
                    </button>

                    ${
                        menu.variants.length > 0
                        ? `
                        <div style="margin-top:10px">

                            <label>
                                Pilihan varian
                            </label>

                            <div class="variant-option">

                                <input
                                    type="radio"
                                    name="selection_${index}"
                                    ${
                                        menu.selection_type ===
                                        "multiple"
                                        ? ""
                                        : "checked"
                                    }
                                    onchange="
                                    changeSelectionType(
                                        ${index},
                                        'single'
                                    )">

                                <span>
                                    Hanya pilih satu
                                </span>

                            </div>

                            <div class="variant-option">

                                <input
                                    type="radio"
                                    name="selection_${index}"
                                    ${
                                        menu.selection_type ===
                                        "multiple"
                                        ? "checked"
                                        : ""
                                    }
                                    onchange="
                                    changeSelectionType(
                                        ${index},
                                        'multiple'
                                    )">

                                <span>
                                    Bisa pilih lebih dari satu
                                </span>

                            </div>

                        </div>
                        `
                        : ""
                    }

                </div>

                <button
                    class="danger"
                    onclick="
                    removeDraftMenu(${index})">
                    HAPUS MENU
                </button>

            </div>

    });
}

async function submitShopRegistration(){

    syncDraftMenus();

    if(
        !window.shopDraftInfo
    ){
        alert("Data kedai belum lengkap.");
        return;
    }

    for(
        let i=0;
        i<shopDraftMenus.length;
        i++
    ){

        const menu =
            shopDraftMenus[i];

        if(!menu.name.trim()){

            alert(
                "Nama Menu " +
                (i+1) +
                " belum diisi."
            );

            return;
        }

        const price =
            Number(menu.price);

        if(
            !Number.isFinite(price) ||
            price < 0
        ){

            alert(
                "Harga Menu " +
                (i+1) +
                " belum benar."
            );

            return;
        }

        menu.variants =
            uniqueVariantObjects(
                menu.variants.filter(
                    v=>v.name.trim()
                )
            );
    }

    app().innerHTML = `
        <div class="card loading">
            Menyimpan data kedai dan menu...
        </div>
    `;

    /*
       Ambil ID kurir langsung dari link pendaftaran.
       Jangan bergantung pada selectedCourierId karena
       variabel tersebut dapat berubah selama alur
       pendaftaran kedai.
    */

    const courierIdFromLink =
        urlParams.get("courier");

    const courierId =
        courierIdFromLink ||
        selectedCourierId;

    if(!courierId){

        alert(
            "ID kurir pada link pendaftaran tidak ditemukan."
        );

        return;
    }

    /*
       Pastikan ID kurir dari link benar-benar
       merupakan akun kurir yang ada di Supabase.
    */

    const {
        data:courier,
        error:courierError
    } =
        await db
        .from("couriers")
        .select("id")
        .eq("id",courierId)
        .maybeSingle();

    if(courierError || !courier){

        alert(
            "Akun kurir pada link tidak ditemukan."
        );

        return;
    }

    const registrationToken =
        randomToken(40);

    const {data:shop,error:shopError} =
        await db
        .from("shops")
        .insert({
            courier_id:courierId,
            name:window.shopDraftInfo.name,
            whatsapp:window.shopDraftInfo.whatsapp,
            latitude:window.shopDraftInfo.latitude,
            longitude:window.shopDraftInfo.longitude,
            registration_token:registrationToken
        })
        .select("*")
        .single();

    if(shopError){

        app().innerHTML = `
            <div class="card">

                <div class="error-box">
                    Gagal menyimpan kedai:<br><br>
                    ${escapeHtml(
                        shopError.message
                    )}
                </div>

                <button onclick="showShopMenuSetup()">
                    KEMBALI
                </button>

            </div>
        `;

        return;
    }

    let failed = null;

    for(
        const draft of shopDraftMenus
    ){

        const {data:menu,error:menuError} =
            await db
            .from("menus")
            .insert({
                shop_id:shop.id,
                name:draft.name.trim(),
                price:Number(draft.price)
            })
            .select("*")
            .single();

        if(menuError){
            failed = menuError;
            break;
        }

        if(
            draft.variants.length > 0
        ){

            const variantRows =
                uniqueVariantObjects(
                    draft.variants
                ).map(
                    v=>({
                        menu_id:menu.id,
                        name:v.name.trim()
                    })
                );

            const {
                error:variantError
            } =
                await db
                .from("menu_variants")
                .insert(variantRows);

            if(variantError){
                failed = variantError;
                break;
            }

            const {
                error:settingError
            } =
                await db
                .from(
                    "menu_variant_settings"
                )
                .insert({
                    menu_id:menu.id,
                    selection_type:
                        draft.selection_type
                });

            if(settingError){
                failed = settingError;
                break;
            }
        }
    }

    if(failed){

        app().innerHTML = `
            <div class="card">

                <div class="error-box">
                    Data kedai tersimpan sebagian,
                    tetapi ada menu yang gagal disimpan.<br><br>
                    ${escapeHtml(
                        failed.message
                    )}
                </div>

                <button
                    onclick="showShopMenuSetup()">
                    KEMBALI
                </button>

            </div>
        `;

        return;
    }

    currentShop = shop;

    saveShop(shop);

    window.shopDraftInfo = null;

    shopDraftMenus = [];

    app().innerHTML = `
        <div class="card">

            <div class="success-box">
                ✅ DATA KEDAI BERHASIL DISIMPAN
            </div>

            <h2>🏪 ${escapeHtml(shop.name)}</h2>

            <p>
                Kedai sudah terhubung dengan kurir.
            </p>

            <button
                onclick="showShopDashboard()">
                MASUK KE KEDAI
            </button>

        </div>
    `;
}

async function showShopMenus(){

    if(!currentShop) return;

    app().innerHTML =
        `<div class="card loading">
            Memuat menu...
        </div>`;

    const {data:menus,error} =
        await db
        .from("menus")
        .select("*")
        .eq("shop_id",currentShop.id)
        .order("created_at");

    if(error){

        app().innerHTML = `
            <div class="card">
                <div class="error-box">
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;

        return;
    }

    let html = `
        <div class="card">

            <h2>MENU ${escapeHtml(
                currentShop.name
            )}</h2>
    `;

    if(!menus || menus.length===0){

        html += `
            <div class="info">
                Belum ada menu.
            </div>
        `;
    }

    for(const menu of menus){

        const variants =
            await getMenuVariants(menu.id);

        html += `
            <div class="menu-card">

                <div class="menu-name">
                    ${escapeHtml(menu.name)}
                </div>

                <div class="menu-price">
                    ${money(menu.price)}
                </div>

                ${
                    variants.length > 0
                    ? `
                    <div class="variant-box">
                        <b>Varian:</b><br>
                        ${variants
                            .map(v=>
                                escapeHtml(v.name)
                            )
                            .join(", ")}
                    </div>
                    `
                    : ""
                }

                <button
                    class="small"
                    onclick="
                    editMenu('${menu.id}')">
                    EDIT MENU
                </button>

                <button
                    class="small danger"
                    onclick="
                    deleteMenu('${menu.id}')">
                    HAPUS MENU
                </button>

            </div>
        `;
    }

    html += `
            <button
                onclick="showShopAddMenu()">
                TAMBAH MENU
            </button>

            <button
                onclick="showShopDashboard()"
                class="secondary">
                KEMBALI
            </button>

        </div>
    `;

    app().innerHTML = html;
}

function uniqueVariantObjects(variants){

    const seen = new Set();

    return (variants || []).filter(v=>{

        const name =
            String(v?.name || "")
            .trim();

        const key =
            name.toLowerCase();

        if(!name || seen.has(key)){
            return false;
        }

        seen.add(key);
        return true;
    });
}

async function getMenuVariants(menuId){

    const {data,error} =
        await db
        .from("menu_variants")
        .select("*")
        .eq("menu_id",menuId)
        .order("created_at");

    if(error){
        return [];
    }

    return uniqueVariantObjects(data || []);
}

async function saveNewMenu(){

    const name =
        document.getElementById(
            "newMenuName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "newMenuPrice"
            ).value
        );

    if(!name){
        alert("Nama menu wajib diisi.");
        return;
    }

    if(!Number.isFinite(price) || price<0){
        alert("Harga menu tidak valid.");
        return;
    }

    const variantInputs =
        document.querySelectorAll(
            ".new-variant"
        );

    const variants =
        Array.from(variantInputs)
        .map(i=>i.value.trim())
        .filter(Boolean);

    const {data:menu,error} =
        await db
        .from("menus")
        .insert({
            shop_id:currentShop.id,
            name:name,
            price:price
        })
        .select("*")
        .single();

    if(error){

        alert(
            "Gagal menambahkan menu:\n" +
            error.message
        );

        return;
    }

    if(variants.length>0){

        const rows =
            variants.map(name=>({
                menu_id:menu.id,
                name:name
            }));

        const {
            error:variantError
        } =
            await db
            .from("menu_variants")
            .insert(rows);

        if(variantError){

            alert(
                "Menu tersimpan, tetapi varian gagal:\n" +
                variantError.message
            );

            return;
        }

        const selected =
            document.querySelector(
                'input[name="newSelection"]:checked'
            ).value;

        await db
        .from("menu_variant_settings")
        .upsert({
            menu_id:menu.id,
            selection_type:selected
        });
    }

    alert("Menu berhasil ditambahkan.");

    showShopMenus();
}

async function editMenu(menuId){

    const {data:menu,error} =
        await db
        .from("menus")
        .select("*")
        .eq("id",menuId)
        .eq("shop_id",currentShop.id)
        .single();

    if(error || !menu){

        alert("Menu tidak ditemukan.");
        return;
    }

    const variants =
        await getMenuVariants(menuId);

    const {
        data:setting
    } =
        await db
        .from("menu_variant_settings")
        .select("*")
        .eq("menu_id",menuId)
        .maybeSingle();

    window.editingMenu =
        {
            menu,
            variants,
            selection_type:
                setting?.selection_type ||
                "single"
        };

    renderEditMenu();
}

async function saveEditedMenu(){

    const data =
        window.editingMenu;

    const name =
        document.getElementById(
            "editMenuName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "editMenuPrice"
            ).value
        );

    if(!name){
        alert("Nama menu wajib diisi.");
        return;
    }

    if(!Number.isFinite(price) || price<0){
        alert("Harga tidak valid.");
        return;
    }

    const {
        error:menuError
    } =
        await db
        .from("menus")
        .update({
            name:name,
            price:price
        })
        .eq("id",data.menu.id)
        .eq("shop_id",currentShop.id);

    if(menuError){

        alert(
            "Gagal mengubah menu:\n" +
            menuError.message
        );

        return;
    }

    await db
        .from("menu_variants")
        .delete()
        .eq("menu_id",data.menu.id);

    const variants =
        uniqueVariantObjects(
            Array.from(
                document.querySelectorAll(
                    ".edit-variant"
                )
            )
            .map(i=>({
                name:i.value.trim()
            }))
            .filter(v=>v.name)
        );

    if(variants.length>0){

        await db
        .from("menu_variants")
        .insert(
            variants.map(name=>({
                menu_id:data.menu.id,
                name:name
            }))
        );

        const selection =
            document.querySelector(
                'input[name="editSelection"]:checked'
            )?.value || "single";

        await db
        .from(
            "menu_variant_settings"
        )
        .upsert({
            menu_id:data.menu.id,
            selection_type:selection
        });

    }else{

        await db
        .from(
            "menu_variant_settings"
        )
        .delete()
        .eq(
            "menu_id",
            data.menu.id
        );
    }

    alert("Menu berhasil diubah.");

    showShopMenus();
}

    box.innerHTML = "";

    shops.forEach(shop=>{

function filterCustomerShops(){

    const search =
        document.getElementById(
            "shopSearch"
        ).value
        .toLowerCase();

    const filtered =
        window.customerShops.filter(
            shop=>
                shop.name
                .toLowerCase()
                .includes(search)
        );

    drawCustomerShopList(
        filtered
    );
}

async function openCustomerShopMenu(shopId){

    const shop =
        window.customerShops
        .find(s=>s.id===shopId);

    if(!shop){
        alert("Kedai tidak ditemukan.");
        return;
    }

    selectedShopId = shopId;

    app().innerHTML =
        `<div class="card loading">
            Memuat menu ${escapeHtml(shop.name)}...
        </div>`;

    const {data:menus,error} =
        await db
        .from("menus")
        .select("*")
        .eq("shop_id",shopId)
        .order("name");

    if(error){

        app().innerHTML = `
            <div class="card">
                <div class="error-box">
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;

        return;
    }

    const menuData = [];

    for(const menu of menus || []){

        const variants =
            await getMenuVariants(
                menu.id
            );

        const {
            data:setting
        } =
            await db
            .from(
                "menu_variant_settings"
            )
            .select("*")
            .eq("menu_id",menu.id)
            .maybeSingle();

        menuData.push({
            menu,
            variants,
            selection_type:
                setting?.selection_type ||
                "single"
        });
    }

    window.currentCustomerShopMenu =
        menuData;

    renderCustomerShopMenu(
        shop,
        menuData
    );
}

function renderCustomerShopMenu(
    shop,
    menuData
){

    let html = `
        <div class="card">

            <h2>🏪 ${escapeHtml(shop.name)}</h2>
    `;

    if(menuData.length===0){

        html += `
            <div class="info">
                Kedai belum memiliki menu.
            </div>
        `;
    }

    menuData.forEach(item=>{

        const menu =
            item.menu;

        const key =
            shop.id +
            "_" +
            menu.id;

        const saved =
            cart[key] || {
                quantity:0,
                variants:[]
            };

        html += `
            <div class="menu-card">

                <div class="menu-row">

                    <div class="menu-info">

                        <div class="menu-name">
                            ${escapeHtml(
                                menu.name
                            )}
                        </div>

                        <div class="menu-price">
                            ${money(menu.price)}
                        </div>

                    </div>

                    <div class="qty-box">

                        <button
                            onclick="
                            changeCartQty(
                                '${key}',
                                -1
                            )">
                            −
                        </button>

                        <div
                            id="qty_${safeId(key)}"
                            class="qty-number">
                            ${saved.quantity}
                        </div>

                        <button
                            onclick="
                            changeCartQty(
                                '${key}',
                                1
                            )">
                            +
                        </button>

                    </div>

                </div>

                ${
                    item.variants.length > 0
                    ? `
                    <div class="variant-box">

                        ${item.variants.map(
                            (v,index)=>{

                            const checked =
                                saved.variants
                                .includes(v.name);

                            const inputType =
                                item.selection_type ===
                                "multiple"
                                ? "checkbox"
                                : "radio";

                            return `
                                <label
                                    class="variant-option">

                                    <input
                                        type="${inputType}"
                                        name="variant_${safeId(key)}"
                                        ${
                                            checked
                                            ? "checked"
                                            : ""
                                        }
                                        onchange="
                                        changeCartVariant(
                                            '${key}',
                                            '${escapeHtml(v.name).replace(/'/g,"\\'")}',
                                            ${
                                                item.selection_type ===
                                                "multiple"
                                                ? "true"
                                                : "false"
                                            }
                                        ">

                                    <span>
                                        ${escapeHtml(v.name)}
                                    </span>

                                </label>
                            `;
                        }).join("")}

                    </div>
                    `
                    : ""
                }

            </div>
        `;
    });

    html += `
            <button
                onclick="
                finishCustomerShopMenu()"
                class="success">
                SELESAI
            </button>

        </div>
    `;

    app().innerHTML = html;
}

function safeId(text){

    return btoa(
        String(text)
    )
    .replace(/[^a-zA-Z0-9]/g,"");
}

function changeCartQty(key,delta){

    if(!cart[key]){

        cart[key] = {
            quantity:0,
            variants:[]
        };
    }

    cart[key].quantity += delta;

    if(cart[key].quantity < 0){
        cart[key].quantity = 0;
    }

    const el =
        document.getElementById(
            "qty_" + safeId(key)
        );

    if(el){
        el.textContent =
            cart[key].quantity;
    }
}

function changeCartVariant(
    key,
    variant,
    multiple
){

    if(!cart[key]){

        cart[key] = {
            quantity:0,
            variants:[]
        };
    }

    if(multiple){

        const index =
            cart[key]
            .variants
            .indexOf(variant);

        if(index >= 0){

            cart[key]
            .variants
            .splice(index,1);

        }else{

            cart[key]
            .variants
            .push(variant);
        }

    }else{

        cart[key].variants =
            [variant];
    }
}

function finishCustomerShopMenu(){

    const menuData =
        window.currentCustomerShopMenu ||
        [];

    for(const item of menuData){

        const key =
            selectedShopId +
            "_" +
            item.menu.id;

        if(!cart[key]){

            cart[key] = {
                quantity:0,
                variants:[]
            };
        }

        const checkedInputs =
            Array.from(
                document.querySelectorAll(
                    'input[name="variant_' +
                    safeId(key) +
                    '"]:checked'
                )
            );

        if(item.variants.length > 0){

            cart[key].variants =
                uniqueVariantObjects(
                    checkedInputs.map(input=>({
                        name:input.value
                    }))
                ).map(v=>v.name);
        }else{

            cart[key].variants = [];
        }

        if(
            cart[key].quantity > 0 &&
            item.variants.length > 0 &&
            cart[key].variants.length === 0
        ){

            alert(
                "Silakan pilih varian untuk " +
                item.menu.name
            );

            return;
        }
    }

    showShopSelection();
}


/* =========================================================
   CART
========================================================= */

async function getCartDetailed(){

    const result = [];

    for(
        const key of Object.keys(cart)
    ){

        const line =
            cart[key];

        if(
            !line ||
            Number(line.quantity) <= 0
        ){
            continue;
        }

        const parts =
            key.split("_");

        const shopId =
            parts[0];

        const menuId =
            parts.slice(1).join("_");

        const {data:menu} =
            await db
            .from("menus")
            .select("*")
            .eq("id",menuId)
            .eq("shop_id",shopId)
            .maybeSingle();

        if(!menu) continue;

        const {
            data:shop
        } =
            await db
            .from("shops")
            .select("*")
            .eq("id",shopId)
            .maybeSingle();

        if(!shop) continue;

        result.push({
            key:key,
            shop:shop,
            menu:menu,
            quantity:Number(line.quantity),
            variants:Array.isArray(line.variants)
                ? line.variants
                : []
        });
    }

    return result;
}

function calculateCartTotal(lines){

    let total = 0;

    for(const line of lines){

        const price =
            Number(line.menu.price) || 0;

        const qty =
            Number(line.quantity) || 0;

        total +=
            price * qty;
    }

    return total;
}

async function showCart(){

    const lines =
        await getCartDetailed();

    if(lines.length===0){

        alert(
            "Belum ada menu yang dipilih."
        );

        return;
    }

    const grouped = {};

    lines.forEach(line=>{

        if(!grouped[line.shop.id]){
            grouped[line.shop.id] = {
                shop:line.shop,
                lines:[]
            };
        }

        grouped[line.shop.id]
            .lines
            .push(line);
    });

    let html = `
        <div class="card">

            <h2>🛒 PESANAN SAYA</h2>
    `;

    Object.values(grouped)
    .forEach(group=>{

        html += `
            <h3>
                🏪
                ${escapeHtml(
                    group.shop.name
                )}
            </h3>
        `;

        group.lines.forEach(line=>{

            const subtotal =
                Number(line.menu.price) *
                Number(line.quantity);

            html += `
                <div
                    style="
                    padding:8px 0;
                    border-bottom:1px solid #eee">

                    <b>
                        ${escapeHtml(
                            line.menu.name
                        )}
                    </b>

                    ${
                        line.variants.length
                        ? `
                        <div style="
                            font-size:13px;
                            color:#555">
                            Varian:
                            ${escapeHtml(
                                line.variants.join(", ")
                            )}
                        </div>
                        `
                        : ""
                    }

                    <div>
                        ${line.quantity}
                        x
                        ${money(line.menu.price)}

                        <span style="float:right">
                            ${money(subtotal)}
                        </span>
                    </div>

                </div>
            `;
        });

        html += `<hr>`;
    });

    const total =
        calculateCartTotal(lines);

    html += `
            <div class="total-box">

                <div class="total-line">

                    <span>
                        TOTAL PESANAN
                    </span>

                    <b>
                        ${money(total)}
                    </b>

                </div>

            </div>

            <button
                onclick="
                sendCustomerOrder()"
                class="success">
                KIRIM PESANAN
            </button>

            <button
                onclick="
                showShopSelection()"
                class="secondary">
                KEMBALI PILIH KEDAI
            </button>

        </div>
    `;

    app().innerHTML = html;
}

async function sendCustomerOrder(){

    const lines =
        await getCartDetailed();

    if(lines.length===0){

        alert(
            "Pesanan masih kosong."
        );

        return;
    }

    if(!selectedOrderLocation){

        alert(
            "Lokasi pesanan belum diambil."
        );

        return;
    }

    app().innerHTML =
        `<div class="card loading">
            Mengirim pesanan...
        </div>`;

    const total =
        calculateCartTotal(lines);

    const {
        data:order,
        error:orderError
    } =
        await db
        .from("orders")
        .insert({
            courier_id:
                currentCustomer.courier_id,

            customer_id:
                currentCustomer.id,

            latitude:
                selectedOrderLocation.latitude,

            longitude:
                selectedOrderLocation.longitude,

            total:total,

            delivery_fee:0,

            total_payment:total,

            status:"menunggu_stok"
        })
        .select("*")
        .single();

    if(orderError){

        app().innerHTML = `
            <div class="card">

                <div class="error-box">
                    Gagal membuat pesanan:<br><br>
                    ${escapeHtml(
                        orderError.message
                    )}
                </div>

                <button onclick="showCart()">
                    KEMBALI
                </button>

            </div>
        `;

        return;
    }

    const grouped = {};

    lines.forEach(line=>{

        if(!grouped[line.shop.id]){

            grouped[line.shop.id] = {
                shop:line.shop,
                lines:[]
            };
        }

        grouped[line.shop.id]
            .lines
            .push(line);
    });

    let shopOrderRows = [];

    for(
        const group of Object.values(grouped)
    ){

        shopOrderRows.push({
            order_id:order.id,
            shop_id:group.shop.id,
            stock_token:randomToken(48),
            customer_result_token:randomToken(48),
            process_token:randomToken(48),
            status:"menunggu_stok"
        });
    }

    const {
        data:shopOrders,
        error:shopOrderError
    } =
        await db
        .from("shop_orders")
        .insert(shopOrderRows)
        .select("*");

    if(shopOrderError){

        alert(
            "Pesanan dibuat tetapi pembagian kedai gagal:\n" +
            shopOrderError.message
        );

        return;
    }

    let orderItems = [];

    for(
        const shopOrder of shopOrders
    ){

        const group =
            grouped[shopOrder.shop_id];

        group.lines.forEach(line=>{

            orderItems.push({
                order_id:
                    order.id,

                shop_order_id:
                    shopOrder.id,

                menu_id:
                    line.menu.id,

                menu_name:
                    line.menu.name,

                variant:
                    line.variants.length
                    ? line.variants.join(", ")
                    : null,

                price:
                    Number(line.menu.price),

                quantity:
                    Number(line.quantity),

                stock_status:
                    "menunggu"
            });
        });
    }

    const {
        error:itemError
    } =
        await db
        .from("order_items")
        .insert(orderItems);

    if(itemError){

        alert(
            "Item pesanan gagal disimpan:\n" +
            itemError.message
        );

        return;
    }

    currentOrderId = order.id;

    cart = {};

    showOrderSent();
}

async function showStockCheck(){

    const orderId =
        urlParams.get("order");

    const shopId =
        urlParams.get("shop");

    const token =
        urlParams.get("token");

    if(!orderId || !shopId || !token){

        showInvalidLink(
            "Link cek stok tidak lengkap."
        );

        return;
    }

    app().innerHTML =
        `<div class="card loading">
            Memuat pesanan...
        </div>`;

    const {
        data:shopOrder,
        error:shopOrderError
    } =
        await db
        .from("shop_orders")
        .select("*")
        .eq("id",shopId)
        .maybeSingle();

    /*
       Fallback query menggunakan order_id/shop_id/token.
    */

    let found = shopOrder;

    if(
        !found ||
        shopOrderError
    ){

        const {
            data:fallback
        } =
            await db
            .from("shop_orders")
            .select("*")
            .eq("order_id",orderId)
            .eq("shop_id",shopId)
            .eq("stock_token",token)
            .maybeSingle();

        found = fallback;
    }

    if(
        !found ||
        found.order_id !== orderId ||
        found.shop_id !== shopId ||
        found.stock_token !== token
    ){

        showInvalidLink(
            "Link cek stok tidak valid atau sudah berubah."
        );

        return;
    }

    const {
        data:shop
    } =
        await db
        .from("shops")
        .select("*")
        .eq("id",shopId)
        .maybeSingle();

    if(!shop){

        showInvalidLink(
            "Data kedai tidak ditemukan."
        );

        return;
    }

    const {
        data:items,
        error:itemError
    } =
        await db
        .from("order_items")
        .select("*")
        .eq(
            "shop_order_id",
            found.id
        )
        .order("created_at");

    if(itemError){

        showInvalidLink(
            itemError.message
        );

        return;
    }

    window.currentStockShopOrder =
        found;

    window.currentStockItems =
        items || [];

    renderStockCheck(
        shop,
        found,
        items || []
    );
}

        await db
        .from("order_items")

        .eq(

            itemId

        .eq(
            "shop_order_id",

            error.message

async function saveDeliveryFee(
    orderId
){

    const fee =
        Number(
            document.getElementById(
                "deliveryFee"
            ).value
        );

    if(
        !Number.isFinite(fee) ||
        fee < 0
    ){

        alert("Ongkir tidak valid.");
        return;
    }

    const {
        data:order,
        error
    } =
        await db
        .from("orders")
        .select("*")
        .eq("id",orderId)
        .eq(
            "courier_id",
            currentCourier.id
        )
        .single();

    if(error || !order){

        alert("Pesanan tidak ditemukan.");
        return;
    }

    const totalPayment =
        Number(order.total) +
        fee;

    const {
        data:updated,
        error:updateError
    } =
        await db
        .from("orders")
        .update({
            delivery_fee:fee,
            total_payment:totalPayment,
            status:"ongkir_dikirim"
        })
        .eq("id",orderId)
        .select("*")
        .single();

    if(updateError){

        alert(
            "Gagal menyimpan ongkir:\n" +
            updateError.message
        );

        return;
    }

    const {
        data:customer
    } =
        await db
        .from("customers")
        .select("*")
        .eq(
            "id",
            order.customer_id
        )
        .maybeSingle();

    if(customer){

        const message =
            "🧾 NGURIR SIMPEL\n\n" +
            "Pesanan Anda sudah dihitung.\n\n" +
            "TOTAL PESANAN: " +
            money(order.total) +
            "\n" +
            "ONGKIR: " +
            money(fee) +
            "\n\n" +
            "TOTAL BAYAR: " +
            money(totalPayment);

        window.lastDeliveryWhatsApp =
            waLink(
                customer.whatsapp,
                message
            );
    }

    app().innerHTML = `
        <div class="card">

            <div class="success-box">
                ✅ ONGKIR BERHASIL DISIMPAN
            </div>

            <div class="total-box">

                <div class="total-line">
                    <span>
                        TOTAL PESANAN
                    </span>

                    <b>
                        ${money(order.total)}
                    </b>
                </div>

                <div class="total-line">
                    <span>
                        ONGKIR
                    </span>

                    <b>
                        ${money(fee)}
                    </b>
                </div>

                <div class="
                    total-line
                    total-main">

                    <span>
                        TOTAL BAYAR
                    </span>

                    <b>
                        ${money(totalPayment)}
                    </b>

                </div>

            </div>

            ${
                window.lastDeliveryWhatsApp
                ? `
                <button
                    onclick="
                    openWhatsAppLink(
                        '${window.lastDeliveryWhatsApp.replace(/'/g,"\\'")}'
                    )">
                    KIRIM KE PELANGGAN VIA WHATSAPP
                </button>
                `
                : ""
            }

            <button
                onclick="
                showCourierProcessedOrders()"
                class="secondary">
                KEMBALI

    `;
}

/* =========================================================
   MAIN ROUTER
========================================================= */

async function render(){

    const page =
        urlParams.get("page");

    /*
       Jika tidak ada page:
       coba akun kurir tersimpan.
    */

    if(!page){

        const savedCourier =
            loadCourier();

        if(savedCourier){

            currentCourier =
                savedCourier;

            await verifySavedCourier();

            return;
        }

        showHome();

        return;
    }

    switch(page){

        case "home":
            showHome();
            break;

        case "shop-register":
            await showShopRegister();
            break;

        case "customer":
            await showCustomerEntry();
            break;

        case "stock":
            await showStockCheck();
            break;

        case "result":
            await showCustomerResult();
            break;

        default:
            showHome();
    }
}

                        ${
                            item.variant

                            <div style="
                                font-size:13px;
                                color:#666">
                                Varian:

                                    item.variant

}

async function openShopStockOrder(shopOrderId){

    const {
        data:shopOrder,
        error
    } =
        await db
        .from("shop_orders")
        .select("*")
        .eq(
            "id",
            shopOrderId
        )
        .eq(
            "shop_id",
            currentShop.id
        )
        .maybeSingle();

    if(error || !shopOrder){

        alert("Pesanan tidak ditemukan.");
        return;
    }

    window.currentStockShopOrder =
        shopOrder;

    const {
        data:items
    } =
        await db
        .from("order_items")
        .select("*")
        .eq(
            "shop_order_id",
            shopOrder.id
        )
        .order("created_at");

    window.currentStockItems =
        items || [];

    const {
        data:order
    } =
        await db
        .from("orders")
        .select("customer_id")
        .eq(
            "id",
            shopOrder.order_id
        )
        .maybeSingle();

    const {
        data:customer
    } =
        order
        ? await db
            .from("customers")
            .select("name")
            .eq(
                "id",
                order.customer_id
            )
            .maybeSingle()
        : {data:null};

    renderInternalStockCheck(
        currentShop,
        shopOrder,
        items || [],
        customer?.name || "-"
    );
}

function renderInternalStockCheck(
    shop,
    shopOrder,
    items,
    customerName
){

    let html = `
        <div class="card">

            <h2>📦 CEK STOK PESANAN</h2>

            <h3>
                🏪
                ${escapeHtml(shop.name)}
            </h3>

            <div class="info">
                Pelanggan:
                <b>
                    ${escapeHtml(customerName)}
                </b>
            </div>
    `;

    items.forEach(item=>{

        const status =
            item.stock_status;

        html += `
            <div class="status-row">

                <div class="status-name">

                    <b>
                        ${escapeHtml(
                            item.menu_name
                        )}
                    </b>

                    ${
                        item.variant
                        ? `
                        <div style="
                            font-size:13px;
                            color:#666">
                            Varian:
                            ${escapeHtml(
                                item.variant
                            )}
                        </div>
                        `
                        : ""
                    }

                    <div>
                        Jumlah:
                        ${Number(item.quantity) || 0}
                    </div>

                </div>

                <div class="status-buttons">

                    <button
                        class="${
                            status === "ada"
                            ? "active-ada"
                            : ""
                        }"
                        onclick="
                        setStockStatusInternal(
                            '${item.id}',
                            'ada'
                        )">
                        ADA
                    </button>

                    <button
                        class="${
                            status === "kosong"
                            ? "active-kosong"
                            : ""
                        }"
                        onclick="
                        setStockStatusInternal(
                            '${item.id}',
                            'kosong'
                        )">
                        KOSONG
                    </button>

                </div>

            </div>
        `;
    });

    html += `
            <button
                onclick="sendStockResultInternal()"
                class="success">
                KIRIM HASIL CEK STOK
            </button>

            <button
                onclick="showShopStockChecks()"
                class="secondary">
                KEMBALI
            </button>

        </div>
    `;

    app().innerHTML = html;
}

async function setStockStatusInternal(
    itemId,
    status
){

    const {
        error
    } =
        await db
        .from("order_items")
        .update({
            stock_status:status
        })
        .eq(
            "id",
            itemId
        )
        .eq(
            "shop_order_id",
            window.currentStockShopOrder.id
        );

    if(error){

        alert(
            "Gagal mengubah status:\n" +
            error.message
        );

        return;
    }

    await openShopStockOrder(
        window.currentStockShopOrder.id
    );
}

async function sendStockResultInternal(){

    const {
        data:items,
        error:itemError
    } =
        await db
        .from("order_items")
        .select("stock_status")
        .eq(
            "shop_order_id",
            window.currentStockShopOrder.id
        );

    if(itemError){

        alert(
            "Gagal memeriksa stok:\n" +
            itemError.message
        );

        return;
    }

    if(
        !items ||
        items.length===0
    ){

        alert("Tidak ada item pesanan.");
        return;
    }

    const incomplete =
        items.some(
            item=>
                !["ada","kosong"]
                .includes(
                    item.stock_status
                )
        );

    if(incomplete){

        alert(
            "Semua menu harus diberi status ADA atau KOSONG."
        );

        return;
    }

    const {
        data,
        error
    } =
        await db
        .from("shop_orders")
        .update({
            status:"hasil_stok"
        })
        .eq(
            "id",
            window.currentStockShopOrder.id
        )
        .eq(
            "shop_id",
            currentShop.id
        )
        .select("*")
        .single();

    if(error){

        alert(
            "Gagal mengirim hasil:\n" +
            error.message
        );

        return;
    }

    window.currentStockShopOrder =
        data;

    await sendCustomerResultLink(data);

    app().innerHTML = `
        <div class="card">

            <div class="success-box">
                ✅ HASIL CEK STOK BERHASIL DISIMPAN
            </div>

            <p>
                Hasil pengecekan stok kedai sudah
                tersimpan dan dapat diproses
                oleh pelanggan.
            </p>

            <button
                onclick="showShopStockChecks()"
                class="secondary">
                KEMBALI KE PENGECEKAN STOK
            </button>

            <button
                onclick="showShopOrders()">
                LIHAT PESANAN
            </button>

        </div>
    `;
}

<body>

<header>
🚚 NGURIR SIMPEL
</header>

<div id="app" class="container">

Memuat aplikasi...

<script>

/* =========================================================
   NGURIR SIMPEL
   KONEKSI SUPABASE
========================================================= */


/* =========================================================
   GANTI DUA BAGIAN INI
========================================================= */

const SUPABASE_URL =
"TEMPEL_PROJECT_URL_DI_SINI";

const SUPABASE_KEY =
"TEMPEL_PUBLISHABLE_KEY_DI_SINI";


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   DATA LOGIN LOKAL
========================================================= */

let currentCourier =
JSON.parse(localStorage.getItem("ngurirCourier"));

let currentCustomer =
JSON.parse(localStorage.getItem("ngurirCustomer"));


/* =========================================================
   ROUTER
========================================================= */

function getParams(){

    return new URLSearchParams(
        window.location.search
    );

}


async function startApp(){

    const params = getParams();

    if(
        params.get("daftarKedai")
    ){

        return shopRegisterPage(
            params.get("daftarKedai")
        );

    }


    if(
        params.get("pelanggan")
    ){

        return customerRegisterPage(
            params.get("pelanggan")
        );

    }


    if(
        params.get("cekStok")
    ){

        return shopStockPage(
            params.get("cekStok"),
            params.get("token")
        );

    }


    if(
        params.get("statusPesanan")
    ){

        return customerOrderStatusPage(
            params.get("statusPesanan")
        );

    }


    if(currentCourier){

        return courierHome();

    }


    if(currentCustomer){

        return customerHome();

    }


    courierStartPage();

}


/* =========================================================
   TAMPILKAN HALAMAN
========================================================= */

function show(html){

    document.getElementById("app").innerHTML =
    html;

}


function message(text){

    alert(text);

}


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function rupiah(number){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(number || 0);

}


/* =========================================================
   FORMAT WAKTU
========================================================= */

function formatDate(date){

    if(!date) return "-";

    return new Date(date).toLocaleString(
        "id-ID"
    );

}


/* =========================================================
   GENERATE KODE
========================================================= */

function randomCode(){

    return Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

}


/* =========================================================
   SALIN TEXT
========================================================= */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(
            text
        );

        message("Berhasil disalin");

    }
    catch(error){

        message(text);

    }

}


/* =========================================================
   BUKA WHATSAPP
========================================================= */

function openWhatsApp(
    phone,
    text
){

    let number =
    String(phone || "")
    .replace(/\D/g,"");

    if(
        number.startsWith("0")
    ){

        number =
        "62" + number.substring(1);

    }

    const url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(text);

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   HALAMAN AWAL KURIR
========================================================= */

function courierStartPage(){

show(`

<div class="card">

<h2>🚚 NGURIR SIMPEL</h2>

<p>
Aplikasi pemesanan untuk Kurir,
Kedai, dan Pelanggan.
</p>

<button
class="primary"
onclick="courierLoginPage()"
>
MASUK KURIR
</button>

<button
class="success"
onclick="courierRegisterPage()"
>
DAFTAR KURIR
</button>

</div>

`);

}


/* =========================================================
   LOGIN KURIR
========================================================= */

function courierLoginPage(){

show(`

<div class="card">

<h2>MASUK KURIR</h2>

<input
id="courierPhone"
placeholder="Nomor WhatsApp"
/>

<button
class="primary"
onclick="courierLogin()"
>
MASUK
</button>

<button
class="gray"
onclick="courierStartPage()"
>
KEMBALI
</button>

</div>

`);

}


async function courierLogin(){

    const phone =
    document
    .getElementById("courierPhone")
    .value
    .trim();


    if(!phone){

        return message(
            "Masukkan nomor WhatsApp"
        );

    }


    const {
        data,
        error
    }
    =
    await supabaseClient
    .from("couriers")
    .select("*")
    .eq("phone",phone)
    .maybeSingle();


    if(error){

        return message(
            error.message
        );

    }


    if(!data){

        return message(
            "Kurir belum terdaftar"
        );

    }


    currentCourier = data;

    localStorage.setItem(
        "ngurirCourier",
        JSON.stringify(data)
    );


    courierHome();

}


/* =========================================================
   DAFTAR KURIR
========================================================= */

function courierRegisterPage(){

show(`

<div class="card">

<h2>DAFTAR KURIR</h2>

<input
id="courierName"
placeholder="Nama Kurir"
/>

<textarea
id="courierAddress"
placeholder="Alamat"
></textarea>

<input
id="courierPhoneRegister"
placeholder="Nomor WhatsApp"
/>

<button
class="warning"
onclick="getCourierLocation()"
>
📍 BAGIKAN LOKASI
</button>

<div id="locationInfo"></div>

<button
class="success"
onclick="saveCourier()"
>
SELESAI
</button>

<button
class="gray"
onclick="courierStartPage()"
>
KEMBALI
</button>

</div>

`);

}


let courierLatitude = null;
let courierLongitude = null;


function getCourierLocation(){

    if(
        !navigator.geolocation
    ){

        return message(
            "GPS tidak tersedia"
        );

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            courierLatitude =
            position.coords.latitude;

            courierLongitude =
            position.coords.longitude;


            document
            .getElementById(
                "locationInfo"
            )
            .innerHTML =

            `
            <div class="status success">
            ✓ Lokasi berhasil diambil
            </div>
            `;

        },

        function(){

            message(
                "Gagal mengambil lokasi"
            );

        }

    );

}


async function saveCourier(){

    const name =
    document
    .getElementById("courierName")
    .value.trim();


    const address =
    document
    .getElementById("courierAddress")
    .value.trim();


    const phone =
    document
    .getElementById(
        "courierPhoneRegister"
    )
    .value.trim();


    if(
        !name ||
        !address ||
        !phone
    ){

        return message(
            "Lengkapi semua data"
        );

    }


    const {
        data:oldCourier
    }
    =
    await supabaseClient
    .from("couriers")
    .select("*")
    .eq("phone",phone)
    .maybeSingle();


    if(oldCourier){

        currentCourier =
        oldCourier;

        localStorage.setItem(
            "ngurirCourier",
            JSON.stringify(oldCourier)
        );

        return courierHome();

    }


    const {
        data,
        error
    }
    =
    await supabaseClient
    .from("couriers")
    .insert({

        name:name,
        address:address,
        phone:phone,

        latitude:
        courierLatitude,

        longitude:
        courierLongitude,

        location:
        courierLatitude ?
        courierLatitude +
        "," +
        courierLongitude
        :
        null

    })
    .select()
    .single();


    if(error){

        return message(
            error.message
        );

    }


    currentCourier = data;


    localStorage.setItem(
        "ngurirCourier",
        JSON.stringify(data)
    );


    message(
        "Pendaftaran kurir berhasil"
    );


    courierHome();

}

   MENU UTAMA KURIR
========================================================= */

function courierHome(){

show(`

<div class="card">

<h2>
👨‍✈️ ${currentCourier.name}
</h2>

<p>
Nomor WhatsApp:
<br>

<button

function courierLogout(){

    localStorage.removeItem(
        "ngurirCourier"
    );

    currentCourier = null;

    startApp();

}


/* =========================================================
   EDIT KURIR
========================================================= */

function courierEditPage(){

show(`

<div class="card">

<h2>EDIT AKUN</h2>

<input
id="editCourierName"
value="${currentCourier.name || ""}"
/>

<textarea
id="editCourierAddress"
>${currentCourier.address || ""}</textarea>

<input
id="editCourierPhone"
value="${currentCourier.phone || ""}"
/>

<button
class="success"
onclick="updateCourier()"
>
SIMPAN
</button>

<button
class="gray"
onclick="courierHome()"
>
KEMBALI
</button>

</div>

`);

}


async function updateCourier(){

    const name =
    document
    .getElementById(
        "editCourierName"
    )
    .value.trim();


    const address =
    document
    .getElementById(
        "editCourierAddress"
    )
    .value.trim();


    const phone =
    document
    .getElementById(
        "editCourierPhone"
    )
    .value.trim();


    const {
        data,
        error
    }
    =
    await supabaseClient
    .from("couriers")
    .update({

        name,
        address,
        phone

    })
    .eq(
        "id",
        currentCourier.id
    )
    .select()
    .single();


    if(error){

        return message(
            error.message
        );

    }


    currentCourier = data;


    localStorage.setItem(
        "ngurirCourier",
        JSON.stringify(data)
    );


    message("Data berhasil disimpan");

    courierHome();

}

   ATUR LAYANAN KURIR

/* =========================================================
   DAFTAR KEDAI
========================================================= */

function shopRegisterPage(courierId){

show(`

<div class="card">

<h2>🏪 DAFTAR KEDAI</h2>

<input
id="shopName"
placeholder="Nama Kedai"
/>

<input
id="shopPhone"
placeholder="Nomor WhatsApp Kedai"
/>

<button
class="success"
onclick="saveShop('${courierId}')"
>
SELESAI
</button>

</div>

`);

}


async function saveShop(courierId){

    const name =
    document
    .getElementById("shopName")
    .value.trim();


    const phone =
    document
    .getElementById("shopPhone")
    .value.trim();


    if(!name || !phone){

        return message(
            "Lengkapi data kedai"
        );

    }


    const {
        data,
        error
    }
    =
    await supabaseClient
    .from("shops")
    .insert({

        courier_id:
        courierId,

        name:name,

        phone:phone

    })
    .select()
    .single();


    if(error){

        return message(
            error.message
        );

    }


    message(
        "Kedai berhasil terdaftar"
    );


    shopMenuManagePage(
        data.id
    );

}


/* =========================================================
   KEDAI MILIK KURIR
========================================================= */

async function courierShopsPage(){

show(`

<div class="loading">
Memuat kedai...
</div>

`);


    const {
        data:shops,
        error
    }
    =
    await supabaseClient
    .from("shops")
    .select("*")
    .eq(
        "courier_id",
        currentCourier.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        return message(
            error.message
        );

    }


    let html = `

    <div class="card">

    <h2>KEDAI SAYA</h2>

    `;


    if(
        !shops ||
        shops.length === 0
    ){

        html +=
        "<p>Belum ada kedai.</p>";

    }


    shops.forEach(shop=>{

        html += `

        <div class="shop-box">

        <b>${shop.name}</b>

        <br>

        ${shop.phone}

        <button
        class="primary"
        onclick="shopMenuManagePage('${shop.id}')"
        >
        KELOLA MENU
        </button>

        </div>

        `;

    });


    html += `

    <button
    class="gray"
    onclick="courierServicePage()"
    >
    KEMBALI
    </button>

    </div>

    `;


    show(html);

}


/* =========================================================
   KELOLA MENU KEDAI
========================================================= */

async function shopMenuManagePage(shopId){

show(`

<div class="loading">
Memuat menu...
</div>

`);


    const {
        data:shop
    }
    =
    await supabaseClient
    .from("shops")
    .select("*")
    .eq("id",shopId)
    .single();


    const {
        data:menus,
        error
    }
    =
    await supabaseClient
    .from("menus")
    .select("*")
    .eq("shop_id",shopId);


    if(error){

        return message(
            error.message
        );

    }


    let html = `

    <div class="card">

    <h2>
    MENU ${shop.name}
    </h2>

    <input
    id="menuName"
    placeholder="Nama Menu"
    >

    <input
    id="menuPrice"
    type="number"
    placeholder="Harga"
    >

    <input
    id="menuVariant"
    placeholder="Varian opsional"
    >

    <button
    class="success"
    onclick="addMenu('${shopId}')"
    >
    TAMBAH MENU
    </button>

    </div>


    <div class="card">

    <h3>DAFTAR MENU</h3>

    `;


    if(
        !menus ||
        menus.length === 0
    ){

        html +=
        "<p>Belum ada menu.</p>";

    }


    menus.forEach(menu=>{

        html += `

        <div class="shop-box">

        <b>${menu.name}</b>

        <br>

        ${rupiah(menu.price)}

        <br>

        Varian:
        ${menu.variant || "-"}

        <button
        class="danger"
        onclick="deleteMenu('${menu.id}','${shopId}')"
        >
        HAPUS
        </button>

        </div>

        `;

    });


    html += `

    </div>

    <div class="card">

    <button
    class="gray"
    onclick="courierShopsPage()"
    >
    KEMBALI
    </button>

    </div>

    `;


    show(html);

}


async function addMenu(shopId){

    const name =
    document
    .getElementById("menuName")
    .value.trim();


    const price =
    Number(
        document
        .getElementById("menuPrice")
        .value
    );


    const variant =
    document
    .getElementById("menuVariant")
    .value.trim();


    if(!name || !price){

        return message(
            "Nama dan harga wajib diisi"
        );

    }


    const {
        error
    }
    =
    await supabaseClient
    .from("menus")
    .insert({

        shop_id:shopId,

        name:name,

        price:price,

        variant:
        variant || null

    });


    if(error){

        return message(
            error.message
        );

    }


    shopMenuManagePage(shopId);

}


async function deleteMenu(
    menuId,
    shopId
){

    if(
        !confirm("Hapus menu?")
    ){

        return;

    }


    const {
        error
    }
    =
    await supabaseClient
    .from("menus")
    .delete()
    .eq("id",menuId);


    if(error){

        return message(
            error.message
        );

    }


    shopMenuManagePage(shopId);

}

async function saveCustomer(courierId){

    const name =
    document
    .getElementById("customerName")
    .value.trim();


    const phone =
    document
    .getElementById("customerPhone")
    .value.trim();


    const address =
    document
    .getElementById("customerAddress")
    .value.trim();


    if(
        !name ||
        !phone ||
        !address
    ){

        return message(
            "Lengkapi semua data"
        );

    }


    let {
        data:oldCustomer
    }
    =
    await supabaseClient
    .from("customers")
    .select("*")
    .eq("phone",phone)
    .maybeSingle();


    if(oldCustomer){

        currentCustomer =
        oldCustomer;

        currentCustomer.courier_id =
        courierId;


        localStorage.setItem(

function changeQty(
    menuId,
    shopId,
    change
){

    const element =
    document.getElementById(
        "qty-" + menuId
    );


    let qty =
    Number(
        element.innerText
    );


    qty += change;


    if(qty < 0){

        qty = 0;

    }


    element.innerText = qty;

}

========================================================= */

function getOrderLocation(){

    if(
        !navigator.geolocation
    ){

        return message(
            "GPS tidak tersedia"
        );

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            orderLatitude =
            position.coords.latitude;

            orderLongitude =
            position.coords.longitude;


            document
            .getElementById(
                "orderLocationInfo"
            )
            .innerHTML =

            `
            <div class="status success">
            ✓ Lokasi pesanan berhasil diambil
            </div>
            `;

        },

        function(){

            message(
                "Gagal mengambil lokasi"
            );

        }

    );

}

async function orderSummaryPage(){

    const qtyElements =
    document.querySelectorAll(
        "[id^='qty-']"
    );


    const menuIds = [];


    qtyElements.forEach(element=>{

        const qty =
        Number(element.innerText);

        if(qty > 0){

            menuIds.push(
                element.id.replace(
                    "qty-",
                    ""
                )
            );

        }

    });


    if(
        menuIds.length === 0
    ){

        return message(
            "Pilih minimal satu menu"
        );

    }


    const {
        data:menus,
        error
    }
    =
    await supabaseClient
    .from("menus")
    .select("*")
    .in("id",menuIds);


    if(error){

        return message(
            error.message
        );

    }


    selectedItems = [];


    menus.forEach(menu=>{

        const qty =
        Number(
            document
            .getElementById(
                "qty-" + menu.id
            )
            .innerText
        );


        let variants = [];


        const variantElements =
        document.querySelectorAll(
            ".variant-" + menu.id + ":checked"
        );


        variantElements.forEach(v=>{

            variants.push(v.value);

        });


        if(
            variants.length === 0
        ){

            selectedItems.push({

                menu_id:
                menu.id,

                shop_id:
                menu.shop_id,

                name:
                menu.name,

                price:
                Number(menu.price),

                variant:null,

                qty:qty

            });

        }

        else{

            variants.forEach(v=>{

                selectedItems.push({

                    menu_id:
                    menu.id,

                    shop_id:
                    menu.shop_id,

                    name:
                    menu.name,

                    price:
                    Number(menu.price),

                    variant:v,

                    qty:qty

                });

            });

        }

    });


    const shopIds =
    [
        ...new Set(
            selectedItems.map(
                item=>item.shop_id
            )
        )
    ];


    const {
        data:shops
    }
    =
    await supabaseClient
    .from("shops")
    .select("*")
    .in("id",shopIds);


    let total = 0;


    let html = `

    <div class="card">

    <h2>RINGKASAN PESANAN</h2>

    `;


    shops.forEach(shop=>{

        html += `

        <div class="shop-box">

        <h3>${shop.name}</h3>

        `;


        const items =
        selectedItems.filter(
            item=>
            item.shop_id === shop.id
        );


        let subtotal = 0;


        items.forEach(item=>{

            const itemTotal =
            item.price *
            item.qty;


            subtotal +=
            itemTotal;


            html += `

            <p>

            ${item.name}

            ${item.variant ?
            "(" +
            item.variant +
            ")"
            :
            ""
            }

            x${item.qty}

            <br>

            ${rupiah(itemTotal)}

            </p>

            `;

        });


        total += subtotal;


        html += `

        <b>
        Subtotal:
        ${rupiah(subtotal)}
        </b>

        </div>

        `;

    });


    html += `

    <hr>

    <h3>
    TOTAL PESANAN:
    ${rupiah(total)}
    </h3>

    <button
    class="success"
    onclick="sendOrder(${total})"
    >
    KIRIM PESANAN
    </button>

    <button
    class="gray"
    onclick="loadSelectedShopMenus()"
    >
    KEMBALI
    </button>

    </div>

    `;


    show(html);

}

async function sendOrder(total){

    if(
        !orderLatitude ||
        !orderLongitude
    ){

        return message(
            "Silakan ambil SERLOK terlebih dahulu"
        );

    }


    const courierId =
    currentCustomer.courier_id;


    const orderCode =
    "ORD-" +
    Date.now();


    const token =
    crypto.randomUUID();


    const {
        data:order,
        error
    }
    =
    await supabaseClient
    .from("orders")
    .insert({

        order_code:
        orderCode,

        courier_id:
        courierId,

        customer_id:
        currentCustomer.id,

        customer_name:
        currentCustomer.name,

        customer_phone:
        currentCustomer.phone,

        customer_address:
        currentCustomer.address,

        total:
        total,

        final_total:
        total,

        status:
        "menunggu_cek_stok",

        status_token:
        token

    })
    .select()
    .single();


    if(error){

        return message(
            error.message
        );

    }


    const shopIds =
    [
        ...new Set(
            selectedItems.map(
                item=>item.shop_id
            )
        )
    ];


    for(
        const shopId of shopIds
    ){

        const shopToken =
        crypto.randomUUID();


        const shopItems =
        selectedItems.filter(
            item=>
            item.shop_id === shopId
        );


        const shopTotal =
        shopItems.reduce(
            (sum,item)=>
            sum +
            (
                item.price *
                item.qty
            ),
            0
        );


        const {
            data:shopOrder,
            error:shopError
        }
        =
        await supabaseClient
        .from("shop_orders")
        .insert({

            order_id:
            order.id,

            shop_id:
            shopId,

            status:
            "menunggu_cek_stok",

            token:
            shopToken,

            total:
            shopTotal

        })
        .select()
        .single();


        if(shopError){

            return message(
                shopError.message
            );

        }


        for(
            const item of shopItems
        ){

            const {
                error:itemError
            }
            =
            await supabaseClient
            .from("order_items")
            .insert({

                order_id:
                order.id,

                shop_order_id:
                shopOrder.id,

                menu_id:
                item.menu_id,

                shop_id:
                item.shop_id,

                menu_name:
                item.name,

                variant:
                item.variant,

                price:
                item.price,

                qty:
                item.qty,

                status:
                "menunggu"

            });


            if(itemError){

                return message(
                    itemError.message
                );

            }

        }


        const {
            data:shop
        }
        =
        await supabaseClient
        .from("shops")
        .select("*")
        .eq("id",shopId)
        .single();


        const stockLink =
        window.location.origin +
        window.location.pathname +
        "?cekStok=" +
        shopOrder.id +
        "&token=" +
        shopToken;


        const waText =
        `Halo ${shop.name}.

Ada pesanan baru.

Silakan cek stok melalui link berikut:

${stockLink}`;


        openWhatsApp(
            shop.phone,
            waText
        );

    }


    const statusLink =
    window.location.origin +
    window.location.pathname +
    "?statusPesanan=" +
    order.id;


    message(
        "Pesanan berhasil dikirim"
    );


    window.location.href =
    statusLink;

}

        )
    ){

        return;

    }


    await supabaseClient
    .from("shop_orders")
    .update({

        status:
        "dibatalkan"

    })
    .eq(
        "id",
        shopOrderId
    );


    const {
        data:shopOrder
    }
    =
    await supabaseClient
    .from("shop_orders")
    .select(`
        *,
        orders(*)
    `)
    .eq(
        "id",
        shopOrderId
    )
    .single();


    customerOrderStatusPage(
        shopOrder.orders.id
    );

}

========================================================= */

async function notifyCourierOrder(orderId){

    const {
        data:order
    }
    =
    await supabaseClient
    .from("orders")
    .select("*")
    .eq("id",orderId)
    .single();


    const {
        data:courier
    }
    =
    await supabaseClient
    .from("couriers")
    .select("*")
    .eq(
        "id",
        order.courier_id
    )
    .single();


    const {
        data:shopOrders
    }
    =
    await supabaseClient
    .from("shop_orders")
    .select(`
        *,
        shops(name)
    `)
    .eq(
        "order_id",
        orderId
    )
    .eq(
        "status",
        "diproses"
    );


    const shopNames =
    shopOrders
    .map(
        item=>item.shops.name
    )
    .join(", ");


    const location =
    orderLatitude &&
    orderLongitude
    ?
    `https://maps.google.com/?q=${orderLatitude},${orderLongitude}`
    :
    "Lokasi pelanggan tersimpan pada pesanan";


    const text =
    `PESANAN BARU

Pelanggan:
${order.customer_name}

Alamat:
${order.customer_address}

Kedai:
${shopNames}

Lokasi:
${location}

Silakan input ongkir.`;


    openWhatsApp(
        courier.phone,
        text
    );

}

/* =========================================================
   SIMPAN ONGKIR
========================================================= */

async function saveDeliveryFee(orderId){

    const deliveryFee =
    Number(
        document
        .getElementById(
            "deliveryFee"
        )
        .value
    );


    if(
        deliveryFee < 0
    ){

        return message(
            "Ongkir tidak valid"
        );

    }


    const {
        data:order
    }
    =
    await supabaseClient
    .from("orders")
    .select("*")
    .eq(
        "id",
        orderId
    )
    .single();


    const finalTotal =
    Number(order.total) +
    deliveryFee;


    const {
        error
    }
    =
    await supabaseClient
    .from("orders")
    .update({

        final_total:
        finalTotal,

        status:
        "menunggu_pembayaran"

    })
    .eq(
        "id",
        orderId
    );


    if(error){

        return message(
            error.message
        );

    }


    const text =
    `PESANAN ANDA

Total Pesanan:
${rupiah(order.total)}

Ongkir:
${rupiah(deliveryFee)}

TOTAL BAYAR:
${rupiah(finalTotal)}`;


    openWhatsApp(
        order.customer_phone,
        text
    );


    message(
        "Ongkir berhasil dikirim"
    );


    courierOrdersPage();

}

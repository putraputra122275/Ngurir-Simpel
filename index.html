function loading(show=true){

/* =========================================

========================================= */

function app(html){

document
.getElementById("app")

window.scrollTo(0,0);

}


function rupiah(n){

return "Rp" +
Number(n || 0)
.toLocaleString("id-ID");

}


function getParam(name){

return new URLSearchParams(
window.location.search
).get(name);

}


function randomToken(){

return Math.random()
.toString(36)
.substring(2)
+
Date.now()
.toString(36);

}


function formatDate(date){

return new Date(date)
.toLocaleString("id-ID");

}


/* =========================================
COPY
========================================= */

async function copyText(text){

try{

await navigator.clipboard
.writeText(text);

alert("Link berhasil disalin");

}

catch(e){

prompt(
"Salin link berikut:",
text
);

}

}


/* =========================================
WHATSAPP
========================================= */

function whatsapp(number,text){

number =
String(number || "")
.replace(/\D/g,"");

if(number.startsWith("0")){

number =
"62" +
number.substring(1);

}

window.open(
"https://wa.me/" +
number +
"?text=" +
encodeURIComponent(text),
"_blank"
);

}


/* =========================================
LOCATION
========================================= */

function getLocation(callback){

if(!navigator.geolocation){

alert(
"GPS tidak tersedia di perangkat ini"
);

return;

}

navigator.geolocation.getCurrentPosition(

position=>{

callback({

latitude:
position.coords.latitude,

longitude:
position.coords.longitude

});

},

error=>{

alert(
"Gagal mengambil lokasi. Aktifkan GPS."
);

},

{
enableHighAccuracy:true,
timeout:15000
}

);

}

return JSON.parse(
localStorage.getItem(
"ngurir_courier"

}

catch(e){

return null;

}

}


function logoutCourier(){

localStorage.removeItem(
"ngurir_courier"

shopId &&

/* =========================================
SHOP MENU SETUP
========================================= */

let shopSetup = null;

let tempMenus = [];


function showShopMenuSetup(shop){

shopSetup = shop;

tempMenus = [];

renderShopMenuSetup();

}


function renderShopMenuSetup(){

let menusHTML = "";

tempMenus.forEach(
(menu,index)=>{

menusHTML += `

<div class="card">

<b>
${menu.name}
</b>

<div class="price">

${rupiah(menu.price)}

</div>

${menu.variants.length ?

"<div class='small'>" +
"Varian: " +
menu.variants.join(", ") +
"</div>"

:

"<div class='small'>" +
"Tanpa varian" +
"</div>"

}


<button
class="red"
onclick="removeTempMenu(${index})">

HAPUS MENU

</button>

</div>

`;

}
);


app(`

<div class="card">

<h2>
🍜 DAFTAR MENU
</h2>

<input
id="menuName"
placeholder="Nama Menu">

<input
id="menuPrice"
type="number"
placeholder="Harga">


<input
id="menuVariants"
placeholder="Varian pisahkan dengan koma (opsional)">


<div class="small">

Contoh:
Pedas,Manis,Sedang

</div>


<button
onclick="addTempMenu()">

+ TAMBAH MENU

</button>

</div>


${menusHTML}


<div class="card">

<button
class="green"
onclick="saveShopMenus()">

KIRIM INFORMASI KEDAI

</button>

</div>

`);

}


function addTempMenu(){

const name =
document
.getElementById(
"menuName"
)
.value
.trim();

const price =
document
.getElementById(
"menuPrice"
)
.value;

const variantText =
document
.getElementById(
"menuVariants"
)
.value
.trim();


if(!name || !price){

alert(
"Nama dan harga menu wajib diisi"
);

return;

}


let variants = [];

if(variantText){

variants =
variantText
.split(",")
.map(x=>x.trim())
.filter(x=>x);

}


tempMenus.push({

name:name,

price:Number(price),

variants:variants

});


renderShopMenuSetup();

}


function removeTempMenu(index){

tempMenus.splice(index,1);

renderShopMenuSetup();

}


async function saveShopMenus(){

if(!tempMenus.length){

alert(
"Tambahkan minimal satu menu"
);

return;

}


loading();


for(const menu of tempMenus){

const {error} =
await db
.from("menus")
.insert({

shop_id:
shopSetup.id,

name:
menu.name,

price:
menu.price,

variants:
menu.variants

});


if(error){

loading(false);

alert(
"Gagal menyimpan menu: " +
error.message
);

return;

}

}


loading(false);

alert(
"Kedai dan menu berhasil disimpan"
);

app(`

ke Kurir.

`);

}

menus.forEach(menu=>{

menu.variants &&
menu.variants.length

variants =

"<div class='small'>" +

"Varian: " +

menu.variants.join(", ") +

"</div>";

}


menuHTML += `

${menu.name}

<div class="price">

${rupiah(menu.price)}

/* =========================================
QUANTITY
========================================= */

function changeQty(
menuId,
shopId,
change,
price
){

const menu =
window.allMenus.find(
m=>m.id === menuId
);

const variantSelect =
document.getElementById(
"variant_" + menuId
);

let variant = "";

if(variantSelect){

variant =
variantSelect.value;

if(!variant){

alert(
"Pilih varian terlebih dahulu"
);

return;

}

}


const key =
menuId +
"_" +
variant;


if(!cart[key]){

cart[key] = {

menu_id:
menuId,

shop_id:
shopId,

menu_name:
menu.name,

variant:
variant,

price:
Number(price),

quantity:
0

};

}


cart[key].quantity +=
change;


if(
cart[key].quantity < 0
){

cart[key].quantity = 0;

}


const totalMenuQty =
Object.values(cart)
.filter(
x=>x.menu_id === menuId
)
.reduce(
(a,b)=>
a + b.quantity,
0
);


document
.getElementById(
"qty_" + menuId
)
.innerText =
totalMenuQty;


}

updateError.message
);

return;

}

}


const {error:shopOrderError} =
await db
.from("shop_orders")
.update({

})
.eq(
"id",
shopOrderId
);

if(shopOrderError){

alert(
shopOrderError.message
);

return;

}


alert(
"Hasil cek stok berhasil dikirim"
);


app(`

<div class="card center">

<h2>
✓ BERHASIL
</h2>

<p>

Hasil stok telah dikirim
kepada pelanggan.

</p>

</div>

`);

}


/* =========================================
PROCESS SHOP ORDER
========================================= */

async function processShopOrder(
shopOrderId
){

loading();


const {data:shopOrder} =
await db
.from("shop_orders")
.select(`
*,
orders(*),
shops(*)
`)
.eq(
"id",
shopOrderId
)
.single();


const {error} =
await db
.from("shop_orders")
.update({

status:"diproses"

})
.eq(
"id",
shopOrderId
);


loading(false);


if(error){

alert(error.message);

return;

}


alert(
"Pesanan Kedai berhasil diproses"
);


await notifyCourier(
shopOrder.orders.courier_id
);

showCustomerOrderStatus(
shopOrder.order_id
);

}

/* =========================================
COURIER ORDERS
========================================= */

async function showCourierOrders(){

loading();


const {data:orders,error} =
await db
.from("orders")
.select(`
*,
customers(*),
shop_orders(
*,
shops(*)
)
`)
.eq(
"courier_id",
currentCourier.id
)
.order(
"created_at",
{
ascending:false
}
);


loading(false);


if(error){

alert(error.message);

return;

}


let html = `

<div class="card">

<h2>
🚚 PESANAN UNTUK KURIR
</h2>

`;


orders.forEach(order=>{

const processed =
order.shop_orders
.filter(
s=>s.status === "diproses"
);


if(!processed.length){

return;

}


html += `

<div class="card">

<h3>

👤
${order.customers.name}

</h3>


<p>

📍 Lokasi Pelanggan

</p>


<button
class="orange"
onclick="openMaps('${order.latitude}','${order.longitude}')">

BUKA GOOGLE MAPS

</button>


<h3>
🏪 KEDAI
</h3>

`;


processed.forEach(shopOrder=>{

html += `

<div>

✓
${shopOrder.shops.name}

</div>

`;

});


html += `

<button
class="green"
onclick="setDeliveryFee('${order.id}')">

ISI ONGKIR

</button>

</div>

`;

});


html += `

<button
class="gray"
onclick="showCourierDashboard()">

KEMBALI

</button>

</div>

`;


app(html);

}


/* =========================================
OPEN MAPS
========================================= */

function openMaps(
latitude,
longitude
){

window.open(

"https://www.google.com/maps?q=" +

latitude +

"," +

longitude,

"_blank"

);

}


/* =========================================
SET DELIVERY FEE
========================================= */

function setDeliveryFee(orderId){

app(`

<div class="card">

<h2>
💰 ISI ONGKIR
</h2>

<input
id="deliveryFee"
type="number"
placeholder="Masukkan Ongkir">


<button
class="green"
onclick="saveDeliveryFee('${orderId}')">

KIRIM KE PELANGGAN

</button>


<button
class="gray"
onclick="showCourierOrders()">

KEMBALI

</button>

</div>

`);

}


async function saveDeliveryFee(
orderId
){

const fee =
Number(
document
.getElementById(
"deliveryFee"
)
.value
);


if(!fee){

alert(
"Masukkan ongkir"
);

return;

}


loading();


const {data:order} =
await db
.from("orders")
.select(`
*,
customers(*)
`)
.eq(
"id",
orderId
)
.single();


const {error} =
await db
.from("orders")
.update({

delivery_fee:fee,

status:"ongkir_dikirim"

})
.eq(
"id",
orderId
);


loading(false);


if(error){

alert(error.message);

return;

}


alert(
"Ongkir berhasil dikirim kepada pelanggan"
);


showCourierOrders();

}


/* =========================================
CUSTOMER HISTORY
========================================= */

async function showCustomerHistory(){

loading();


const {data:orders,error} =
await db
.from("orders")
.select(`
*,
shop_orders(
*,
shops(*),
order_items(*)
)
`)
.eq(
"customer_id",
currentCustomer.id
)
.order(
"created_at",
{
ascending:false
}
);


loading(false);


if(error){

alert(error.message);

return;

}


let html = `

<div class="card">

<h2>
📜 RIWAYAT PESANAN
</h2>

`;


if(!orders.length){

html += `

<p>
Belum ada riwayat pesanan
</p>

`;

}


orders.forEach(order=>{

html += `

<div class="card">

<h3>

🧾 PESANAN

</h3>

<div class="small">

${formatDate(
order.created_at
)}

</div>

`;


order.shop_orders
.forEach(shopOrder=>{

html += `

<div class="divider"></div>

<h3>

🏪
${shopOrder.shops.name}

</h3>

`;


shopOrder.order_items
.forEach(item=>{

html += `

<div>

<b>
${item.menu_name}
</b>

`;


if(item.variant){

html += `

<br>

Varian:
${item.variant}

`;

}


html += `

<br>

${item.quantity}
x
${rupiah(item.price)}

<br>

Status:
${item.stock_status}

</div>

<br>

`;

});

});


const total =
Number(order.total || 0);

const fee =
Number(order.delivery_fee || 0);


html += `

<div class="divider"></div>

<b>
TOTAL PESANAN
</b>

<br>

${rupiah(total)}

<br><br>

<b>
ONGKIR
</b>

<br>

${rupiah(fee)}

<br><br>

<h3>

TOTAL BAYAR

<br>

${rupiah(total + fee)}

</h3>

</div>

`;

});


html += `

<button
class="gray"
onclick="showCustomerDashboard()">

KEMBALI

</button>

</div>

`;


app(html);

}


/* =========================================
START APPLICATION
========================================= */

startApp();


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#edf5ff">
<title>Chat Saya</title>
<style>
*{box-sizing:border-box}
:root{--bg:#edf5ff;--blue:#2878e8;--ink:#26364d;--muted:#8794a7;--line:#e6edf6}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#edf5fff2;backdrop-filter:blur(12px);padding:14px 15px 11px}
.head{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:23px;font-weight:800;color:#2169c8}
.head-actions{display:flex;gap:8px}
.iconbtn{width:39px;height:39px;border-radius:50%;background:#fff;color:#315579;font-size:22px}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
main{max-width:650px;margin:auto;padding:7px 12px 105px}
.page-title{font-size:21px;font-weight:800;margin:12px 3px 6px}
.card{position:relative;background:white;border:1px solid #e7edf6;border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #233c5c08}
.row{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#dcecff;color:#2468bd;font-weight:800}
.name{font-size:14px;font-weight:750}
.meta{font-size:11px;color:var(--muted);margin-top:4px}
.more{margin-left:auto;background:transparent;color:#53677f;font-size:23px;padding:2px 7px}
.caption{font-size:14px;line-height:1.55;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post-image{width:100%;max-height:430px;object-fit:contain;display:block;border-radius:12px;margin:10px 0;background:#f2f6fb}
.post-actions{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:9px;gap:2px}
.action{background:transparent;color:#65758a;font-size:12px;display:flex;align-items:center;gap:5px;padding:8px;border-radius:9px}
.action.active{color:#2176e8;font-weight:700}
.bookmark{margin-left:auto;font-size:20px}
.menu{position:absolute;right:7px;top:40px;z-index:7;background:white;border:1px solid var(--line);border-radius:12px;padding:5px;width:180px;box-shadow:0 8px 25px #19324d20}
.menu button{display:block;text-align:left;background:white;width:100%;padding:11px;border-radius:8px;font-size:13px;color:var(--ink)}
.menu button:hover{background:#edf5ff}
.hidden{display:none!important}
.search{width:100%;border:1px solid #dce6f2;border-radius:12px;padding:12px;background:white;margin:8px 0}
.primary{background:var(--blue);color:white;border-radius:11px;padding:11px 14px;font-weight:700}
.secondary{background:#eaf3ff;color:#236ac6;border-radius:10px;padding:9px 12px;font-weight:700}
.full{width:100%}
.bottom-nav{position:fixed;z-index:12;bottom:12px;left:50%;transform:translateX(-50%);width:min(94%,480px);background:#dcecffed;border:1px solid #c8def8;border-radius:28px;display:flex;justify-content:space-around;padding:7px;box-shadow:0 6px 24px #214d8020}
.navbtn{background:transparent;color:#56708f;border-radius:20px;min-width:64px;padding:8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.navbtn span:first-child{font-size:19px}
.navbtn.active{background:white;color:#216fda;font-weight:800}
.friend{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.friend:last-child{border-bottom:0}
.friend-info{flex:1;min-width:0}
.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}
textarea{width:100%;min-height:100px;border:1px solid #dce6f2;border-radius:12px;padding:12px;resize:vertical;outline:none}
.section-label{font-size:14px;font-weight:800;margin:18px 3px 8px}
.post-more-wrap{position:relative;margin-left:auto}
.tag{font-size:10px;background:#e8f3ff;color:#2469be;border-radius:20px;padding:5px 8px}
.comment-card{background:#f4f7fb;border-radius:13px;padding:12px;margin:10px 0}
.comment-text{font-size:13px;line-height:1.55;overflow-wrap:anywhere;margin:9px 0}
.comment-tools{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.text-btn{background:transparent;color:#3474c7;font-weight:700;font-size:12px;padding:4px 0}
.reply-list{margin:10px 0 0 15px;padding-left:11px;border-left:2px solid #d5e5fa}
.reply{background:white;border-radius:11px;padding:10px;margin:8px 0}
.reply-form{display:flex;gap:7px;margin-top:9px}
.reply-form input{min-width:0;flex:1;border:1px solid #dce6f2;border-radius:10px;padding:10px}
.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:10px;background:#f2f6fb}
.file-label{display:inline-flex;align-items:center;gap:7px;background:#eaf3ff;color:#246bc3;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
 <div class="head">
  <div class="brand">Chat Saya</div>
  <div class="head-actions">
   <button class="iconbtn" onclick="toggleSearch()" aria-label="Cari">⌕</button>
   <button class="iconbtn" onclick="toggleMainMenu()" aria-label="Menu">⋮</button>
  </div>
 </div>
 <div class="sub" id="headerSub">Postingan terbaru dari teman-teman Anda</div>
 <div id="mainMenu" class="menu hidden">
  <button onclick="openHistory('like')">♥ Riwayat Suka</button>
  <button onclick="openHistory('comment')">▤ Riwayat Komentar</button>
  <button onclick="openHistory('save')">▣ Riwayat Simpan</button>
  <button onclick="showPage('find')">Cari Teman</button>
 </div>
</header>

<main>
<section id="homePage">
 <div id="searchArea" class="hidden">
  <input id="searchInput" class="search" placeholder="Cari teman..." oninput="searchFriends()">
  <div id="searchResults"></div>
 </div>
 <div class="page-title">Beranda</div>
 <div class="sub">Postingan terbaru dari teman-teman Anda</div>
 <div id="feed"></div>
</section>

<section id="chatPage" class="hidden">
 <div class="page-title">Chat</div>
 <input id="chatSearch" class="search" placeholder="Cari teman..." oninput="renderChatList()">
 <div id="chatList"></div>
</section>

<section id="groupsPage" class="hidden">
 <div class="page-title">Grup</div>
 <button class="primary full" onclick="createGroup()">＋ Tambah Grup</button>
 <div id="groupList"></div>
</section>

<section id="accountPage" class="hidden">
 <div class="page-title">Akun Saya</div>
 <div id="myProfile"></div>
 <div class="section-label">Postingan Saya</div>
 <button class="primary full" onclick="showPage('post')">＋ Buat Postingan</button>
 <div id="myPosts"></div>
</section>

<section id="profilePage" class="hidden">
 <button class="secondary" onclick="showPage('home')">← Kembali</button>
 <div id="friendProfile"></div>
 <div class="section-label">Postingan</div>
 <div id="friendPosts"></div>
</section>

<section id="historyPage" class="hidden">
 <button class="secondary" onclick="showPage('home')">← Kembali</button>
 <div class="page-title" id="historyTitle">Riwayat</div>
 <div id="historyPosts"></div>
</section>

<section id="commentsPage" class="hidden">
 <button class="secondary" onclick="backFromComments()">← Kembali</button>
 <div class="page-title">Komentar</div>
 <div id="commentPostPreview"></div>
 <div class="section-label">Semua komentar</div>
 <div id="commentList"></div>
 <div class="card">
  <div class="name">Tulis komentar</div>
  <textarea id="newCommentText" placeholder="Tulis komentar kamu..."></textarea>
  <button class="primary full" style="margin-top:9px" onclick="submitComment()">Kirim Komentar</button>
 </div>
</section>

<section id="findPage" class="hidden">
 <button class="secondary" onclick="showPage('home')">← Kembali</button>
 <div class="page-title">Cari Teman</div>
 <input id="findInput" class="search" placeholder="Nama atau ID teman..." oninput="searchFindPage()">
 <div id="findResults"></div>
</section>

<section id="editPage" class="hidden">
 <button class="secondary" onclick="showPage('account')">← Kembali</button>
 <div class="page-title">Edit Akun</div>
 <div class="card">
  <label class="sub">Nama</label>
  <input id="editName" class="search">
  <label class="sub">Bio</label>
  <textarea id="editBio" placeholder="Ceritakan tentang dirimu"></textarea>
  <p class="sub">ID pengguna: 10001 (demo)</p>
  <button class="primary full" style="margin-top:12px" onclick="saveAccount()">Simpan Perubahan</button>
 </div>
</section>

<section id="chatRoomPage" class="hidden">
 <button class="secondary" onclick="showPage('chat')">← Daftar Chat</button>
 <div id="chatRoomTitle" class="page-title">Chat</div>
 <div class="sub" id="chatRoomSubtitle"></div>
 <div id="messages"></div>
 <div class="card" style="display:flex;gap:8px;padding:9px">
  <input id="messageInput" class="search" style="margin:0" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendMessage()">
  <button class="primary" onclick="sendMessage()">Kirim</button>
 </div>
</section>

<section id="postPage" class="hidden">
 <button class="secondary" onclick="showPage('account')">← Kembali</button>
 <div class="page-title">Buat Postingan</div>
 <div class="card">
  <textarea id="newCaption" placeholder="Tulis caption (opsional jika memakai gambar)..."></textarea>
  <div style="margin-top:12px">
   <label class="file-label">▧ Pilih Gambar
    <input type="file" id="imageInput" accept="image/*" hidden onchange="previewImage(event)">
   </label>
  </div>
  <img id="imagePreview" class="preview hidden" alt="Pratinjau gambar">
  <button id="removeImage" class="text-btn hidden" onclick="removePreview()">Hapus gambar</button>
  <button class="primary full" style="margin-top:14px" onclick="createPost()">Publikasikan</button>
 </div>
</section>
</main>

<nav class="bottom-nav">
 <button class="navbtn active" data-page="home" onclick="showPage('home')"><span>⌂</span><span>Beranda</span></button>
 <button class="navbtn" data-page="chat" onclick="showPage('chat')"><span>▤</span><span>Chat</span></button>
 <button class="navbtn" data-page="groups" onclick="showPage('groups')"><span>♧</span><span>Grup</span></button>
 <button class="navbtn" data-page="account" onclick="showPage('account')"><span>◉</span><span>Akun</span></button>
</nav>

<script>
const $=id=>document.getElementById(id);
const me={id:'10001',name:'Kamu',bio:'Halo! Ini akun demo Chat Saya.'};
const friends=[
{id:'10012',name:'Andi Pratama',bio:'Suka jalan-jalan dan fotografi.',initial:'A'},
{id:'10023',name:'Siti Aulia',bio:'Berbagi cerita setiap hari.',initial:'S'},
{id:'10034',name:'Budi Santoso',bio:'Belajar hal baru.',initial:'B'},
{id:'10045',name:'Rina Putri',bio:'Senang membaca dan menulis.',initial:'R'},
{id:'10056',name:'Dimas Saputra',bio:'Selalu semangat.',initial:'D'}
];
const isoDaysAgo=n=>{let d=new Date();d.setDate(d.getDate()-n);d.setHours(12,0,0,0);return d.toISOString()};
const fmtDate=s=>new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const fmtTime=s=>new Date(s).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let posts=[],likes=new Set(),saves=new Set(),comments=[],groups=['Teman Sekolah'],chats={};
let currentFriend=null,currentPostId=null,commentReturnPage='home';

function seedPosts(){
 posts=[];
 const own=[
 ['Mencoba aplikasi Chat Saya hari ini.','2026-11-13T08:15:00'],
 ['Hari yang menyenangkan bersama teman-teman.','2026-11-10T16:20:00'],
 ['Belajar hal baru setiap hari.','2026-11-07T19:05:00'],
 ['Semoga semua rencana berjalan lancar.','2026-11-03T10:30:00'],
 ['Selamat pagi, semangat menjalani hari!','2026-10-29T07:10:00']
 ];
 own.forEach((p,i)=>posts.push({id:'own'+i,userId:me.id,name:me.name,initial:'K',caption:p[0],image:'',createdAt:p[1]}));
 const samples=[
 ['Andi Pratama','Hari ini cuacanya cerah sekali!',0,1],
 ['Siti Aulia','Jangan lupa tetap semangat belajar.',1,2],
 ['Budi Santoso','Akhirnya selesai juga tugas hari ini.',2,3],
 ['Rina Putri','Menikmati waktu santai sore ini.',3,4],
 ['Dimas Saputra','Semoga besok menjadi hari yang lebih baik.',4,5],
 ['Andi Pratama','Ada banyak hal baru yang ingin dicoba.',0,6],
 ['Siti Aulia','Terima kasih untuk hari yang menyenangkan.',1,7],
 ['Budi Santoso','Sedikit demi sedikit, lama-lama selesai.',2,8],
 ['Rina Putri','Membaca buku favorit lagi.',3,9],
 ['Dimas Saputra','Halo semuanya! Semoga sehat selalu.',4,10]
 ];
 samples.forEach((p,i)=>posts.push({id:'friend'+i,userId:friends[p[2]].id,name:p[0],initial:p[0][0],caption:p[1],image:'',createdAt:isoDaysAgo(p[3])}));
}
function loadLocal(){
 try{
  const raw=localStorage.getItem('chatSayaDemoV3');if(!raw)return;
  const d=JSON.parse(raw);
  if(d.me){me.name=d.me.name||me.name;me.bio=d.me.bio||''}
  if(Array.isArray(d.posts)&&d.posts.length)posts=d.posts;
  likes=new Set(d.likes||[]);saves=new Set(d.saves||[]);
  comments=d.comments||[];groups=d.groups||groups;chats=d.chats||{};
 }catch(e){}
}
function persist(){
 try{localStorage.setItem('chatSayaDemoV3',JSON.stringify({me:{name:me.name,bio:me.bio},posts,likes:[...likes],saves:[...saves],comments,groups,chats}))}
 catch(e){alert('Penyimpanan lokal penuh. Coba gunakan gambar yang lebih kecil.')}
}
function showPage(p){
 document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
 const el=$(p+'Page');if(el)el.classList.remove('hidden');
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 $('mainMenu').classList.add('hidden');
 const subtitles={home:'Postingan terbaru dari teman-teman Anda',chat:'Percakapan dengan teman',groups:'Grup Anda',account:'Profil dan postingan pribadi',comments:'Komentar pada postingan'};
 $('headerSub').textContent=subtitles[p]||'Chat Saya';
 if(p==='home')renderFeed();
 if(p==='chat')renderChatList();
 if(p==='groups')renderGroups();
 if(p==='account')renderAccount();
 if(p==='find')searchFindPage();
 if(p==='edit'){$('editName').value=me.name;$('editBio').value=me.bio}
 if(p==='chatRoom')renderMessages();
 window.scrollTo(0,0);
}
function toggleMainMenu(){$('mainMenu').classList.toggle('hidden')}
function toggleSearch(){
 $('searchArea').classList.toggle('hidden');
 if(!$('searchArea').classList.contains('hidden'))$('searchInput').focus();
}
document.addEventListener('click',e=>{
 if(!e.target.closest('#mainMenu')&&!e.target.closest('.head-actions'))$('mainMenu').classList.add('hidden');
 if(!e.target.closest('.post-more-wrap'))document.querySelectorAll('.post-menu').forEach(x=>x.classList.add('hidden'));
});
function postMenu(id){
 document.querySelectorAll('.post-menu').forEach(x=>{if(x.id!=='menu-'+id)x.classList.add('hidden')});
 $('menu-'+id).classList.toggle('hidden');
}
function postCard(p){
 const liked=likes.has(p.id),saved=saves.has(p.id);
 const count=comments.filter(c=>c.postId===p.id&&!c.parentId).length;
 return `<article class="card">
 <div class="row">
 <div class="avatar">${esc(p.initial||p.name[0])}</div>
 <div><div class="name">${esc(p.name)}</div><div class="meta">${fmtDate(p.createdAt)} · ${fmtTime(p.createdAt)}</div></div>
 <div class="post-more-wrap"><button class="more" onclick="postMenu('${esc(p.id)}')">⋮</button>
 <div class="menu post-menu hidden" id="menu-${esc(p.id)}">
 <button onclick="viewProfile('${esc(p.userId)}')">Lihat Akun</button>
 ${p.userId!==me.id?`<button onclick="openChat('${esc(p.userId)}')">Chat dengan Teman</button>`:`<button onclick="editPost('${esc(p.id)}')">Edit Postingan</button>`}
 </div></div></div>
 ${p.caption?`<div class="caption">${esc(p.caption)}</div>`:''}
 ${p.image?`<img class="post-image" src="${p.image}" alt="Gambar postingan">`:''}
 <div class="post-actions">
 <button class="action ${liked?'active':''}" onclick="toggleLike('${esc(p.id)}')">${liked?'♥':'♡'} <span>Suka</span></button>
 <button class="action" onclick="openComments('${esc(p.id)}','${p.userId===me.id?'account':'home'}')">▤ <span>Komentar${count?' ('+count+')':''}</span></button>
 <button class="action bookmark ${saved?'active':''}" onclick="toggleSave('${esc(p.id)}')">${saved?'▣':'♧'}</button>
 </div></article>`;
}
function renderFeed(){
 // Postingan sendiri sengaja tidak ditampilkan di Beranda.
 $('feed').innerHTML=posts.filter(p=>p.userId!==me.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(postCard).join('')||'<div class="empty">Belum ada postingan teman.</div>';
}
function toggleLike(id){likes.has(id)?likes.delete(id):likes.add(id);persist();refreshViews()}
function toggleSave(id){saves.has(id)?saves.delete(id):saves.add(id);persist();refreshViews()}
function refreshViews(){renderFeed();renderAccount();if(!$('commentsPage').classList.contains('hidden'))renderCommentPage()}
function openComments(id,returnPage){
 currentPostId=id;commentReturnPage=returnPage||'home';renderCommentPage();showPage('comments');
}
function backFromComments(){showPage(commentReturnPage)}
function renderCommentPage(){
 const p=posts.find(x=>x.id===currentPostId);if(!p)return;
 $('commentPostPreview').innerHTML=`<div class="card"><div class="row"><div class="avatar">${esc(p.initial||p.name[0])}</div><div><div class="name">${esc(p.name)}</div><div class="meta">${fmtDate(p.createdAt)} · ${fmtTime(p.createdAt)}</div></div></div>${p.caption?`<div class="caption">${esc(p.caption)}</div>`:''}${p.image?`<img class="post-image" src="${p.image}" alt="Gambar postingan">`:''}</div>`;
 const roots=comments.filter(c=>c.postId===currentPostId&&!c.parentId).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
 $('commentList').innerHTML=roots.map(renderComment).join('')||'<div class="empty">Belum ada komentar. Jadilah yang pertama berkomentar!</div>';
}
function commentAuthor(c){return c.userId===me.id?me.name:(friends.find(f=>f.id===c.userId)?.name||c.name||'Pengguna')}
function renderComment(c){
 const author=commentAuthor(c),replies=comments.filter(r=>r.parentId===c.id);
 return `<div class="comment-card">
 <div class="row"><div class="avatar" style="width:34px;height:34px;font-size:13px">${esc(author[0])}</div><div><div class="name">${esc(author)}</div><div class="meta">${fmtDate(c.createdAt)} · ${fmtTime(c.createdAt)}</div></div></div>
 <div class="comment-text">${esc(c.text)}</div>
 <div class="comment-tools"><button class="text-btn" onclick="toggleReplyForm('${esc(c.id)}')">↩ Balas</button><span class="meta">${replies.length} balasan</span></div>
 <div id="reply-form-${esc(c.id)}" class="reply-form hidden"><input id="reply-input-${esc(c.id)}" placeholder="Tulis balasan..."><button class="primary" onclick="submitReply('${esc(c.id)}')">Kirim</button></div>
 ${replies.length?`<div class="reply-list">${replies.map(r=>{const n=commentAuthor(r);return `<div class="reply"><div class="row"><div class="avatar" style="width:29px;height:29px;font-size:11px">${esc(n[0])}</div><div><div class="name">${esc(n)}</div><div class="meta">${fmtDate(r.createdAt)} · ${fmtTime(r.createdAt)}</div></div></div><div class="comment-text">${esc(r.text)}</div></div>`}).join('')}</div>`:''}
 </div>`;
}
function toggleReplyForm(id){$('reply-form-'+id).classList.toggle('hidden');if(!$('reply-form-'+id).classList.contains('hidden'))$('reply-input-'+id).focus()}
function submitComment(){
 const input=$('newCommentText'),text=input.value.trim();if(!text)return;
 comments.push({id:'c'+Date.now(),postId:currentPostId,parentId:null,userId:me.id,name:me.name,text,createdAt:new Date().toISOString()});
 input.value='';persist();refreshViews();
}
function submitReply(parentId){
 const input=$('reply-input-'+parentId),text=input.value.trim();if(!text)return;
 comments.push({id:'r'+Date.now(),postId:currentPostId,parentId,userId:me.id,name:me.name,text,createdAt:new Date().toISOString()});
 persist();refreshViews();
}
function openHistory(type){
 $('historyTitle').textContent=type==='like'?'Riwayat Suka':type==='comment'?'Riwayat Komentar':'Riwayat Simpan';
 const ids=type==='like'?[...likes]:type==='save'?[...saves]:[...new Set(comments.map(c=>c.postId))];
 $('historyPosts').innerHTML=posts.filter(p=>ids.includes(p.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(postCard).join('')||'<div class="empty">Belum ada riwayat.</div>';
 showPage('history');
}
function renderAccount(){
 $('myProfile').innerHTML=`<div class="card"><div class="row"><div class="avatar">${esc(me.name[0]||'K')}</div><div><div class="name">${esc(me.name)}</div><div class="meta">ID pengguna: ${me.id}</div></div></div><p class="caption">${esc(me.bio||'Belum ada bio.')}</p><button class="secondary" onclick="showPage('edit')">Edit Akun</button></div>`;
 $('myPosts').innerHTML=posts.filter(p=>p.userId===me.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(postCard).join('')||'<div class="empty">Belum ada postingan.</div>';
}
function previewImage(e){
 const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/')){alert('Pilih file gambar.');return}
 if(file.size>3*1024*1024){alert('Ukuran gambar maksimal 3 MB.');e.target.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{$('imagePreview').src=reader.result;$('imagePreview').classList.remove('hidden');$('removeImage').classList.remove('hidden')};
 reader.readAsDataURL(file);
}
function removePreview(){
 $('imageInput').value='';$('imagePreview').src='';$('imagePreview').classList.add('hidden');$('removeImage').classList.add('hidden');
}
function createPost(){
 const caption=$('newCaption').value.trim(),image=$('imagePreview').classList.contains('hidden')?'':$('imagePreview').src;
 if(!caption&&!image){alert('Tulis teks atau pilih gambar terlebih dahulu.');return}
 posts.push({id:'own'+Date.now(),userId:me.id,name:me.name,initial:me.name[0],caption,image,createdAt:new Date().toISOString()});
 $('newCaption').value='';removePreview();persist();showPage('account');
}
function editPost(id){
 const p=posts.find(x=>x.id===id);if(!p||p.userId!==me.id)return;
 const text=prompt('Ubah caption:',p.caption||'');if(text===null)return;
 p.caption=text.trim();persist();refreshViews();
}
function saveAccount(){
 const name=$('editName').value.trim();if(!name){alert('Nama tidak boleh kosong.');return}
 me.name=name;me.bio=$('editBio').value.trim();
 posts.filter(p=>p.userId===me.id).forEach(p=>{p.name=me.name;p.initial=me.name[0]});
 persist();renderAccount();showPage('account');
}
function viewProfile(id){
 const f=id===me.id?me:friends.find(x=>x.id===id);if(!f)return;
 $('friendProfile').innerHTML=`<div class="card"><div class="row"><div class="avatar">${esc(f.initial||f.name[0])}</div><div><div class="name">${esc(f.name)}</div><div class="meta">ID: ${esc(f.id)}</div></div></div><p class="caption">${esc(f.bio||'')}</p>${id!==me.id?`<button class="primary" onclick="openChat('${id}')">Chat dengan Teman</button>`:''}</div>`;
 $('friendPosts').innerHTML=posts.filter(p=>p.userId===id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(postCard).join('')||'<div class="empty">Belum ada postingan.</div>';
 showPage('profile');
}
function searchFriends(){
 const q=$('searchInput').value.toLowerCase();
 $('searchResults').innerHTML=friends.filter(f=>(f.name+' '+f.id).toLowerCase().includes(q)).map(f=>`<div class="friend"><div class="avatar">${esc(f.initial)}</div><div class="friend-info"><div class="name">${esc(f.name)}</div><div class="meta">ID: ${esc(f.id)}</div></div><button class="secondary" onclick="viewProfile('${f.id}')">Lihat Akun</button></div>`).join('')||'<div class="empty">Teman tidak ditemukan.</div>';
}
function searchFindPage(){
 const q=($('findInput')?.value||'').toLowerCase();
 $('findResults').innerHTML=friends.filter(f=>(f.name+' '+f.id).toLowerCase().includes(q)).map(f=>`<div class="friend"><div class="avatar">${esc(f.initial)}</div><div class="friend-info"><div class="name">${esc(f.name)}</div><div class="meta">ID: ${esc(f.id)}</div></div><button class="secondary" onclick="alert('Teman demo sudah tersedia di Chat.')">Tambah</button></div>`).join('')||'<div class="empty">Tidak ada teman yang cocok.</div>';
}
function renderChatList(){
 const q=($('chatSearch')?.value||'').toLowerCase();
 $('chatList').innerHTML=friends.filter(f=>(f.name+' '+f.id).toLowerCase().includes(q)).map(f=>`<div class="friend"><div class="avatar">${esc(f.initial)}</div><div class="friend-info"><div class="name">${esc(f.name)}</div><div class="meta">ID: ${esc(f.id)}</div><div class="meta">${(chats[f.id]||[]).length?esc(chats[f.id].at(-1).text):'Mulai percakapan'}</div></div><button class="secondary" onclick="openChat('${f.id}')">Chat</button></div>`).join('')||'<div class="empty">Teman tidak ditemukan.</div>';
}
function openChat(id){
 currentFriend=friends.find(f=>f.id===id);if(!currentFriend)return;
 $('chatRoomTitle').textContent=currentFriend.name;$('chatRoomSubtitle').textContent='ID: '+id+' · Demo lokal';
 showPage('chatRoom');
}
function renderMessages(){
 if(!currentFriend)return;
 const arr=chats[currentFriend.id]||[];
 $('messages').innerHTML=arr.map(m=>`<div style="display:flex;justify-content:${m.mine?'flex-end':'flex-start'}"><div style="background:${m.mine?'#dcecff':'white'};padding:10px 12px;border-radius:14px;margin:5px 0;max-width:85%;overflow-wrap:anywhere">${esc(m.text)}<div class="meta" style="text-align:right">${fmtTime(m.createdAt)}</div></div></div>`).join('')||'<div class="empty">Belum ada pesan. Kirim pesan untuk mencoba.</div>';
}
function sendMessage(){
 const input=$('messageInput'),text=input.value.trim();if(!text||!currentFriend)return;
 chats[currentFriend.id]=chats[currentFriend.id]||[];
 chats[currentFriend.id].push({text,mine:true,createdAt:new Date().toISOString()});
 input.value='';persist();renderMessages();
}
function renderGroups(){$('groupList').innerHTML=groups.map((g,i)=>`<div class="friend"><div class="avatar">♧</div><div class="friend-info"><div class="name">${esc(g)}</div><div class="meta">Grup demo · ${i+2} anggota</div></div></div>`).join('')}
function createGroup(){
 const name=prompt('Nama grup baru:');if(!name||!name.trim())return;
 groups.push(name.trim());persist();renderGroups();
}
seedPosts();loadLocal();renderFeed();renderChatList();renderGroups();renderAccount();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KURIR SIMPLE</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#68727d;
  --line:#dfe4e8;--primary:#1667d9;--primary2:#0e56bd;
  --success:#16834a;--danger:#c73535;--closed:#9aa1a8;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}
.screen{min-height:100vh;padding:16px 14px 28px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{border:0;background:transparent;padding:8px 4px;font-weight:700;color:var(--primary)}
.title{font-size:21px;font-weight:800;text-align:center;flex:1}
.home-title{text-align:center;font-size:22px;font-weight:800;margin:18px 0 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 7px}
input,textarea{
  width:100%;border:1px solid #cfd6dc;border-radius:10px;padding:12px 11px;
  background:#fff;color:var(--text);outline:none
}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:90px;resize:vertical}
.btn{
  width:100%;border:0;border-radius:10px;padding:12px 13px;margin-top:10px;
  background:var(--primary);color:#fff;font-weight:800
}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#eef3f8;color:#1b2733}
.btn.success{background:var(--success)}
.btn.danger{background:var(--danger)}
.btn.outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.small{width:auto;margin:0;padding:8px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.center{text-align:center}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:35px 12px}
.merchant-card.closed{opacity:.6}
.merchant-name{font-size:18px;font-weight:800}
.status-row{display:flex;gap:7px;margin-top:10px}
.status-row button{flex:1}
.status{
  display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;
}
.status.open{background:#e2f5e9;color:#14753f}
.status.closed{background:#eceef0;color:#697078}
.link-btn{margin-top:9px}
.menu-card{padding:13px}
.menu-name{font-weight:800;font-size:16px}
.price{font-weight:800;margin-top:4px}
.menu-actions{display:flex;gap:8px;margin-top:10px}
.menu-actions button{flex:1}
.section-title{font-size:15px;font-weight:800;margin:18px 0 8px}
.variant-box{border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:9px;background:#fafbfc}
.variant-head{font-weight:800;margin-bottom:8px}
.radio-line{display:flex;gap:9px;align-items:center;margin:8px 0}
.radio-line input{width:auto}
.setting-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#fff}
.setting-title{font-weight:800;margin-bottom:7px}
.hidden{display:none!important}
.customer-merchant{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;background:#fff}
.customer-merchant-head{padding:14px}
.customer-merchant.open{border-color:#b8cbe4}
.customer-merchant.closed{opacity:.55}
.customer-menu-list{padding:0 12px 12px}
.customer-menu{border-top:1px solid var(--line);padding:13px 0}
.menu-main-row{display:flex;align-items:center;gap:8px}
.menu-main-row .grow{flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border:0;border-radius:8px;background:#e9eef3;font-weight:900}
.qty strong{min-width:18px;text-align:center}
.variant-option{display:flex;align-items:center;gap:9px;padding:9px 0}
.variant-option input{width:auto}
.variant-option .grow{flex:1}
.variant-qty{margin-left:auto}
.cart-merchant{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.cart-line{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.order-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.order-label{font-weight:900;margin-bottom:10px}
.order-block{padding:9px 0;border-top:1px solid var(--line)}
.order-block:first-of-type{border-top:0}
.timestamp{font-size:12px;color:var(--muted);margin-top:10px}
.order-total{font-weight:900;margin-top:8px}
.map-box{height:330px;border-radius:14px;background:#dce7d8;position:relative;overflow:hidden;border:1px solid var(--line)}
.map-box:before,.map-box:after{content:"";position:absolute;background:#fff;opacity:.85}
.map-box:before{width:120%;height:18px;left:-10%;top:45%;transform:rotate(-18deg)}
.map-box:after{width:18px;height:120%;left:54%;top:-10%;transform:rotate(27deg)}
.pin{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:38px;z-index:2}
.map-label{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-weight:900;z-index:2}
.group-header{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.group-name,.courier-name{font-weight:800}
.longpress-note{font-size:11px;color:var(--muted);margin-top:5px}
.share-choice{display:flex;flex-direction:column;gap:9px}
.share-choice button{text-align:left}
.detail-wide{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}
.detail-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #edf0f2}
.detail-line:last-child{border-bottom:0}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:#1e252c;color:#fff;padding:10px 14px;border-radius:9px;
  z-index:9999;font-size:13px;max-width:90%;text-align:center
}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:9000;display:flex;align-items:flex-end;justify-content:center}
.modal{width:min(520px,100%);background:#fff;border-radius:18px 18px 0 0;padding:18px}
.modal h3{margin:0 0 10px}
.share-sheet-btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px;text-align:left;margin-top:8px;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.code-box{font-size:30px;font-weight:900;letter-spacing:7px;text-align:center;padding:16px;border:2px dashed #b9c3cc;border-radius:12px;margin:12px 0}
.check-line{display:flex;gap:8px;align-items:center;margin-top:10px}
.check-line input{width:auto}
.notice{background:#fff8df;border:1px solid #ead48a;border-radius:10px;padding:11px;font-size:13px;margin-top:10px}
@media(max-width:360px){
  .screen{padding-left:10px;padding-right:10px}
  .title{font-size:19px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* =========================
   DATA
========================= */
const KEY="KURIR_SIMPLE_MASTER_V3";
const state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  courier:null,
  merchants:[],
  orders:[],
  groups:[],
  customerCodes:[],
  customers:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function id(prefix="id"){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function money(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))
}
function nowText(){
  return new Date().toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})
}
function currentCourier(){
  return state.courier;
}
function merchantById(mid){return state.merchants.find(m=>m.id===mid)}
function orderById(oid){return state.orders.find(o=>o.id===oid)}
function toast(msg){
  const old=document.querySelector(".toast"); if(old)old.remove();
  const d=document.createElement("div");d.className="toast";d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2200)
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("Link berhasil disalin")).catch(()=>fallbackCopy(text))
  }else fallbackCopy(text)
}
function fallbackCopy(text){
  const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();
  try{document.execCommand("copy");toast("Link berhasil disalin")}catch(e){toast("Link: "+text)}
  t.remove()
}
/*
   LINK PUBLIK UNIVERSAL
   Isi APP_PUBLIC_URL jika aplikasi ditempatkan pada alamat web tertentu.
   Contoh: https://contoh-domain-anda.com/
   Jika dikosongkan, alamat halaman yang sedang dibuka akan dipakai.
*/
const APP_PUBLIC_URL = "";
function publicBaseUrl(){
  if(APP_PUBLIC_URL.trim()) return APP_PUBLIC_URL.trim().replace(/[?#]+$/g, "");
  // file:// saat dijalankan dari Acode: pertahankan alamat file lokal untuk pengujian di HP yang sama.
  // http(s):// saat di-hosting: gunakan URL publik, termasuk subfolder GitHub Pages.
  if(window.location.protocol === "file:"){
    return window.location.href.split("?")[0].split("#")[0];
  }
  return window.location.origin + window.location.pathname;
}
function appLink(params){
  const base=publicBaseUrl();
  const u=new URL(base,window.location.href);
  u.hash="";
  Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  return u.toString();
}
function courierCustomerLink(){return appLink({pelanggan:state.courier.id})}
function merchantLink(mid){return appLink({mitra:mid})}
function setPendingMerchant(mid){localStorage.setItem("KURIR_SIMPLE_PENDING_MERCHANT",mid)}
function getPendingMerchant(){return localStorage.getItem("KURIR_SIMPLE_PENDING_MERCHANT")}
function clearPendingMerchant(){localStorage.removeItem("KURIR_SIMPLE_PENDING_MERCHANT")}
function setPendingCourier(cid){if(cid)localStorage.setItem("KURIR_SIMPLE_PENDING_COURIER",cid);else localStorage.removeItem("KURIR_SIMPLE_PENDING_COURIER")}
function getPendingCourier(){return localStorage.getItem("KURIR_SIMPLE_PENDING_COURIER")}
function formatDate(d){return d||nowText()}

/* =========================
   SCREEN HELPERS
========================= */
function screen(title,body,back=true){
  return `<div class="screen">
    <div class="header">${back?`<button class="back" onclick="goBack()">← KEMBALI</button>`:"<span style='width:72px'></span>"}
      <div class="title">${esc(title)}</div><span style="width:72px"></span>
    </div>${body}</div>`
}
let historyStack=[];
let currentPage="";

function render(html,push=true){
  if(push&&currentPage)historyStack.push(currentPage);
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0)
}
function goBack(){
  const p=historyStack.pop();
  if(p){openPage(p,false);return}
  openDashboard(false)
}
function openPage(page,push=true){
  currentPage=page;
  if(page==="dashboard")return openDashboard(push);
  if(page==="merchants")return openMerchants(push);
  if(page==="addMerchant")return openAddMerchant(push);
  if(page.startsWith("menus:"))return openMenus(page.split(":")[1],push);
  if(page.startsWith("addMenu:"))return openAddMenu(page.split(":")[1],push);
  if(page.startsWith("editMenu:"))return openEditMenu(page.split(":")[1],push);
  if(page==="orders")return openOrders(push);
  if(page.startsWith("location:"))return openLocation(page.split(":")[1],push);
  if(page.startsWith("orderDetail:"))return openOrderDetail(page.split(":")[1],push);
  if(page==="group")return openGroup(push);
  if(page.startsWith("groupDetail:"))return openGroupDetail(page.split(":")[1],push);
  if(page.startsWith("sharePartners:"))return openSharePartners(page.split(":")[1],push);
  if(page.startsWith("shareDetail:"))return openShareDetail(page.split(":")[1],push);
  if(page==="customerCode")return openCustomerCode(push);
  if(page.startsWith("customerHome:"))return openCustomerHome(page.split(":")[1],push);
  if(page.startsWith("customerCart:"))return openCustomerCart(page.split(":")[1],push);
  if(page.startsWith("survey:"))return openSurvey(page.split(":")[1],push);
  if(page==="publicCustomer")return openCustomerLogin(push);
  if(page.startsWith("publicMerchant:"))return openPublicMerchant(page.split(":")[1],push);
  if(page.startsWith("customerRegister:"))return openCustomerRegister(page.split(":")[1],push);
}
function begin(page){historyStack=[];openPage(page,false)}
function ensureCourier(){
  if(!state.courier){begin("register");return false}
  return true
}

/* =========================
   DAFTAR AKUN
========================= */
function openRegister(){
  currentPage="register";
  render(`<div class="screen">
    <div class="home-title">DAFTAR AKUN</div>
    <div class="card">
      <label>Nama</label><input id="regName" placeholder="">
      <label>Nomor Telepon</label><input id="regPhone" inputmode="numeric" maxlength="15" placeholder="">
      <button class="btn" onclick="saveCourier()">SIMPAN</button>
    </div>
  </div>`,false)
}
function saveCourier(){
  const name=document.getElementById("regName").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  if(!name||!phone){toast("Nama dan nomor telepon wajib diisi");return}
  state.courier=state.courier||{id:id("kurir"),name:"",phone:""};
  state.courier.name=name;state.courier.phone=phone;save();
  toast("Akun berhasil disimpan");begin("dashboard")
}

/* =========================
   DASHBOARD
========================= */
function openDashboard(push=true){
  if(!state.courier)return openRegister();
  currentPage="dashboard";
  render(`<div class="screen">
    <div class="home-title">DASHBOARD UTAMA</div>
    <div class="card">
      <button class="btn" onclick="openPage('merchants')">MITRA USAHA</button>
      <button class="btn" onclick="openPage('group')">MASUK KE GRUP</button>
      <button class="btn" onclick="openPage('orders')">PESANAN BARU</button>
    </div>
    <div class="card">
      <div style="font-weight:800">${esc(state.courier.name)}</div>
      <div class="muted" style="margin-top:4px">${esc(state.courier.phone)}</div>
      <button class="btn outline" onclick="openPage('customerCode')">KODE PELANGGAN</button>
      <button class="btn secondary" onclick="copyText(courierCustomerLink())">SALIN LINK PELANGGAN</button>
    </div>
  </div>`,push)
}

/* =========================
   MITRA
========================= */
function openMerchants(push=true){
  if(!ensureCourier())return;
  currentPage="merchants";
  const cards=state.merchants.map(m=>`
    <div class="card merchant-card ${m.status==='OPEN'?'':'closed'}" onclick="openPage('menus:${m.id}')">
      <div class="merchant-name">${esc(m.name)}</div>
      <div class="muted" style="margin-top:5px">WhatsApp: ${esc(m.phone)}</div>
      <div class="status-row" onclick="event.stopPropagation()">
        <button class="btn small ${m.status==='OPEN'?'success':''}" onclick="setMerchantStatus('${m.id}','OPEN')">OPEN</button>
        <button class="btn small ${m.status==='CLOSED'?'danger':''}" onclick="setMerchantStatus('${m.id}','CLOSED')">CLOSED</button>
      </div>
      <button class="btn outline link-btn" onclick="event.stopPropagation();copyText(merchantLink('${m.id}'))">SALIN LINK</button>
    </div>`).join("");
  render(screen("MITRA USAHA",`
    ${cards||`<div class="empty">Belum ada mitra usaha.</div>`}
    <button class="btn" onclick="openPage('addMerchant')">TAMBAH MITRA USAHA</button>
  `),push)
}
function setMerchantStatus(mid,status){
  const m=merchantById(mid);if(!m)return;
  m.status=status;save();openMerchants(false)
}
function openAddMerchant(push=true){
  currentPage="addMerchant";
  render(screen("TAMBAH MITRA USAHA",`
    <div class="card">
      <label>Nama Mitra Usaha</label><input id="mName">
      <label>Nomor WhatsApp</label><input id="mPhone" inputmode="numeric">
      <button class="btn" onclick="saveMerchant()">SIMPAN</button>
    </div>
  `),push)
}
function saveMerchant(){
  const name=document.getElementById("mName").value.trim();
  const phone=document.getElementById("mPhone").value.trim();
  if(!name||!phone){toast("Data mitra belum lengkap");return}
  state.merchants.push({
    id:id("mitra"),courierId:state.courier.id,name,phone,status:"CLOSED",menus:[]
  });
  save();toast("Mitra berhasil ditambahkan");openMerchants(false)
}

/* =========================
   MENU LIST
========================= */
function menuDisplayPrice(menu){
  if(menu.priceMode==="different"){
    const p=(menu.variants||[])[0]?.price;
    return p!=null&&p!==""?money(p):"Harga varian";
  }
  return money(menu.price)
}
function openMenus(mid,push=true){
  const m=merchantById(mid);if(!m){toast("Mitra tidak ditemukan");return}
  currentPage="menus:"+mid;
  const list=(m.menus||[]).map(menu=>`
    <div class="card menu-card">
      <div class="menu-name">${esc(menu.name)}</div>
      <div class="price">${menuDisplayPrice(menu)}</div>
      ${menu.variants?.length?`<div class="muted" style="margin-top:5px">${menu.variants.length} varian</div>`:""}
      <div class="menu-actions">
        <button class="btn small outline" onclick="openPage('editMenu:${menu.id}')">EDIT</button>
        <button class="btn small danger" onclick="deleteMenu('${mid}','${menu.id}')">HAPUS</button>
      </div>
    </div>`).join("");
  render(screen(m.name,`
    <div class="section-title center">DAFTAR MENU</div>
    ${list||`<div class="empty">Belum ada menu.</div>`}
    <button class="btn" onclick="openPage('addMenu:${mid}')">TAMBAH MENU</button>
  `),push)
}
function deleteMenu(mid,menuId){
  const m=merchantById(mid);if(!m)return;
  m.menus=m.menus.filter(x=>x.id!==menuId);save();openMenus(mid,false)
}

/* =========================
   MENU FORM / VARIANT RULES
========================= */
function newMenuDraft(){
  return {name:"",price:"",choiceMode:"single",priceMode:"same",variants:[]}
}
const drafts={};

function openAddMenu(mid,push=true){
  drafts.add=newMenuDraft();drafts.add.mid=mid;
  currentPage="addMenu:"+mid;
  renderAddMenu(mid,false,push)
}
function renderAddMenu(mid,showSettings,push=true){
  const d=drafts.add||newMenuDraft();
  const priceVisible=d.priceMode==="same";
  const variants=d.variants||[];
  let variantHtml="";
  if(showSettings){
    variantHtml=variants.map((v,i)=>`
      <div class="variant-box">
        <div class="variant-head">Varian ${i+1}</div>
        <label>Nama Varian</label>
        <input class="add-v-name" data-index="${i}" value="${esc(v.name)}">
        ${d.priceMode==="different"?`
          <label>Harga</label>
          <input class="add-v-price" data-index="${i}" inputmode="numeric" value="${esc(v.price)}">
        `:""}
      </div>`).join("");
  }
  render(screen("TAMBAH MENU",`
    <div class="card">
      <label>Nama Menu</label><input id="addMenuName" value="${esc(d.name)}" oninput="drafts.add.name=this.value">
      ${priceVisible?`<label>Harga</label><input id="addMenuPrice" value="${esc(d.price)}" inputmode="numeric" oninput="drafts.add.price=this.value">`:""}
      ${showSettings?`
        <div class="setting-box">
          <div class="setting-title">PENGATURAN VARIAN</div>
          <div class="radio-line"><input type="radio" name="addChoice" ${d.choiceMode==="single"?"checked":""} onchange="setAddChoice('single')"><span>Hanya pilih satu</span></div>
          <div class="radio-line"><input type="radio" name="addChoice" ${d.choiceMode==="multiple"?"checked":""} onchange="setAddChoice('multiple')"><span>Bisa pilih lebih dari satu</span></div>
          <hr>
          <div class="setting-title">Harga Varian</div>
          <div class="radio-line"><input type="radio" name="addPriceMode" ${d.priceMode==="different"?"checked":""} onchange="setAddPriceMode('different')"><span>Harga tiap varian berbeda</span></div>
          <div class="radio-line"><input type="radio" name="addPriceMode" ${d.priceMode==="same"?"checked":""} onchange="setAddPriceMode('same')"><span>Harga tiap varian sama</span></div>
        </div>
        ${variantHtml}
        <button class="btn secondary" onclick="addVariant('add')">TAMBAH VARIAN</button>
      `:`<button class="btn secondary" onclick="showAddVariantSettings()">TAMBAH VARIAN</button>`}
      <button class="btn" onclick="saveNewMenu('${mid}')">SIMPAN</button>
    </div>
  `),push)
}
function showAddVariantSettings(){
  const d=drafts.add;
  d.name=document.getElementById("addMenuName").value.trim();
  const p=document.getElementById("addMenuPrice");if(p)d.price=p.value;
  renderAddMenu(d.mid,true,false)
}
function setAddChoice(v){drafts.add.choiceMode=v;syncAddDraft();renderAddMenu(drafts.add.mid,true,false)}
function setAddPriceMode(v){
  syncAddDraft();drafts.add.priceMode=v;
  if(v==="same"){
    drafts.add.variants.forEach(x=>x.price="")
  }
  renderAddMenu(drafts.add.mid,true,false)
}
function syncAddDraft(){
  const d=drafts.add;
  const n=document.getElementById("addMenuName");if(n)d.name=n.value.trim();
  const p=document.getElementById("addMenuPrice");if(p)d.price=p.value.trim();
  document.querySelectorAll(".add-v-name").forEach(x=>d.variants[Number(x.dataset.index)].name=x.value);
  document.querySelectorAll(".add-v-price").forEach(x=>d.variants[Number(x.dataset.index)].price=x.value);
}
function addVariant(type){
  if(type==="add"){
    syncAddDraft();drafts.add.variants.push({name:"",price:""});
    renderAddMenu(drafts.add.mid,true,false)
  }else{
    syncEditDraft();
    drafts.edit.variants.push({name:"",price:""});
    renderEditMenu(drafts.edit.mid,drafts.edit.menuId,false)
  }
}
function saveNewMenu(mid){

function syncEditDraft(){
  const d=drafts.edit;if(!d)return;
  const n=document.getElementById("editMenuName");if(n)d.name=n.value.trim();
  const p=document.getElementById("editMenuPrice");if(p)d.price=p.value.trim();
  document.querySelectorAll(".edit-v-name").forEach(x=>d.variants[Number(x.dataset.index)].name=x.value);
  document.querySelectorAll(".edit-v-price").forEach(x=>d.variants[Number(x.dataset.index)].price=x.value);
}
function setEditChoice(v){syncEditDraft();drafts.edit.choiceMode=v;renderEditMenu(drafts.edit.mid,drafts.edit.menuId,false)}
function setEditPriceMode(v){

}
function saveEditedMenu(mid,menuId){

  if(d.priceMode==="different"&&d.variants.some(v=>!v.price)){toast("Harga setiap varian wajib diisi");return}

function openCustomerLogin(push=true){
  currentPage="publicCustomer";
  render(screen("LOGIN PELANGGAN",`
    <div class="card">
      <label>Kode Pelanggan</label>

    </div>
  `),push)

function verifyCustomerCode(){
  const code=document.getElementById("customerCodeInput").value.trim();
  if(!/^\d{4}$/.test(code)){toast("Kode harus 4 digit");return}
  const c=state.customerCodes.find(x=>x.code===code);
  if(!c){toast("Kode tidak valid");return}
  if(c.used){toast("Kode sudah digunakan");return}
  const pending=getPendingMerchant();
  const merchant=pending?merchantById(pending):null;
  const pendingCourier=getPendingCourier();
  if(pendingCourier&&pendingCourier!==c.courierId){
    setPendingCourier(null);
    toast("Kode pelanggan tidak sesuai dengan link kurir ini");return
  }
  if(merchant&&merchant.courierId!==c.courierId){
    clearPendingMerchant();
    toast("Link mitra bukan milik kode pelanggan ini");return
  }
  setPendingCourier(null);
  c.used=true;c.active=false;
  const customer={id:id("cust"),courierId:c.courierId,name:c.customerName,codeId:c.id,location:null,registered:true,firstOrderDone:false};
  state.customers.push(customer);save();
  localStorage.setItem("KURIR_SIMPLE_CURRENT_CUSTOMER",customer.id);
  openCustomerRegister(customer.id,true)
}
function openCustomerRegister(cid,push=true){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  currentPage="customerRegister:"+cid;

    </div>
  `),push)
}
function shareCustomerLocation(cid){
  if(!navigator.geolocation){toast("Perangkat tidak mendukung lokasi");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=state.customers.find(x=>x.id===cid);if(!c)return;
    c.location={lat:pos.coords.latitude,lng:pos.coords.longitude,updatedAt:nowText()};

const carts={};
function getCart(cid){
  if(!carts[cid])carts[cid]={};
  return carts[cid]
}
function cartForMerchant(cid,mid){
  const cart=getCart(cid);
  if(!cart[mid])cart[mid]=[];
  return cart[mid]
}
function findCartItem(cid,mid,menuId,variantName){
  return cartForMerchant(cid,mid).find(i=>i.menuId===menuId&&i.variantName===variantName)
}
function cartMerchantHas(cid,mid){
  return cartForMerchant(cid,mid).length>0
}
function openCustomerHome(cid,push=true){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  currentPage="customerHome:"+cid;
  const merchants=state.merchants.filter(m=>m.courierId===c.courierId);
  const pending=getPendingMerchant();
  if(pending&&merchants.some(m=>m.id===pending)){
    window.customerOpenMerchant=pending;
    clearPendingMerchant();
  }
  const openId=window.customerOpenMerchant||null;
  const cards=merchants.map(m=>{
    const isOpen=m.status==="OPEN",expanded=openId===m.id;
    return `<div class="customer-merchant ${isOpen?"":"closed"}">
      <div class="customer-merchant-head" onclick="${isOpen?`customerOpenMerchant('${cid}','${m.id}')`:"toast('Mitra sedang CLOSED')"}">
        <div class="merchant-name">${esc(m.name)}</div>
        <div style="margin-top:5px"><span class="status ${isOpen?"open":"closed"}">${m.status}</span></div>
        ${cartMerchantHas(cid,m.id)?`<div style="margin-top:6px;color:var(--success);font-weight:800">✓ SUDAH DIPESAN</div>`:""}
      </div>
      ${expanded&&isOpen?renderCustomerMenus(cid,m):""}
    </div>`
  }).join("");
  const hasAny=Object.values(getCart(cid)).some(a=>a.length);
  render(screen("PILIH MITRA USAHA",`
    <div class="card">
      <b>${esc(c.name)}</b>
      <div class="muted" style="margin-top:5px">${c.location?"Lokasi sudah dibagikan":"Lokasi belum dibagikan"}</div>
      <button class="btn secondary" onclick="shareCustomerLocation('${cid}')">BAGIKAN LOKASI</button>
    </div>
    ${cards||`<div class="empty">Belum ada mitra usaha.</div>`}
    <button class="btn ${hasAny?"":"secondary"}" ${hasAny?"":"disabled"} onclick="openPage('customerCart:${cid}')">LIHAT PESAN</button>
  `),push)
}
function customerOpenMerchant(cid,mid){
  window.customerOpenMerchant=window.customerOpenMerchant===mid?null:mid;
  openCustomerHome(cid,false)
}
function renderCustomerMenus(cid,m){
  const hasMenus=(m.menus||[]).length>0;
  return `<div class="customer-menu-list">
    ${hasMenus?(m.menus||[]).map(menu=>renderCustomerMenu(cid,m,menu)).join(""):`<div class="empty">Belum ada menu.</div>`}
    ${hasMenus?`<button class="btn" onclick="saveMerchantCustomerOrder('${cid}','${m.id}')">SIMPAN</button>`:""}
  </div>`
}
function renderCustomerMenu(cid,m,menu){
  const cart=cartForMerchant(cid,m.id);
  if(menu.choiceMode==="multiple"){
    const rows=(menu.variants||[]).map((v,i)=>{
      const item=cart.find(x=>x.menuId===menu.id&&x.variantName===v.name);
      const q=item?.qty||0;
      const price=menu.priceMode==="different"?Number(v.price||0):Number(menu.price||0);
      return `<div class="variant-option">
        <div class="grow"><b>${esc(v.name)}</b>${price?`<div class="muted">${money(price)}</div>`:""}</div>
        <div class="variant-qty qty">
          <button onclick="changeMultiQty('${cid}','${m.id}','${menu.id}','${esc(v.name)}',-1)">−</button>
          <strong>${q}</strong>
          <button onclick="changeMultiQty('${cid}','${m.id}','${menu.id}','${esc(v.name)}',1)">+</button>
        </div>
      </div>`
    }).join("");
    return `<div class="customer-menu"><div class="menu-main-row"><div class="grow"><div class="menu-name">${esc(menu.name)}</div>${menu.priceMode==="same"?`<div class="price">${money(menu.price)}</div>`:""}</div></div>${rows}</div>`
  }
  const selected=cart.find(x=>x.menuId===menu.id);
  const qty=selected?.qty||0;
  const selectedName=selected?.variantName||"";
  const rows=(menu.variants||[]).map(v=>{
    const price=menu.priceMode==="different"?Number(v.price||0):Number(menu.price||0);
    return `<label class="variant-option">
      <input type="radio" name="single_${menu.id}" ${selectedName===v.name?"checked":""} onchange="selectSingleVariant('${cid}','${m.id}','${menu.id}','${esc(v.name)}')">
      <div class="grow"><b>${esc(v.name)}</b>${menu.priceMode==="different"?`<div class="muted">${money(price)}</div>`:""}</div>
    </label>`
  }).join("");
  return `<div class="customer-menu">
    <div class="menu-main-row">
      <div class="grow"><div class="menu-name">${esc(menu.name)}</div>${menu.priceMode==="same"?`<div class="price">${money(menu.price)}</div>`:""}</div>
      <div class="qty"><button onclick="changeSingleQty('${cid}','${m.id}','${menu.id}',-1)">−</button><strong>${qty}</strong><button onclick="changeSingleQty('${cid}','${m.id}','${menu.id}',1)">+</button></div>
    </div>
    ${rows}
  </div>`
}
function selectSingleVariant(cid,mid,menuId,variantName){
  const cart=cartForMerchant(cid,mid);
  const menu=merchantById(mid).menus.find(x=>x.id===menuId);
  const old=cart.find(x=>x.menuId===menuId);
  const price=menu.priceMode==="different"?Number(menu.variants.find(v=>v.name===variantName)?.price||0):Number(menu.price||0);
  if(old){old.variantName=variantName;old.price=price}
  else cart.push({menuId,menuName:menu.name,variantName,qty:1,price});
  openCustomerHome(cid,false)
}
function changeSingleQty(cid,mid,menuId,delta){
  const cart=cartForMerchant(cid,mid);let item=cart.find(x=>x.menuId===menuId);
  const menu=merchantById(mid).menus.find(x=>x.id===menuId);
  if(!item&&delta>0){
    toast("Pilih varian terlebih dahulu");return
  }
  if(item){
    item.qty+=delta;if(item.qty<=0)cart.splice(cart.indexOf(item),1)
  }
  openCustomerHome(cid,false)
}
function changeMultiQty(cid,mid,menuId,variantName,delta){
  const cart=cartForMerchant(cid,mid);let item=cart.find(x=>x.menuId===menuId&&x.variantName===variantName);
  const menu=merchantById(mid).menus.find(x=>x.id===menuId);
  const v=menu.variants.find(x=>x.name===variantName);
  const price=menu.priceMode==="different"?Number(v?.price||0):Number(menu.price||0);
  if(!item&&delta>0){item={menuId,menuName:menu.name,variantName,qty:0,price};cart.push(item)}
  if(item){
    item.qty+=delta;if(item.qty<=0)cart.splice(cart.indexOf(item),1)
  }
  openCustomerHome(cid,false)
}
function saveMerchantCustomerOrder(cid,mid){
  if(!cartMerchantHas(cid,mid)){toast("Belum ada menu yang dipilih");return}
  window.customerOpenMerchant=null;openCustomerHome(cid,false);toast("Pesanan mitra disimpan")
}

/* =========================
   CUSTOMER CART / SURVEY
========================= */
function openCustomerCart(cid,push=true){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  currentPage="customerCart:"+cid;
  const cart=getCart(cid);
  const mids=Object.keys(cart).filter(mid=>cart[mid].length);
  let total=0;
  const blocks=mids.map(mid=>{
    const m=merchantById(mid);if(!m)return "";
    const items=cart[mid];const sub=items.reduce((a,i)=>a+Number(i.price||0)*i.qty,0);total+=sub;
    return `<div class="cart-merchant"><b>${esc(m.name)}</b>
      ${items.map(i=>`<div class="cart-line"><span>${esc(i.menuName)}${i.variantName?` — ${esc(i.variantName)}`:""} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join("")}
      <div class="order-total">Subtotal: ${money(sub)}</div>
    </div>`
  }).join("");
  render(screen("LIHAT PESAN",`
    ${blocks||`<div class="empty">Belum ada pesanan.</div>`}
    <div class="card">
      <div class="cart-line"><b>TOTAL BELANJA</b><b>${money(total)}</b></div>
      <div class="cart-line"><span>Ongkir</span><span>Rp —</span></div>
      <div class="cart-line"><b>TOTAL PEMBAYARAN</b><b>Rp —</b></div>
      <div class="notice">Total pembayaran akan dihitung setelah ongkir diberikan oleh kurir.</div>
      <button class="btn" onclick="openPage('survey:${cid}')">SURVEI & KIRIM</button>
    </div>
  `),push)
}
function openSurvey(cid,push=true){
  currentPage="survey:"+cid;
  render(screen("SURVEI",`
    <div class="card">
      <div class="notice">SURVEI WAJIB DILEWATI SEBELUM PESANAN DIKIRIM.</div>
      <p class="muted">Isi survei yang telah ditentukan untuk pesanan ini.</p>
      <div class="card" style="margin:12px 0 0">
        <label>Survei</label>
        <textarea id="surveyAnswer" placeholder="Isi jawaban survei"></textarea>
      </div>
      <button class="btn" onclick="submitSurveyAndOrder('${cid}')">SELESAI SURVEI</button>
    </div>
  `),push)
}
function submitSurveyAndOrder(cid){
  const answer=document.getElementById("surveyAnswer").value.trim();
  if(!answer){toast("Survei wajib diisi");return}
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  const cart=getCart(cid);const mids=Object.keys(cart).filter(mid=>cart[mid].length);
  if(!mids.length){toast("Belum ada pesanan");return}
  /*
    Alur master memiliki ketergantungan ongkir sebelum KIRIM,
    sementara ongkir diisi kurir setelah menerima pesanan.
    Karena itu pesanan disimpan sebagai draft terkirim dengan shipping 0,
    dan kurir mengisi ongkir sebelum SELESAI.
  */
  const merchants=mids.map(mid=>{
    const m=merchantById(mid);
    return {
      merchantId:mid,merchantName:m.name,
      items:cart[mid].map(i=>({menuId:i.menuId,menuName:i.menuName,variantName:i.variantName,qty:i.qty,price:i.price}))
    }
  });
  const o={
    id:id("order"),courierId:c.courierId,customerId:c.id,customerName:c.name,
    customerLocation:c.location,locationText:c.location?`${c.location.lat}, ${c.location.lng}`:"",
    merchants,time:nowText(),shipping:0,completed:false,label:"PESANAN "+String(state.orders.length+1).padStart(2,"0"),
    survey:{completed:true,answer}
  };
  state.orders.push(o);
  c.firstOrderDone=true;
  const code=state.customerCodes.find(x=>x.id===c.codeId);if(code)code.active=true;
  save();
  Object.keys(cart).forEach(k=>delete cart[k]);
  openCustomerSent(cid,false)
}
function openCustomerSent(cid,push=true){
  currentPage="customerSent:"+cid;
  render(screen("PESANAN TERKIRIM",`
    <div class="card center">
      <div style="font-size:42px">✓</div>
      <h3>Pesanan berhasil dikirim</h3>
      <p class="muted">Pesanan sudah diteruskan kepada kurir.</p>
      <button class="btn" onclick="openCustomerHome('${cid}')">KEMBALI KE MENU</button>
    </div>
  `),push)
}

/* =========================
   PUBLIC LINKS
========================= */
function openPublicMerchant(mid,push=true){
  const m=merchantById(mid);
  if(!m){
    currentPage="publicMerchantMissing:"+mid;
    return render(screen("MITRA USAHA",`
      <div class="card center">
        <h3>Mitra tidak ditemukan</h3>
        <p class="muted">Data mitra dengan ID ini belum tersedia di penyimpanan aplikasi yang sedang dibuka.</p>
        <p class="muted">Untuk membuka data mitra dari HP lain, aplikasi harus memakai database online bersama.</p>
        <button class="btn" onclick="location.href=publicBaseUrl()">KEMBALI</button>
      </div>
    `),push);
  }
  const c=customerCurrent();
  setPendingMerchant(mid);
  setPendingCourier(m.courierId);
  if(c&&c.courierId===m.courierId){
    return openCustomerHome(c.id,push);
  }
  return openCustomerLogin(push);
}

/* =========================
   ROUTER
========================= */
function route(){
  const params=new URLSearchParams(window.location.search||"");
  const hash=location.hash||"";

  // Format link publik utama: ?mitra=ID_MITRA
  if(params.has("mitra")){
    const mid=params.get("mitra");
    return begin("publicMerchant:"+mid)
  }

  // Link pelanggan selalu masuk ke tampilan pelanggan: pelanggan terdaftar ke beranda,
  // pelanggan baru ke login kode. ID kurir ikut diperiksa saat kode dimasukkan.
  if(params.has("pelanggan")){
    const courierId=params.get("pelanggan");
    const c=customerCurrent();
    if(c&&c.courierId===courierId)return begin("customerHome:"+c.id);
    setPendingCourier(courierId);
    return begin("publicCustomer")
  }

  // Dukungan sementara untuk link lama berbentuk #mitra= / #pelanggan=.
  if(hash.startsWith("#mitra=")){
    const mid=decodeURIComponent(hash.slice(7));
    return begin("publicMerchant:"+mid)
  }
  if(hash.startsWith("#pelanggan=" )||hash==="#pelanggan"){
    const courierId=hash.startsWith("#pelanggan=")?decodeURIComponent(hash.slice(11)):null;
    const c=customerCurrent();
    if(c&&(!courierId||c.courierId===courierId))return begin("customerHome:"+c.id);
    setPendingCourier(courierId);
    return begin("publicCustomer")
  }

  if(hash==="#dashboard")return begin("dashboard");
  if(state.courier)return begin("dashboard");
  openRegister()
}
window.addEventListener("hashchange",route);

/* =========================
   INIT
   Baca parameter URL saat aplikasi pertama kali dibuka, baik dari
   file lokal Acode maupun dari alamat web seperti GitHub Pages.
========================= */
route();
</script>

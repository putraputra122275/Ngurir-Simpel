<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KONTROL APLIKASI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f7;
    color:#222;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

.header{
    background:#111827;
    color:#fff;
    padding:18px 16px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:21px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
}

.container{
    padding:15px;
}

.card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.center{
    text-align:center;
}

h2{
    font-size:19px;
    margin:4px 0 15px;
}

h3{
    font-size:16px;
    margin:5px 0 12px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin:12px 0 6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:12px;
    margin-top:9px;
    background:#111827;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#e5e7eb;
    color:#111;
}

button.success{
    background:#198754;
}

button.danger{
    background:#dc3545;
}

button.blue{
    background:#0d6efd;
}

.back{
    width:auto;
    background:none;
    color:#0d6efd;
    padding:0;
    margin:0 0 12px;
}

.list{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 4px;
    border-bottom:1px solid #ddd;
    cursor:pointer;
}

.list:last-child{
    border-bottom:0;
}

.list-info{
    min-width:0;
}

.list-name{
    font-weight:bold;
    overflow-wrap:anywhere;
}

.list-sub{
    color:#666;
    font-size:13px;
    margin-top:4px;
}

.arrow{
    font-size:22px;
}

.notice{
    padding:11px;
    border-radius:8px;
    background:#fff3cd;
    color:#664d03;
    margin-bottom:10px;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px 5px;
}

.total{
    border-top:1px solid #ccc;
    margin-top:12px;
    padding-top:12px;
    font-size:17px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

.date-item{
    padding:13px 5px;
    border-bottom:1px solid #ddd;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
}

.transaction{
    border-bottom:1px solid #ddd;
    padding:11px 0;
}

.transaction:last-child{
    border-bottom:0;
}

.transaction-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.amount{
    font-weight:bold;
}

.variant{
    font-size:13px;
    color:#666;
    margin-top:3px;
}

.status-row{
    margin-top:5px;
}

.status{
    display:inline-block;
    padding:4px 8px;
    border-radius:12px;
    font-size:11px;
    font-weight:bold;
}

.status.open{
    background:#d1e7dd;
    color:#0f5132;
}

.status.closed{
    background:#e5e7eb;
    color:#555;
}

.menu{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin-top:9px;
}

.menu-name{
    font-weight:bold;
}

.menu-price{
    margin-top:4px;
    color:#555;
}

.menu-status{
    margin-top:8px;
}

.radio-row{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-top:7px;
}

.radio-row label{
    display:flex;
    align-items:center;
    gap:5px;
    margin:0;
    font-weight:normal;
}

.radio-row input{
    width:auto;
}

.variant-row{
    display:flex;
    gap:7px;
    margin-top:7px;
}

.variant-row input{
    flex:1;
}

.order-group{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
}

.order-group h3{
    margin-bottom:8px;
}

.order-item{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.order-item:last-child{
    border-bottom:0;
}

.order-item-line{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.link-box{
    background:#f5f5f5;
    border:1px dashed #aaa;
    padding:10px;
    border-radius:8px;
    word-break:break-all;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#777;
    font-size:12px;
    padding:20px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <h1>KONTROL APLIKASI</h1>
    <p>Pengelolaan KURIR SIMPLE dan KEUANGAN PENGUSAHA</p>
</div>

<div id="app" class="container"></div>

<div class="footer">
    KONTROL APLIKASI
</div>

</div>

<script>

/* =========================================================
   DATA
========================================================= */

const state = {
    appNameCourier:"KURIR SIMPLE",
    appCodeCourier:"123",

    appNameFinance:"KEUANGAN PENGUSAHA",
    appCodeFinance:"456",

    couriers:[],
    shops:[],
    customers:[],
    orders:[],
    incomes:[],
    expenses:[],

    courierLink:null,
    customerLink:null,
    shopLink:null,

    selectedCourier:null,
    selectedShop:null,
    selectedCustomer:null,
    selectedOrder:null
};


/* =========================================================
   SAMPLE DATA
========================================================= */

function createSampleData(){

    if(localStorage.getItem("moderator_state")){
        try{
            Object.assign(
                state,
                JSON.parse(
                    localStorage.getItem("moderator_state")
                )
            );
            return;
        }catch(e){}
    }

    state.couriers = [];
    state.shops = [];
    state.customers = [];
    state.orders = [];
    state.incomes = [];
    state.expenses = [];

    saveState();
}


/* =========================================================
   STORAGE
========================================================= */

function saveState(){
    localStorage.setItem(
        "moderator_state",
        JSON.stringify(state)
    );
}


/* =========================================================
   HELPERS
========================================================= */

function app(){
    return document.getElementById("app");
}

function money(value){
    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(Number(value)||0);
}

function esc(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function uid(prefix){
    return prefix+"_"+Date.now()+"_"+Math.random()
        .toString(36)
        .substring(2,8);
}

function today(){
    return new Date().toISOString().slice(0,10);
}

function formatDate(date){
    if(!date)return "-";

    const d = new Date(date+"T00:00:00");

    return d.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"long",
        year:"numeric"
    });
}

function notify(text){
    alert(text);
}

function copyText(text){
    navigator.clipboard?.writeText(text)
        .then(()=>notify("Berhasil disalin."))
        .catch(()=>notify(text));
}


/* =========================================================
   NAVIGATION
========================================================= */

function back(){
    if(history.length>1){
        history.back();
    }else{
        showControlHome();
    }
}


/* =========================================================
   A1
   HALAMAN AWAL KONTROL APLIKASI
========================================================= */

function showControlHome(){

    app().innerHTML=`
        <div class="card center">

            <h2>KONTROL APLIKASI</h2>

            <label>Kode Aplikasi</label>

            <input
                id="controlCode"
                inputmode="numeric"
                placeholder="Masukkan kode aplikasi">

            <button onclick="controlLogin()">
                MASUK
            </button>

        </div>
    `;
}

function controlLogin(){

    const code =
        document.getElementById("controlCode")
        .value.trim();

    if(code===state.appCodeCourier){
        showCourierControl();
        return;
    }

    if(code===state.appCodeFinance){
        showFinanceControl();
        return;
    }

    notify("Kode aplikasi salah.");
}


/* =========================================================
   A2
   HALAMAN KURIR SIMPLE
========================================================= */

function showCourierControl(){

    app().innerHTML=`

        <button class="back" onclick="showControlHome()">
            ← KEMBALI
        </button>

        <div class="card center">

            <h2>${esc(state.appNameCourier)}</h2>

            <button onclick="showCourierUsers()">
                LIHAT PENGGUNA APLIKASI
            </button>

            <button
                class="blue"
                onclick="showCourierLink()">
                SALIN LINK UNTUK KURIR
            </button>

            <button
                class="secondary"
                onclick="showEditCourierApplication()">
                EDIT APLIKASI
            </button>

        </div>
    `;
}


/* =========================================================
   A3
   EDIT APLIKASI KURIR
========================================================= */

function showEditCourierApplication(){

    app().innerHTML=`

        <button class="back"
            onclick="showCourierControl()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>EDIT APLIKASI — KURIR SIMPLE</h2>

            <label>Nama Aplikasi</label>

            <input
                id="editCourierName"
                value="${esc(state.appNameCourier)}">

            <label>Kode Aplikasi</label>

            <input
                id="editCourierCode"
                inputmode="numeric"
                value="${esc(state.appCodeCourier)}">

            <button onclick="saveCourierApplication()">
                SIMPAN PERUBAHAN
            </button>

        </div>
    `;
}

function saveCourierApplication(){

    const name =
        document.getElementById("editCourierName")
        .value.trim();

    const code =
        document.getElementById("editCourierCode")
        .value.trim();

    if(!name || !code){
        notify("Nama aplikasi dan kode wajib diisi.");
        return;
    }

    state.appNameCourier=name;
    state.appCodeCourier=code;

    saveState();

    notify("Perubahan berhasil disimpan.");

    showCourierControl();
}


/* =========================================================
   A4
   PENGGUNA KURIR SIMPLE
========================================================= */

function showCourierUsers(){

    app().innerHTML=`

        <button class="back"
            onclick="showCourierControl()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>PENGGUNA KURIR SIMPLE</h2>

            ${
                state.couriers.length
                ?
                state.couriers.map(c=>`
                    <div class="list"
                        onclick="showCourierData('${c.id}')">

                        <div class="list-info">
                            <div class="list-name">
                                ${esc(c.name)}
                            </div>

                            <div class="list-sub">
                                ${esc(c.address)}
                            </div>
                        </div>

                        <div class="arrow">›</div>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Belum ada akun kurir.
                </div>`
            }

        </div>
    `;
}


/* =========================================================
   A5
   DATA KURIR
========================================================= */

function showCourierData(id){

    state.selectedCourier =
        state.couriers.find(c=>c.id===id);

    if(!state.selectedCourier){
        showCourierUsers();
        return;
    }

    const dates=[
        ...new Set(
            state.incomes
            .filter(x=>x.courierId===id)
            .map(x=>x.date)
        )
    ].sort().reverse();

    app().innerHTML=`

        <button class="back"
            onclick="showCourierUsers()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>DATA KURIR</h2>

            <p>
                <b>${esc(state.selectedCourier.name)}</b>
            </p>

            <p>
                ${esc(state.selectedCourier.address)}
            </p>

            <button onclick="showCourierIncomeHistory('${id}')">
                RIWAYAT PEMASUKAN
            </button>

        </div>

        <div class="card">

            ${
                dates.length
                ?
                dates.map(d=>`
                    <div class="date-item"
                        onclick="showCourierIncomeDetail(
                            '${id}',
                            '${d}'
                        )">

                        <span>${formatDate(d)}</span>
                        <span>›</span>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Belum ada riwayat pemasukan.
                </div>`
            }

        </div>
    `;
}

function showCourierIncomeHistory(id){
    showCourierData(id);
}


/* =========================================================
   A6
   DETAIL PEMASUKAN KURIR
========================================================= */

function showCourierIncomeDetail(id,date){

    const courier =
        state.couriers.find(c=>c.id===id);

    const rows =
        state.incomes.filter(
            x=>x.courierId===id && x.date===date
        );

    const total =
        rows.reduce(
            (sum,x)=>sum+(Number(x.amount)||0),
            0
        );

    app().innerHTML=`

        <button class="back"
            onclick="showCourierData('${id}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>DETAIL PEMASUKAN KURIR</h2>

            <p>
                <b>${formatDate(date)}</b>
            </p>

            <p>
                ${esc(courier?.name||"")}
            </p>

            ${
                rows.length
                ?
                rows.map(x=>`
                    <div class="transaction">

                        <div class="transaction-top">

                            <span>
                                ${esc(x.time||"-")}
                            </span>

                            <span class="amount">
                                ${money(x.amount)}
                            </span>

                        </div>

                        <div class="variant">
                            ${esc(x.area||x.address||"-")}
                        </div>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Tidak ada transaksi.
                </div>`
            }

            <div class="total">
                <span>TOTAL</span>
                <span>${money(total)}</span>
            </div>

        </div>
    `;
}


/* =========================================================
   LINK KURIR
========================================================= */

function showCourierLink(){

    const link =
        location.origin+
        location.pathname+
        "?kurir=daftar";

    state.courierLink=link;
    saveState();

    app().innerHTML=`

        <button class="back"
            onclick="showCourierControl()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>SALIN LINK UNTUK KURIR</h2>

            <div class="link-box">
                ${esc(link)}
            </div>

            <button onclick="copyText('${esc(link)}')">
                SALIN LINK
            </button>

        </div>
    `;
}


/* =========================================================
   A7
   HALAMAN KEUANGAN PENGUSAHA
========================================================= */

function showFinanceControl(){

    app().innerHTML=`

        <button class="back"
            onclick="showControlHome()">
            ← KEMBALI
        </button>

        <div class="card center">

            <h2>${esc(state.appNameFinance)}</h2>

            <button onclick="showFinanceUsers()">
                LIHAT PENGGUNA APLIKASI
            </button>

            <button
                class="blue"
                onclick="showFinanceLink()">
                SALIN LINK APLIKASI
            </button>

            <button
                class="secondary"
                onclick="showEditFinanceApplication()">
                EDIT APLIKASI
            </button>

        </div>
    `;
}


/* =========================================================
   A8
========================================================= */

function showEditFinanceApplication(){

    app().innerHTML=`

        <button class="back"
            onclick="showFinanceControl()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>EDIT APLIKASI — KEUANGAN PENGUSAHA</h2>

            <label>Nama Aplikasi</label>

            <input
                id="editFinanceName"
                value="${esc(state.appNameFinance)}">

            <label>Kode Aplikasi</label>

            <input
                id="editFinanceCode"
                inputmode="numeric"
                value="${esc(state.appCodeFinance)}">

            <button onclick="saveFinanceApplication()">
                SIMPAN PERUBAHAN
            </button>

        </div>
    `;
}

function saveFinanceApplication(){

    const name =
        document.getElementById("editFinanceName")
        .value.trim();

    const code =
        document.getElementById("editFinanceCode")
        .value.trim();

    if(!name || !code){
        notify("Nama aplikasi dan kode wajib diisi.");
        return;
    }

    state.appNameFinance=name;
    state.appCodeFinance=code;

    saveState();

    notify("Perubahan berhasil disimpan.");

    showFinanceControl();
}


/* =========================================================
   A9
========================================================= */

function showFinanceUsers(){

    app().innerHTML=`

        <button class="back"
            onclick="showFinanceControl()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>PENGGUNA KEUANGAN PENGUSAHA</h2>

            ${
                state.businessUsers?.length
                ?
                state.businessUsers.map(u=>`
                    <div class="list"
                        onclick="showBusinessUser('${u.id}')">

                        <div class="list-info">

                            <div class="list-name">
                                ${esc(u.ownerName)}
                            </div>

                            <div class="list-sub">
                                ${esc(u.businessName)}
                                <br>
                                ${esc(u.address)}
                            </div>

                        </div>

                        <div class="arrow">›</div>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Belum ada pengguna keuangan pengusaha.
                </div>`
            }

        </div>
    `;
}


/* =========================================================
   A10
========================================================= */

function showBusinessUser(id){

    const user =
        (state.businessUsers||[])
        .find(x=>x.id===id);

    if(!user){
        showFinanceUsers();
        return;
    }

    state.selectedBusiness=user;

    app().innerHTML=`

        <button class="back"
            onclick="showFinanceUsers()">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>MEMILIH PENGUSAHA</h2>

            <p>
                <b>${esc(user.ownerName)}</b>
            </p>

            <p>
                ${esc(user.businessName)}
            </p>

            <button
                onclick="showBusinessIncome('${id}')">
                PEMASUKAN PENGUSAHA
            </button>

            <button
                onclick="showBusinessExpense('${id}')">
                PENGELUARAN PENGUSAHA
            </button>

        </div>
    `;
}


/* =========================================================
   A11
========================================================= */

function showBusinessIncome(id){

    const rows =
        state.incomes.filter(
            x=>x.businessId===id
        );

    const dates=[
        ...new Set(rows.map(x=>x.date))
    ].sort().reverse();

    app().innerHTML=`

        <button class="back"
            onclick="showBusinessUser('${id}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>PEMASUKAN PENGUSAHA</h2>

            ${
                dates.length
                ?
                dates.map(d=>`
                    <div class="date-item"
                        onclick="showBusinessIncomeDetail(
                            '${id}',
                            '${d}'
                        )">

                        <span>${formatDate(d)}</span>
                        <span>›</span>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Belum ada pemasukan.
                </div>`
            }

        </div>
    `;
}


/* =========================================================
   A12
========================================================= */

function showBusinessIncomeDetail(id,date){

    const user =
        (state.businessUsers||[])
        .find(x=>x.id===id);

    const rows =
        state.incomes.filter(
            x=>x.businessId===id &&
            x.date===date
        );

    const total =
        rows.reduce(
            (sum,x)=>sum+(Number(x.amount)||0),
            0
        );

    app().innerHTML=`

        <button class="back"
            onclick="showBusinessIncome('${id}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>DETAIL PEMASUKAN PENGUSAHA</h2>

            <p><b>${formatDate(date)}</b></p>

            <p>${esc(user?.businessName||"")}</p>

            ${
                rows.length
                ?
                rows.map(x=>`
                    <div class="transaction">

                        <div class="transaction-top">

                            <span>${esc(x.time||"-")}</span>

                            <span class="amount">
                                ${money(x.amount)}
                            </span>

                        </div>

                        <div class="variant">
                            ${esc(x.description||"-")}
                        </div>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Tidak ada transaksi.
                </div>`
            }

            <div class="total">
                <span>TOTAL</span>
                <span>${money(total)}</span>
            </div>

        </div>
    `;
}


/* =========================================================
   A13
========================================================= */

function showBusinessExpense(id){

    const rows =
        state.expenses.filter(
            x=>x.businessId===id
        );

    const dates=[
        ...new Set(rows.map(x=>x.date))
    ].sort().reverse();

    app().innerHTML=`

        <button class="back"
            onclick="showBusinessUser('${id}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>PENGELUARAN PENGUSAHA</h2>

            ${
                dates.length
                ?
                dates.map(d=>`
                    <div class="date-item"
                        onclick="showBusinessExpenseDetail(
                            '${id}',
                            '${d}'
                        )">

                        <span>${formatDate(d)}</span>
                        <span>›</span>

                    </div>
                `).join("")
                :
                `<div class="empty">
                    Belum ada pengeluaran.
                </div>`
            }

        </div>
    `;
}


/* =========================================================
   A14
========================================================= */

function showBusinessExpenseDetail(id,date){

    const user =
        (state.businessUsers||[])
        .find(x=>x.id===id);

    const rows =
        state.expenses.filter(
            x=>x.businessId===id &&
            x.date===date
        );

    const total =
        rows.reduce(
            (sum,x)=>sum+(Number(x.amount)||0),
            0
        );

    app().innerHTML=`

        <button class="back"
            onclick="showBusinessExpense('${id}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>DETAIL PENGELUARAN PENGUSAHA</h2>

            <p><b>${formatDate(date)}</b></p>

            <p>${esc(user?.businessName||"")}</p>

            ${

function showVariantForm(shopId){

    app().innerHTML=`

        <button class="back"
            onclick="showAddMenu('${shopId}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>TAMBAH MENU</h2>

            <label>Nama Menu</label>
            <input id="variantMenuName">

            <label>Harga Menu</label>
            <input
                id="variantBasePrice"
                type="number">

            <h3>JENIS VARIAN MENU</h3>

            <div class="radio-row">

                <label>
                    <input
                        type="radio"
                        name="selectionRule"
                        value="one">
                    Hanya pilih satu
                </label>

                <label>
                    <input
                        type="radio"
                        name="selectionRule"
                        value="many">
                    Bisa pilih lebih dari satu
                </label>

            </div>

            <h3>ATURAN HARGA MENU</h3>

            <div class="radio-row">

                <label>
                    <input
                        type="radio"
                        name="priceRule"
                        value="different"
                        onchange="toggleVariantPrices()">
                    Harga tiap varian beda
                </label>

                <label>
                    <input
                        type="radio"
                        name="priceRule"
                        value="same"
                        onchange="toggleVariantPrices()">
                    Harga tiap varian sama
                </label>

            </div>

            <div id="variantInputs"></div>

            <button
                class="secondary"
                onclick="addVariantInput()">
                TAMBAH VARIAN
            </button>

            <button onclick="saveVariantMenu('${shopId}')">
                SIMPAN
            </button>

        </div>
    `;

    addVariantInput();
}

function addVariantInput(){

    const box =
        document.getElementById("variantInputs");

    const div =
        document.createElement("div");

    div.className="variant-row";

    div.innerHTML=`
        <input
            class="variantName"
            placeholder="Nama Varian">

        <input
            class="variantPrice"
            type="number"
            placeholder="Harga Varian"
            style="display:none">
    `;

    box.appendChild(div);

    toggleVariantPrices();
}

function toggleVariantPrices(){

    const rule =
        document.querySelector(
            'input[name="priceRule"]:checked'
        )?.value;

    document.querySelectorAll(".variantPrice")
        .forEach(x=>{
            x.style.display =
                rule==="different"
                ? "block"
                : "none";
        });
}

function saveVariantMenu(shopId){

    const name =
        document.getElementById("variantMenuName")
        .value.trim();

    const basePrice =
        Number(
            document.getElementById("variantBasePrice")
            .value
        );

    const selectionRule =
        document.querySelector(
            'input[name="selectionRule"]:checked'
        )?.value;

    const priceRule =
        document.querySelector(
            'input[name="priceRule"]:checked'
        )?.value;

    if(!name || !basePrice){
        notify("Nama menu dan harga wajib diisi.");
        return;
    }

    if(!selectionRule){
        notify("Pilih jenis pemilihan varian.");
        return;
    }

    if(!priceRule){
        notify("Pilih aturan harga menu.");
        return;
    }

    const names =
        [...document.querySelectorAll(".variantName")]
        .map(x=>x.value.trim())
        .filter(Boolean);

    if(!names.length){
        notify("Tambahkan minimal satu varian.");
        return;
    }

    const prices =
        [...document.querySelectorAll(".variantPrice")];

    const variants =
        names.map((name,i)=>({

            name,

            price:
                priceRule==="different"
                ?
                Number(prices[i]?.value||0)
                :
                basePrice

        }));

    if(
        priceRule==="different" &&
        variants.some(x=>!x.price)
    ){
        notify("Semua harga varian wajib diisi.");
        return;
    }

    const shop =
        state.shops.find(x=>x.id===shopId);

    shop.menus.push({

        id:uid("menu"),

        name,

        price:
            priceRule==="same"
            ? basePrice
            : 0,

        priceRule,

        selectionRule,

        variants,

        status:"TERSEDIA"
    });

    saveState();

    showShopMenus(shopId);
}

                </label>

                <label>
                    <input
                        type="radio"
                        name="editPriceRule"
                        value="same"
                        ${menu.priceRule==="same"?"checked":""}
                        onchange="editTogglePrice()">
                    Harga tiap varian sama
                </label>

            </div>

            <div id="editVariants">

                ${
                    menu.variants.map(v=>`
                        <div class="variant-row">

                            <input
                                class="editVariantName"
                                value="${esc(v.name)}">

                            <input
                                class="editVariantPrice"
                                type="number"
                                value="${v.price||0}"
                                ${
                                    menu.priceRule==="different"
                                    ? ""
                                    : "style='display:none'"
                                }>

                        </div>
                    `).join("")
                }

            </div>

            <button
                class="secondary"
                onclick="addEditVariant()">
                TAMBAH VARIAN
            </button>

            <button
                onclick="saveEditedMenu(
                    '${shopId}',
                    '${menuId}'
                )">
                SIMPAN PERUBAHAN
            </button>

        </div>
    `;
}

function editTogglePrice(){

    const rule =
        document.querySelector(
            'input[name="editPriceRule"]:checked'
        )?.value;

    document.getElementById("editMenuPrice")
        .style.display =
        rule==="different"
        ? "none"
        : "block";

    document.querySelectorAll(".editVariantPrice")
        .forEach(x=>{
            x.style.display =
                rule==="different"
                ? "block"
                : "none";
        });
}

function addEditVariant(){

    const box =
        document.getElementById("editVariants");

    const div =
        document.createElement("div");

    div.className="variant-row";

    div.innerHTML=`
        <input
            class="editVariantName"
            placeholder="Nama Varian">

        <input
            class="editVariantPrice"
            type="number"
            placeholder="Harga Varian">
    `;

    box.appendChild(div);

    editTogglePrice();
}

function saveEditedMenu(shopId,menuId){

    const shop =
        state.shops.find(x=>x.id===shopId);

    const menu =
        shop.menus.find(x=>x.id===menuId);

    const name =
        document.getElementById("editMenuName")
        .value.trim();

    const price =
        Number(
            document.getElementById("editMenuPrice")
            .value
        );

    const selectionRule =
        document.querySelector(
            'input[name="editSelection"]:checked'
        )?.value;

    const priceRule =
        document.querySelector(
            'input[name="editPriceRule"]:checked'
        )?.value;

    if(!name || !selectionRule || !priceRule){
        notify("Lengkapi seluruh pilihan menu.");
        return;
    }

    const names =
        [...document.querySelectorAll(".editVariantName")]
        .map(x=>x.value.trim())
        .filter(Boolean);

    const prices =
        [...document.querySelectorAll(".editVariantPrice")];

    if(names.length){

        const variants =
            names.map((n,i)=>({

                name:n,

                price:
                    priceRule==="different"
                    ?
                    Number(prices[i]?.value||0)
                    :
                    price

            }));

        if(
            priceRule==="different" &&
            variants.some(x=>!x.price)
        ){
            notify("Semua harga varian wajib diisi.");
            return;
        }

        menu.variants=variants;

    }else{

        menu.variants=[];

    }

    menu.name=name;
    menu.selectionRule=selectionRule;
    menu.priceRule=priceRule;

    menu.price =
        priceRule==="same"
        ? price
        : 0;

    saveState();

    showShopMenus(shopId);
}

function groupTotal(group){

    return group.items.reduce(
        (sum,item)=>
            sum+
            Number(item.price||0)*
            Number(item.qty||0),
        0
    );
}

function orderTotal(order){

    return order.groups.reduce(
        (sum,g)=>sum+groupTotal(g),
        0
    );
}

function deleteOrderItem(orderId,shopId,index){

    const order =
        state.orders.find(x=>x.id===orderId);

    const group =
        order.groups.find(x=>x.shopId===shopId);

    group.items.splice(index,1);

    order.groups =
        order.groups.filter(
            x=>x.items.length
        );

    saveState();

    showCourierOrderDetail(
        order.courierId,
        order.id
    );
}

                        ? money(
                            orderTotal(order)+
                            Number(order.shipping)
                        )
                        : "BELUM DIHITUNG"
                    }

                </span>

            </div>

            <button onclick="sendCustomerWhatsApp('${order.id}')">

            </button>

function calculateShipping(orderId){

    const value =
        Number(
            document.getElementById("shippingCost")
            .value
        );

    const order =
        state.orders.find(x=>x.id===orderId);

    order.shipping=value;

    document.getElementById("paymentTotal")
        .textContent =
        money(
            orderTotal(order)+value
        );

    saveState();
}

function sendShopOrderWhatsApp(orderId,shopId){

    const order =
        state.orders.find(x=>x.id===orderId);

    const group =
        order.groups.find(
            x=>x.shopId===shopId
        );

    const shop =
        state.shops.find(
            x=>x.id===shopId
        );

    let text=
        "PESANAN PELANGGAN\n\n"+
        "Pelanggan: "+order.customerName+"\n"+
        "Mitra Usaha: "+group.shopName+"\n\n";

    group.items.forEach(item=>{
        text +=
            item.name+
            (item.variant?" "+item.variant:"")+
            " x "+item.qty+
            " = "+money(item.qty*item.price)+
            "\n";
    });

    text +=
        "\nTOTAL: "+
        money(groupTotal(group));

    if(shop?.phone){
        window.open(
            "https://wa.me/"+
            shop.phone.replace(/\D/g,"")+
            "?text="+
            encodeURIComponent(text),
            "_blank"
        );
    }else{
        notify(text);
    }
}

function sendCustomerWhatsApp(orderId){

    const order =
        state.orders.find(x=>x.id===orderId);

    let text=
        "PESANAN PELANGGAN\n\n";

    order.groups.forEach(g=>{

        text +=
            g.shopName+"\n";

        g.items.forEach(i=>{
            text +=
                i.name+
                (i.variant?" "+i.variant:"")+
                " x "+i.qty+
                " = "+money(i.qty*i.price)+
                "\n";
        });

        text +=
            "Total: "+
            money(groupTotal(g))+
            "\n\n";
    });

    text +=
        "TOTAL BELANJA: "+
        money(orderTotal(order))+
        "\nONGKIR: "+
        money(order.shipping||0)+
        "\nTOTAL PEMBAYARAN: "+
        money(
            orderTotal(order)+
            Number(order.shipping||0)
        );

    window.open(
        "https://wa.me/?text="+
        encodeURIComponent(text),
        "_blank"
    );
}

            );

        if(!courier)return false;

        return !shop.kecamatan ||
            courier.serviceAreas.includes(
                shop.kecamatan
            );
    });
}

                    return `
                        <div class="menu"
                            style="${
                                unavailable
                                ? "opacity:.45"
                                : ""
                            }">

                            <div class="menu-name">
                                ${esc(menu.name)}
                            </div>

                            ${
                                menu.priceRule==="same"
                                ?
                                `<div class="menu-price">
                                    ${money(menu.price)}
                                </div>`
                                :
                                ""
                            }

                            ${
                                menu.variants.length
                                ?
                                menu.variants.map(v=>`
                                    <div
                                        class="variant-row">

                                        <div style="flex:1">
                                            ${esc(v.name)}

                                            ${
                                                menu.priceRule==="different"
                                                ?
                                                `<div class="menu-price">
                                                    ${money(v.price)}
                                                </div>`
                                                :
                                                ""
                                            }
                                        </div>

                                        <button
                                            style="width:38px"
                                            ${
                                                unavailable
                                                ? "disabled"
                                                : ""
                                            }
                                            onclick="changeCustomerQty(
                                                '${shopId}',
                                                '${menu.id}',
                                                '${esc(v.name)}',
                                                -1,
                                                ${v.price}
                                            )">
                                            −
                                        </button>

                                        <span
                                            id="qty_${menu.id}_${encodeURIComponent(v.name)}"
                                            style="padding:12px 4px">
                                            ${getCartQty(
                                                shopId,
                                                menu.id,
                                                v.name
                                            )}
                                        </span>

                                        <button
                                            style="width:38px"
                                            ${
                                                unavailable
                                                ? "disabled"
                                                : ""
                                            }
                                            onclick="changeCustomerQty(
                                                '${shopId}',
                                                '${menu.id}',
                                                '${esc(v.name)}',
                                                1,
                                                ${v.price}
                                            )">
                                            +
                                        </button>

                                    </div>
                                `).join("")
                                :
                                `
                                <div
                                    class="variant-row">

                                    <div style="flex:1">
                                        ${money(menu.price)}
                                    </div>

                                    <button
                                        style="width:38px"
                                        ${
                                            unavailable
                                            ? "disabled"
                                            : ""
                                        }
                                        onclick="changeCustomerQty(
                                            '${shopId}',
                                            '${menu.id}',
                                            '',
                                            -1,
                                            ${menu.price}
                                        )">
                                        −
                                    </button>

                                    <span
                                        id="qty_${menu.id}_none"
                                        style="padding:12px 4px">
                                        ${getCartQty(
                                            shopId,
                                            menu.id,
                                            ""
                                        )}
                                    </span>

                                    <button
                                        style="width:38px"
                                        ${
                                            unavailable
                                            ? "disabled"
                                            : ""
                                        }
                                        onclick="changeCustomerQty(
                                            '${shopId}',
                                            '${menu.id}',
                                            '',
                                            1,
                                            ${menu.price}
                                        )">
                                        +
                                    </button>

                                </div>
                                `
                            }

                            ${
                                unavailable
                                ?
                                `<div class="status closed">
                                    HABIS
                                </div>`
                                :
                                ""
                            }

                        </div>
                    `;
                }).join("")
            }

            <button
                onclick="startOrdering('${customerId}')">
                SELESAI
            </button>

        </div>
    `;
}

let customerCart={};

function cartKey(shopId,menuId,variant){
    return shopId+"|"+menuId+"|"+variant;
}

function getCartQty(shopId,menuId,variant){

    return Number(
        customerCart[
            cartKey(shopId,menuId,variant)
        ]?.qty||0
    );
}

function changeCustomerQty(
    shopId,
    menuId,
    variant,
    change,
    price
){

    const key =
        cartKey(
            shopId,
            menuId,
            variant
        );

    if(!customerCart[key]){
        customerCart[key]={
            shopId,
            menuId,
            variant,
            qty:0,
            price
        };
    }

    customerCart[key].qty =
        Math.max(
            0,
            customerCart[key].qty+
            change
        );

    const el =
        document.getElementById(
            "qty_"+
            menuId+
            "_"+
            encodeURIComponent(variant||"none")
        );

    if(el){
        el.textContent=
            customerCart[key].qty;
    }
}


/* =========================================================
   D7 / D8
========================================================= */

function showCustomerCart(customerId){

    const groups={};

    Object.values(customerCart)
        .filter(x=>x.qty>0)
        .forEach(item=>{

            if(!groups[item.shopId]){
                const shop =
                    state.shops.find(
                        x=>x.id===item.shopId
                    );

                groups[item.shopId]={
                    shopId:item.shopId,
                    shopName:shop?.name||"",
                    items:[]
                };
            }

            const shop =
                state.shops.find(
                    x=>x.id===item.shopId
                );

            const menu =
                shop?.menus.find(
                    x=>x.id===item.menuId
                );

            groups[item.shopId].items.push({

                name:menu?.name||"",

                variant:item.variant,

                qty:item.qty,

                price:item.price
            });
        });

    const list=
        Object.values(groups);

    const total =
        list.reduce(
            (sum,g)=>sum+groupTotal(g),
            0
        );

    app().innerHTML=`

        <button class="back"
            onclick="startOrdering('${customerId}')">
            ← KEMBALI
        </button>

        <div class="card">

            <h2>PESANAN SAYA</h2>

            ${
                list.length
                ?
                list.map(g=>`

                    <div class="order-group">

                        <h3>
                            ${esc(g.shopName)}
                        </h3>

                        ${
                            g.items.map(i=>`
                                <div class="order-item-line">

                                    <span>
                                        ${esc(i.name)}
                                        ${
                                            i.variant
                                            ? " "+esc(i.variant)
                                            : ""
                                        }
                                        ${i.qty}
                                        ×
                                        ${money(i.price)}
                                    </span>

                                    <span>
                                        ${money(
                                            i.qty*i.price
                                        )}
                                    </span>

                                </div>
                            `).join("")
                        }

                        <div class="total">

                            <span>TOTAL</span>

                            <span>
                                ${money(groupTotal(g))}
                            </span>

                        </div>

                    </div>

                `).join("")
                :
                `<div class="empty">
                    Belum ada pesanan.
                </div>`
            }

            <div class="total">

                <span>TOTAL KESELURUHAN</span>

                <span>
                    ${money(total)}
                </span>

            </div>

            <button
                onclick="sendCustomerOrder('${customerId}')">
                KIRIM
            </button>

        </div>
    `;
}

function sendCustomerOrder(customerId){

    const customer =
        state.customers.find(
            x=>x.id===customerId
        );

    const groups={};

    Object.values(customerCart)
        .filter(x=>x.qty>0)
        .forEach(item=>{

            if(!groups[item.shopId]){

                const shop =
                    state.shops.find(
                        x=>x.id===item.shopId
                    );

                groups[item.shopId]={
                    shopId:item.shopId,
                    shopName:shop?.name||"",
                    items:[]
                };
            }

            const shop =
                state.shops.find(
                    x=>x.id===item.shopId
                );

            const menu =
                shop.menus.find(
                    x=>x.id===item.menuId
                );

            groups[item.shopId].items.push({

                name:menu.name,

                variant:item.variant,

                qty:item.qty,

                price:item.price
            });
        });

    const list=
        Object.values(groups);

    if(!list.length){
        notify("Belum ada menu yang dipilih.");
        return;
    }

    const order={

        id:uid("order"),

        courierId:
            customer.courierId,

        customerId,

        customerName:
            customer.name,

        createdAt:Date.now(),

        groups:list,

        shipping:0,

        status:"TERKIRIM"
    };

    state.orders.push(order);

    saveState();

    customerCart={};

    showOrderSent(customerId);
}

            }

    `;
}


/* =========================================================
   LINK ROUTER
========================================================= */

function route(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    if(params.get("kurir")==="daftar"){
        showCourierPublicHome();
        return;
    }

    if(params.get("keuangan")==="daftar"){
        showFinancePublicHome();
        return;
    }

    if(params.get("mitra")==="daftar"){
        showPartnerPublicHome();
        return;
    }

    if(params.get("pelanggan")==="daftar"){
        showCustomerPublicHome();
        return;
    }

    showControlHome();
}

function registerBusiness(){

    const user={

        id:uid("business"),

        ownerName:
            document.getElementById("ownerName")
            .value.trim(),

        businessName:
            document.getElementById("businessName")
            .value.trim(),

        address:
            document.getElementById("businessAddress")
            .value.trim()

    };

    if(
        !user.ownerName ||
        !user.businessName ||
        !user.address
    ){
        notify("Lengkapi data pengusaha.");
        return;
    }

    if(!state.businessUsers){
        state.businessUsers=[];
    }

    state.businessUsers.push(user);

    saveState();

    showBusinessUser(user.id);
}

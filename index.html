<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurir Simpel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #f5f5f5; max-width: 480px; margin: 0 auto; min-height: 100vh; }
    .layar { display: none; padding: 20px; }
    .layar.aktif { display: block; }

    .logo { font-size: 48px; color: #ff6b00; font-weight: bold; text-align: center; margin: 60px 0 10px; }
    .nama-app { font-size: 28px; color: #333; text-align: center; margin-bottom: 60px; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
    .btn-utama { background: #ff6b00; color: white; }
    .btn-utama:active { background: #e65c00; }
    .btn-hijau { background: #28a745; color: white; }
    .btn-hijau:active { background: #218838; }
    .btn-biru { background: #007bff; color: white; }
    .btn-biru:active { background: #0056b3; }
    .input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .input:focus { outline: none; border-color: #ff6b00; }
    .kotak { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .label { font-weight: bold; color: #333; margin-bottom: 6px; display: block; }
    .kartu-kedai { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .nama-kedai { font-weight: bold; font-size: 18px; color: #333; margin-bottom: 5px; }
    .info { color: #666; font-size: 14px; margin-bottom: 8px; }
    .link-kotak { background: #e3f2fd; padding: 12px; border-radius: 8px; word-break: break-all; font-size: 13px; color: #0d47a1; margin: 10px 0; }
    .ikon-berhasil { font-size: 70px; color: #28a745; text-align: center; margin: 30px 0 15px; }
    .teks-tengah { text-align: center; color: #333; font-size: 17px; line-height: 1.6; }
    .baris { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .baris:last-child { border-bottom: none; }
    .total { font-size: 20px; color: #ff6b00; font-weight: bold; }
    .spasi-bawah { height: 40px; }
  </style>
</head>
<body>

<!-- ========== HALAMAN AWAL — CUMA ADA SAYA KURIR ========== -->
<div id="halaman-awal" class="layar aktif">
  <div class="logo">🚲</div>
  <h1 class="nama-app">Kurir Simpel</h1>
  <button class="btn btn-utama" onclick="bukaHalaman('halaman-kurir')">🚚 Saya Kurir</button>
</div>

<!-- ========== HALAMAN KURIR ========== -->
<div id="halaman-kurir" class="layar">
  <div class="kotak">
    <h3 style="margin-bottom:15px; text-align:center;">🚚 Daftar Akun Kurir</h3>
    <label class="label">Nama Lengkap</label>
    <input type="text" id="nama-kurir" class="input" placeholder="Nama Anda">
    <label class="label">Nomor WhatsApp</label>
    <input type="tel" id="wa-kurir" class="input" placeholder="081234567890">
    <button class="btn btn-utama" onclick="daftarKurir()">Daftar & Buat Link</button>
  </div>

  <div class="kotak" id="kotak-link" style="display:none;">
    <h3 style="margin-bottom:10px;">🔗 Link Pendaftaran Kedai</h3>
    <p style="font-size:14px; color:#666; margin-bottom:8px;">Kirim link ini ke kedai agar mereka bisa mendaftar:</p>
    <div class="link-kotak" id="link-kedai"></div>
    <button class="btn btn-biru" onclick="salinLink()">📋 Salin Link</button>
  </div>

  <h3 style="margin:25px 0 15px;">🏪 Daftar Kedai Terdaftar</h3>
  <div id="daftar-kedai-kurir"></div>
  <div class="spasi-bawah"></div>
</div>

<!-- ========== HALAMAN KEDAI — ISI DATA ========== -->
<div id="halaman-daftar-kedai" class="layar">
  <div class="kotak" id="kotak-form-kedai">
    <h3 style="margin-bottom:15px; text-align:center;">🏪 Daftarkan Kedai Anda</h3>
    <label class="label">Nama Kedai</label>
    <input type="text" id="nama-kedai" class="input" placeholder="Contoh: Kedai Makan Bahupapan">
    <label class="label">Alamat Kedai</label>
    <input type="text" id="alamat-kedai" class="input" placeholder="Contoh: Bahupapan, Lorong 1">
    <label class="label">Nomor WhatsApp Kedai</label>
    <input type="tel" id="wa-kedai" class="input" placeholder="081234567890">
    <label class="label">Menu / Makanan Utama</label>
    <input type="text" id="menu-kedai" class="input" placeholder="Contoh: Nasi Kuning, Mie, Kopi">
    <button class="btn btn-hijau" onclick="daftarKedai()">✅ Kirim Pendaftaran</button>
  </div>

  <div id="berhasil-kedai" style="display:none;">
    <div class="ikon-berhasil">✅</div>
    <p class="teks-tengah">Pendaftaran berhasil dikirim!<br>Kurir akan segera menghubungi Anda.</p>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ✅ KODE FIREBASE SUDAH DIISI MILIKMU
const firebaseConfig = {
  apiKey: "AIzaSyBtV4zt3ZOLYsPn4SuudJ4Oy5C6CrewWA8",
  authDomain: "ngurir-simpel.firebaseapp.com",
  projectId: "ngurir-simpel",
  storageBucket: "ngurir-simpel.firebasestorage.app",
  messagingSenderId: "418400472594",
  appId: "1:418400472594:web:b4c228c633de5a0ccc12cb",
  measurementId: "G-NJRBGTEPV8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let idKurirSaya = localStorage.getItem('idKurir') || null;

// Ganti Layar
function bukaHalaman(id) {
  document.querySelectorAll('.layar').forEach(l => l.classList.remove('aktif'));
  document.getElementById(id).classList.add('aktif');
}

// ========== KURIR ==========
async function daftarKurir() {
  const nama = document.getElementById('nama-kurir').value.trim();
  const wa = document.getElementById('wa-kurir').value.trim();
  if (!nama || !wa) return alert('Isi Nama & Nomor WhatsApp!');

  const ref = await db.collection('kurir').add({ nama, wa, waktu: firebase.firestore.FieldValue.serverTimestamp() });
  idKurirSaya = ref.id;
  localStorage.setItem('idKurir', idKurirSaya);
  
  const link = window.location.origin + window.location.pathname + '?idkurir=' + idKurirSaya;
  document.getElementById('link-kedai').textContent = link;
  document.getElementById('kotak-link').style.display = 'block';
  alert('Berhasil Daftar! Link pendaftaran kedai sudah dibuat ✅');
  
  pantauKedai();
}

function salinLink() {
  const link = document.getElementById('link-kedai').textContent;
  navigator.clipboard.writeText(link).then(() => alert('✅ Link berhasil disalin!'));
}

// Pantau kedai — otomatis muncul di HP Kurir
function pantauKedai() {
  if (!idKurirSaya) return;
  db.collection('kedai').where('idKurir', '==', idKurirSaya)
    .onSnapshot(snap => {
      const wadah = document.getElementById('daftar-kedai-kurir');
      wadah.innerHTML = '';
      if (snap.empty) { wadah.innerHTML = '<p style="color:#888; text-align:center;">Belum ada kedai terdaftar</p>'; return; }
      snap.forEach(doc => {
        const k = doc.data();
        wadah.innerHTML += `
          <div class="kartu-kedai">
            <div class="nama-kedai">${k.nama}</div>
            <div class="info">📍 ${k.alamat}</div>
            <div class="info">📞 ${k.wa}</div>
            <div class="info">🍽 ${k.menu}</div>
          </div>
        `;
      });
    });
}

// ========== KEDAI ==========
async function daftarKedai() {
  const nama = document.getElementById('nama-kedai').value.trim();
  const alamat = document.getElementById('alamat-kedai').value.trim();
  const wa = document.getElementById('wa-kedai').value.trim();
  const menu = document.getElementById('menu-kedai').value.trim();
  const idKurir = new URLSearchParams(window.location.search).get('idkurir');
  
  if (!nama || !alamat || !wa || !menu) return alert('Lengkapi semua data!');
  if (!idKurir) return alert('Link tidak valid! Gunakan link dari kurir.');

  await db.collection('kedai').add({
    nama, alamat, wa, menu, idKurir,
    waktu: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('kotak-form-kedai').style.display = 'none';
  document.getElementById('berhasil-kedai').style.display = 'block';
}

// Jalankan saat halaman dimuat
window.onload = () => {
  if (idKurirSaya) pantauKedai();
  // Jika kedai buka dari link kurir → langsung tampilkan form kedai
  if (new URLSearchParams(window.location.search).has('idkurir')) {
    bukaHalaman('halaman-daftar-kedai');
  }
};
</script>

</body>
</html>

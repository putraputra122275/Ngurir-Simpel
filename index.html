<script>
"use strict";


/* =========================================================
   SUPABASE
   Tambahan koneksi database. Bagian lain dipertahankan.
========================================================= */

const SUPABASE_URL="https://xkysusfemehvdaqkyzhg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_JDmN5TndzBue7Rsmeiphtw_K2MzPcbA";
const sb=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let supabaseReady=false;
let loadingSharedData=false;

async function syncToSupabase(){
  try{
    if(!data.courier?.id)return;
    const payload={
      courier_id:data.courier.id,
      data:data,
      updated_at:new Date().toISOString()
    };
    const {error}=await sb
      .from("kurir_app_state")
      .upsert(payload,{onConflict:"courier_id"});
    if(error)throw error;
    supabaseReady=true;
  }catch(e){
    console.warn("Supabase sync gagal:",e);
  }
}

async function loadSharedByCourier(courierId){
  try{
    const {data:row,error}=await sb
      .from("kurir_app_state")
      .select("data")
      .eq("courier_id",courierId)
      .maybeSingle();
    if(error)throw error;
    if(row?.data){
      data={
        courier:row.data.courier||null,
        partners:Array.isArray(row.data.partners)?row.data.partners:[],
        customers:Array.isArray(row.data.customers)?row.data.customers:[],
        orders:Array.isArray(row.data.orders)?row.data.orders:[],
        incomes:Array.isArray(row.data.incomes)?row.data.incomes:[]
      };
      localStorage.setItem(KEY,JSON.stringify(data));
      return true;
    }
  }catch(e){
    console.warn("Supabase load gagal:",e);
  }
  return false;
}

async function loadSharedByPartner(partnerId){
  try{
    const {data:rows,error}=await sb
      .from("kurir_app_state")
      .select("data")
      .contains("data",{partners:[{id:partnerId}]})
      .limit(1);
    if(error)throw error;
    const row=rows?.[0];
    if(row?.data){
      data={
        courier:row.data.courier||null,
        partners:Array.isArray(row.data.partners)?row.data.partners:[],
        customers:Array.isArray(row.data.customers)?row.data.customers:[],
        orders:Array.isArray(row.data.orders)?row.data.orders:[],
        incomes:Array.isArray(row.data.incomes)?row.data.incomes:[]
      };
      localStorage.setItem(KEY,JSON.stringify(data));
      return true;
    }
  }catch(e){
    console.warn("Supabase partner load gagal:",e);
  }
  return false;
}

async function refreshSharedData(){
  const h=location.hash;
  if(loadingSharedData)return;
  loadingSharedData=true;
  try{
    if(h.startsWith("#mitra=")){
      const pid=decodeURIComponent(h.substring(7));
      const ok=await loadSharedByPartner(pid);
      if(ok){
        currentPartnerId=pid;
        render("partnerPublic");
        return;
      }
    }
    if(h.startsWith("#pelanggan=")){
      const cid=decodeURIComponent(h.substring(11));
      const ok=await loadSharedByCourier(cid);
      if(ok){
        render("customerRegister");
        return;
      }
    }
  }finally{
    loadingSharedData=false;
  }
}

/* =========================================================
   DATA
========================================================= */

const KEY="KURIR_SIMPLE_DATA";

const kosong={
  courier:null,
  partners:[],
  customers:[],
  orders:[],
  incomes:[]
};

let data=load();

let currentPartnerId=null;
let currentCustomerId=null;
let currentOrderId=null;
let editingMenuId=null;
let localCustomerId=localStorage.getItem("KURIR_SIMPLE_CUSTOMER_ID")||null;

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(!x)return structuredClone(kosong);

    return{
      courier:x.courier||null,
      partners:Array.isArray(x.partners)?x.partners:[],
      customers:Array.isArray(x.customers)?x.customers:[],
      orders:Array.isArray(x.orders)?x.orders:[],
      incomes:Array.isArray(x.incomes)?x.incomes:[]
    };
  }catch(e){
    return structuredClone(kosong);
  }
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  syncToSupabase();
}

function id(prefix){
  return prefix+"-"+Date.now()+"-"+Math.random()
    .toString(36).substring(2,8);
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function rupiah(v){
  return new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    maximumFractionDigits:0
  }).format(Number(v)||0);
}

function partner(id){
  return data.partners.find(x=>x.id===id);
}

function menu(id){
  const p=partner(currentPartnerId);
  return p?.menus?.find(x=>x.id===id);
}

function order(id){
  return data.orders.find(x=>x.id===id);
}

function toast(text){
  const old=document.querySelector(".toast");
  if(old)old.remove();

  const x=document.createElement("div");
  x.className="toast";
  x.textContent=text;
  document.body.appendChild(x);

  setTimeout(()=>x.remove(),2300);
}

/* =========================================================
   ROUTING
========================================================= */

function go(page){
  render(page);
  window.scrollTo(0,0);
}

function baseURL(){
  return window.location.href.split("#")[0];
}

function partnerLink(id){
  return baseURL()+"#mitra="+encodeURIComponent(id);
}

function customerLink(){
  const courierId=data.courier?.id||"";
  return baseURL()+"#pelanggan="+encodeURIComponent(courierId);
}

async function start(){
  const h=location.hash;

  if(h.startsWith("#mitra=")){
    const id=decodeURIComponent(h.substring(7));
    if(partner(id)){
      currentPartnerId=id;
      render("partnerPublic");
      return;
    }
    const ok=await loadSharedByPartner(id);
    if(ok && partner(id)){
      currentPartnerId=id;
      render("partnerPublic");
      return;
    }
    document.getElementById("app").innerHTML=
      `<div class="page"><div class="empty">
        Mitra Usaha tidak ditemukan.
      </div></div>`;
    return;
  }

  if(h.startsWith("#pelanggan=")){
    const courierId=decodeURIComponent(h.substring(11));
    if(!data.courier || data.courier.id!==courierId){
      await loadSharedByCourier(courierId);
    }
    render("customerRegister");
    return;
  }

  if(h==="#pelanggan"){
    render("customerRegister");
    return;
  }

  if(data.courier){
    render("dashboard");
  }else{
    render("register");
  }
}

/* =========================================================
   LOCATION
========================================================= */

let courierLocation=null;
let customerLocation=null;

/*
  Tidak ada halaman izin lokasi di aplikasi.
  Kode langsung memanggil geolocation.
  Jika Android/browser membutuhkan izin sistem,
  dialog tersebut berasal dari sistem/browser.
*/

function getLocation(callback){
  if(!navigator.geolocation){
    toast("Lokasi tidak tersedia pada browser ini.");
    return;
  }

  if(!window.isSecureContext){
    toast("Buka aplikasi melalui HTTPS agar lokasi dapat digunakan.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos=>{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;

      const address=await reverseGeocode(lat,lon);

      callback({
        lat,
        lon,
        address,
        capturedAt:new Date().toISOString()
      });
    },
    err=>{
      if(err.code===1){
        toast("Izin lokasi ditolak. Izinkan lokasi pada browser.");
      }else if(err.code===2){
        toast("Lokasi perangkat belum tersedia.");
      }else if(err.code===3){
        toast("Pengambilan lokasi terlalu lama. Coba lagi.");
      }else{
        toast("Lokasi belum berhasil diperoleh.");
      }
    },
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
}

async function reverseGeocode(lat,lon){
  try{
    const url=
      "https://nominatim.openstreetmap.org/reverse"+
      "?format=jsonv2"+
      "&lat="+encodeURIComponent(lat)+
      "&lon="+encodeURIComponent(lon)+
      "&zoom=18"+
      "&addressdetails=1";

    const r=await fetch(url,{
      headers:{
        "Accept":"application/json"
      }
    });

    if(!r.ok)throw new Error();

    const d=await r.json();
    const a=d.address||{};

    return{
      province:a.state||a.province||"",
      regency:a.county||a.city||a.town||"",
      district:a.municipality||a.city_district||a.suburb||"",
      village:a.village||a.town||a.suburb||a.neighbourhood||"",
      display:d.display_name||""
    };
  }catch(e){
    return{
      province:"",
      regency:"",
      district:"",
      village:"",
      display:"Alamat lengkap belum tersedia."
    };
  }
}

function addressHTML(a){
  return `
    <div class="address-box">
      <strong>Alamat</strong>
      ${esc(a?.province||"Provinsi belum tersedia")}<br>
      ${esc(a?.regency||"Kabupaten belum tersedia")}<br>
      ${esc(a?.district||"Kecamatan belum tersedia")}<br>
      ${esc(a?.village||"Desa belum tersedia")}
    </div>
  `;
}

/* =========================================================
   COPY
========================================================= */

async function copyLink(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const t=document.createElement("textarea");
      t.value=text;
      t.style.position="fixed";
      t.style.opacity="0";
      document.body.appendChild(t);
      t.focus();
      t.select();
      document.execCommand("copy");
      t.remove();
    }

    toast("Link berhasil disalin ke clipboard.");
  }catch(e){
    toast("Link tidak berhasil disalin.");
  }
}

/* =========================================================
   SHELL
========================================================= */

function shell(title,body,back){
  return `
  <div class="page">
    <div class="header">
      ${back?
      `<button class="back" onclick="go('${back}')">
        ← KEMBALI
      </button>`:""}

      <div class="title">${title}</div>
    </div>

    ${body}
  </div>`;
}

   A1 - DAFTAR KURIR
========================================================= */

function renderRegister(){

    <div class="header">
      <div class="title">DAFTAR AKUN KURIR</div>
    </div>

    <div class="content">

      <div class="field">
        <label class="label">Nama</label>
        <input id="regName" placeholder="Nama">
      </div>

      <div class="field">

               placeholder="Nomor Telepon">
      </div>

      <div class="field">
        <label class="label">Alamat</label>

        <button
          id="courierLocationButton"
          class="btn secondary"
          onclick="shareCourierLocation()">
          BAGIKAN LOKASI
        </button>

        <div id="courierAddress"
             class="hidden"></div>
      </div>

      <button class="btn primary"
        onclick="registerCourier()">
        SELESAI
      </button>

function shareCourierLocation(){
  getLocation(location=>{
    courierLocation=location;

    const btn=document.getElementById(
      "courierLocationButton"
    );

    const box=document.getElementById(
      "courierAddress"
    );

    if(btn)btn.classList.add("hidden");

    if(box){
      box.classList.remove("hidden");
      box.innerHTML=addressHTML(location.address);
    }

    toast("Lokasi berhasil dibagikan.");
  });
}

function registerCourier(){
  const name=document.getElementById("regName").value.trim();
  const phone=document.getElementById("regPhone").value.trim();

  if(!name){
    toast("Nama harus diisi.");
    return;
  }

  if(!/^\d{12}$/.test(phone)){
    toast("Nomor telepon harus 12 digit.");
    return;
  }

  if(!courierLocation){
    toast("Bagikan lokasi terlebih dahulu.");
    return;
  }

  data.courier={
    id:id("KURIR"),
    name,
    phone,
    location:courierLocation
  };

  save();

  courierLocation=null;

  go("dashboard");
}

function renderPartners(){
  const list=data.partners.map(p=>`
    <div class="card clickable"

        ${esc(p.name)}

      </div>

      <div
        class="action-row"
        onclick="event.stopPropagation()">

        <button
          class="btn small ${
            p.status==="open"?"success":"secondary"
          }"
          onclick="setStatus('${p.id}','open')">
          OPEN
        </button>

        <button
          class="btn small ${
            p.status==="closed"?"danger":"secondary"
          }"
          onclick="setStatus('${p.id}','closed')">
          CLOSED
        </button>
      </div>

      <button
        class="btn secondary small"
        onclick="
          event.stopPropagation();
          copyLink(partnerLink('${p.id}'));
        ">
        SALIN LINK MITRA USAHA
      </button>

    </div>

function addVariant(){
  document.getElementById("variants")

    );
}

function saveMenuData(){
  const p=partner(currentPartnerId);

  const name=document.getElementById("menuName")
    .value.trim();

  const price=Number(
    document.getElementById("menuPrice").value
  )||0;

  const selection=document.querySelector(
    'input[name="selection"]:checked'
  )?.value||"none";

  const variantPrice=document.querySelector(
    'input[name="variantPrice"]:checked'
  )?.value||"different";

  if(!name){
    toast("Nama menu harus diisi.");
    return;
  }

  const variants=[];

  document.querySelectorAll(".variant-row")
    .forEach(row=>{
      const n=row.querySelector(".v-name")
        ?.value.trim();

      const pr=Number(
        row.querySelector(".v-price")?.value
      )||0;

      if(n){
        variants.push({
          id:id("VARIAN"),
          name:n,
          price:variantPrice==="same"
            ?price
            :pr
        });
      }
    });

  if(editingMenuId){
    const m=p.menus.find(
      x=>x.id===editingMenuId
    );

    m.name=name;
    m.price=price;
    m.selection=selection;
    m.variantPrice=variantPrice;
    m.variants=variants;
  }else{
    p.menus.push({
      id:id("MENU"),
      name,
      price,
      selection,
      variantPrice,
      variants
    });
  }

  save();

  go("partnerDetail");
}

function deleteCurrentMenu(){
  const p=partner(currentPartnerId);

  if(!confirm("Hapus menu ini?"))return;

  p.menus=p.menus.filter(
    x=>x.id!==editingMenuId
  );

  save();

  editingMenuId=null;

  go("partnerDetail");
}

function customerMenuHTML(m){
  const item=cart[currentPartnerId]?.[m.id]||{
    qty:0,
    variants:{}
  };

  if(m.selection==="none"){
    return `
    <div class="card">

          <div class="item-title">
            ${esc(m.name)}
          </div>

          <div class="price">
            ${rupiah(m.price)}
          </div>

        </div>

        ${quantityHTML(
          m.id,
          item.qty
        )}

      </div>

    </div>`;
  }

  /*
    Varian langsung ditampilkan.
    Tidak perlu menekan tombol TAMBAH VARIAN
    terlebih dahulu.
  */

  return `
  <div class="card">

    <div class="item-title">
      ${esc(m.name)}
    </div>

    <div class="variant-list">

      ${m.variants.map(v=>
        variantCustomerHTML(m,v,item)
      ).join("")}

    </div>

  </div>`;
}

function quantityHTML(menuId,qty){
  return `
    <div class="qty">

      <button
        onclick="changeSimpleQty(
          '${menuId}',-1
        )">
        −
      </button>

      <span class="qty-number"
        id="qty-${menuId}">
        ${qty}
      </span>

      <button
        onclick="changeSimpleQty(
          '${menuId}',1
        )">
        +
      </button>

    </div>
  `;
}

function variantCustomerHTML(m,v,item){
  const q=item.variants?.[v.id]||0;

  return `
  <div class="variant-order">

    <div>
      ${esc(v.name)}
      <span class="price">
        ${rupiah(v.price)}
      </span>
    </div>

    <div class="qty">

      <button
        onclick="
          changeVariantQty(
            '${m.id}',
            '${v.id}',
            -1
          )
        ">
        −
      </button>

      <span class="qty-number">
        ${q}
      </span>

      <button
        onclick="
          changeVariantQty(
            '${m.id}',
            '${v.id}',
            1
          )
        ">
        +
      </button>

    </div>

  </div>`;
}

function changeSimpleQty(menuId,delta){
  if(!cart[currentPartnerId])
    cart[currentPartnerId]={};

  if(!cart[currentPartnerId][menuId]){
    cart[currentPartnerId][menuId]={
      qty:0,
      variants:{}
    };
  }

  const x=cart[currentPartnerId][menuId];

  x.qty=Math.max(0,x.qty+delta);

  renderCustomerPartnerMenu();
}

function changeVariantQty(menuId,variantId,delta){
  if(!cart[currentPartnerId])
    cart[currentPartnerId]={};

  if(!cart[currentPartnerId][menuId]){
    cart[currentPartnerId][menuId]={
      qty:0,
      variants:{}
    };
  }

  const x=cart[currentPartnerId][menuId];

  if(!x.variants)
    x.variants={};

  const q=x.variants[variantId]||0;

  x.variants[variantId]=
    Math.max(0,q+delta);

  renderCustomerPartnerMenu();
}

/* =========================================================
   TOTAL OTOMATIS
========================================================= */

function cartTotal(){
  const p=partner(currentPartnerId);
  if(!p)return 0;

  const c=cart[currentPartnerId]||{};

  let total=0;

  p.menus.forEach(m=>{
    const item=c[m.id];
    if(!item)return;

    if(m.selection==="none"){
      total+=m.price*(item.qty||0);
      return;
    }

    m.variants.forEach(v=>{
      const q=item.variants?.[v.id]||0;
      total+=v.price*q;
    });
  });

  return total;
}

/* =========================================================
   I. SELESAI PESANAN
========================================================= */

async function finishCustomerOrder(){
  const p=partner(currentPartnerId);
  const c=data.customers.find(
    x=>x.id===currentCustomerId
  );

  if(!p||!c)return;

  const items=[];

  p.menus.forEach(m=>{
    const x=cart[currentPartnerId]?.[m.id];
    if(!x)return;

    if(m.selection==="none"){
      if(x.qty>0){
        items.push({
          menuId:m.id,
          menuName:m.name,
          qty:x.qty,
          price:m.price,
          variants:[]
        });
      }
    }else{
      const vars=[];

      m.variants.forEach(v=>{
        const q=x.variants?.[v.id]||0;

        if(q>0){
          vars.push({
            variantId:v.id,
            variantName:v.name,
            qty:q,
            price:v.price
          });
        }
      });

      if(vars.length){
        items.push({
          menuId:m.id,
          menuName:m.name,
          qty:0,
          price:0,
          variants:vars
        });
      }
    }
  });

  if(!items.length){
    toast("Belum ada menu yang dipilih.");
    return;
  }

  /* Ambil lokasi terbaru tepat sebelum pesanan dikirim. */
  getLocation(async latestLocation=>{
    c.location=latestLocation;

    const newOrder={
    id:id("PESANAN"),
    partnerId:p.id,
    partnerName:p.name,
    customerId:c.id,
    customerName:c.name,
    customerPhone:c.phone,
    customerLocation:c.location,
    items,
    subtotal:cartTotal(),
    shipping:0,
    total:cartTotal(),
    stockChecked:false,
    stockResult:null,
    status:"menunggu_pengecekan",
    createdAt:new Date().toISOString()
  };

    data.orders.push(newOrder);

    save();

    currentOrderId=newOrder.id;

    cart[currentPartnerId]={};

    go("customerOrderResult");
  });
}

/* =========================================================
   L. PROSES / BATALKAN
========================================================= */

function processCustomerOrder(){
  const o=order(currentOrderId);
  if(!o)return;

  if(!o.stockResult){
    toast("Hasil pengecekan belum tersedia.");
    return;
  }

  const ada=o.stockResult.filter(x=>x.available);

  if(!ada.length){
    toast("Tidak ada menu yang tersedia.");
    return;
  }

  o.status="diproses";

  /*
    Hanya item ADA yang diteruskan.
  */
  o.items=o.items.filter(item=>{
    const result=o.stockResult.find(
      x=>x.menuId===item.menuId
    );

    return result?.available;
  });

  o.subtotal=calculateOrderSubtotal(o);
  o.total=o.subtotal+o.shipping;

  save();

  render("customerOrderResult");
}

function cancelOrder(){
  const o=order(currentOrderId);
  if(!o)return;

  o.status="dibatalkan";

  save();

  render("customerOrderResult");
}

function calculateOrderSubtotal(o){
  let total=0;

  o.items.forEach(item=>{
    if(item.qty){
      total+=item.qty*item.price;
    }

    item.variants?.forEach(v=>{
      total+=v.qty*v.price;
    });
  });

  return total;
}

function setStock(menuId,available){
  const o=order(currentOrderId);

  if(!o.stockResult)
    o.stockResult=[];

  const old=o.stockResult.find(
    x=>x.menuId===menuId
  );

  if(old){
    old.available=available;
  }else{
    o.stockResult.push({
      menuId,
      available
    });
  }

  render("stockCheck");
}

function sendStockResult(){
  const o=order(currentOrderId);

  if(!o)return;

  if(!o.stockResult ||
     o.stockResult.length!==o.items.length){
    toast("Tentukan ADA atau KOSONG untuk semua menu.");
    return;
  }

  o.status="stok_diperiksa";

  save();

  toast("Hasil pengecekan berhasil dikirim.");

  render("partnerDashboard");
}

  getLocation(location=>{
    editCourierLocationData=location;

    const field=document.querySelector(
      ".field .address-box"
    );

    if(field){
      field.outerHTML=addressHTML(
        location.address

    toast("Lokasi berhasil diperbarui.");
  });
}

function saveCourierEdit(){
  const name=document.getElementById(
    "editName"
  ).value.trim();

  const phone=document.getElementById(
    "editPhone"
  ).value.trim();

  if(!name){
    toast("Nama harus diisi.");
    return;
  }

  if(!/^\d{12}$/.test(phone)){
    toast("Nomor telepon harus 12 digit.");
    return;
  }

  data.courier.name=name;
  data.courier.phone=phone;

  if(editCourierLocationData){
    data.courier.location=
      editCourierLocationData;
  }

  editCourierLocationData=null;

  save();

  go("account");
}

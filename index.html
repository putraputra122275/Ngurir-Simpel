<style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* =========================
   DATA
========================= */
// Konfigurasi Supabase yang diberikan pengguna
const SUPABASE_URL = "https://xkysusfemehvdaqkyzhg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JDmN5TndzBue7Rsmeiphtw_K2MzPcbA";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const KEY="KURIR_SIMPLE_MASTER_V3";
const EMPTY_STATE={courier:null,merchants:[],orders:[],groups:[],customerCodes:[],customers:[]};
/* Pemuatan data lokal + sinkronisasi cloud untuk tabel inti. */
function loadLocalState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return {...EMPTY_STATE};
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))return {...EMPTY_STATE};
    return {...EMPTY_STATE,...parsed,
      courier:parsed.courier&&typeof parsed.courier==="object"?parsed.courier:null,
      merchants:Array.isArray(parsed.merchants)?parsed.merchants:[],
      orders:Array.isArray(parsed.orders)?parsed.orders:[],
      groups:Array.isArray(parsed.groups)?parsed.groups:[],
      customerCodes:Array.isArray(parsed.customerCodes)?parsed.customerCodes:[],
      customers:Array.isArray(parsed.customers)?parsed.customers:[]};
  }catch(err){console.error("KURIR SIMPLE: data lokal tidak dapat dibaca",err);return {...EMPTY_STATE};}
}
const state=loadLocalState();
function persistLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true;}
  catch(err){console.error("KURIR SIMPLE: data lokal gagal disimpan",err);toast("Penyimpanan perangkat gagal. Periksa ruang penyimpanan browser.");return false;}
}
function save(){
  if(!persistLocal())return false;
  if(state.courier) syncCoreDataToSupabase().catch(err=>{
    console.error("KURIR SIMPLE: sinkronisasi Supabase gagal",err);
    showCloudStatus("Data tersimpan di perangkat, tetapi sinkronisasi Supabase gagal: "+(err?.message||"kesalahan tidak diketahui"));
  });
  return true;
}
let cloudSyncBusy=false;
let cloudSyncQueued=false;
function showCloudStatus(message){
  let el=document.getElementById("cloudStatus");
  if(!el){el=document.createElement("div");el.id="cloudStatus";el.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;border-radius:10px;background:#fff4d6;border:1px solid #e4c56a;color:#594500;font-size:12px;box-shadow:0 3px 16px #0002";document.body.appendChild(el)}
  el.textContent=message;
}
async function ensureSupabaseSession(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)throw error;
  if(data.session)return data.session;
  const signed=await supabaseClient.auth.signInAnonymously();
  if(signed.error)throw new Error("Tidak dapat membuat sesi Supabase. Pastikan Anonymous Sign-Ins aktif: "+signed.error.message);
  if(!signed.data?.session)throw new Error("Supabase tidak mengembalikan sesi autentikasi.");
  return signed.data.session;
}
function isUuid(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||""))}
function normalizeCoreIds(){
  // Migrasikan ID lokal lama ke UUID dan perbarui relasi lokal inti.
  // Link lama dengan ID non-UUID mungkin perlu dibagikan ulang.
  const map=new Map();
  const fix=obj=>{if(!obj)return;const old=String(obj.id||"");if(!isUuid(old)){const fresh=id();if(old)map.set(old,fresh);obj.id=fresh;}};
  fix(state.courier);
  state.merchants.forEach(m=>{fix(m);(m.menus||[]).forEach(menu=>{fix(menu);(menu.variants||[]).forEach(fix);});});
  const replace=v=>map.has(String(v))?map.get(String(v)):v;
  state.merchants.forEach(m=>{m.courierId=state.courier?.id||m.courierId;(m.menus||[]).forEach(menu=>(menu.variants||[]).forEach(v=>{}));});
  state.orders.forEach(o=>{if(o.merchantId)o.merchantId=replace(o.merchantId);if(o.courierId)o.courierId=replace(o.courierId);});
  state.customers.forEach(c=>{if(c.courierId)c.courierId=replace(c.courierId);});
  persistLocal();
}
async function restoreCoreDataFromSupabase(session){
  if(state.courier)return false;
  const {data:c,error:cErr}=await supabaseClient.from("couriers").select("*").eq("auth_user_id",session.user.id).maybeSingle();
  if(cErr)throw new Error("Membaca akun Kurir: "+cErr.message);
  if(!c)return false;
  const {data:merchantRows,error:mErr}=await supabaseClient.from("merchants").select("*").eq("courier_id",c.id);
  if(mErr)throw new Error("Membaca Mitra Usaha: "+mErr.message);
  const mids=(merchantRows||[]).map(m=>m.id);
  let menuRows=[];
  if(mids.length){const {data,error}=await supabaseClient.from("menus").select("*").in("merchant_id",mids);if(error)throw new Error("Membaca Menu: "+error.message);menuRows=data||[];}
  const menuIds=menuRows.map(m=>m.id);let variantRows=[];
  if(menuIds.length){const {data,error}=await supabaseClient.from("menu_variants").select("*").in("menu_id",menuIds);if(error)throw new Error("Membaca Varian: "+error.message);variantRows=data||[];}
  const location={lat:c.latitude,lng:c.longitude,province:c.province,regency:c.regency,district:c.district,village:c.village,hamlet:c.hamlet};
  state.courier={id:c.id,name:c.full_name,phone:c.whatsapp,location,authUserId:c.auth_user_id};
  state.merchants=(merchantRows||[]).map(m=>({id:m.id,courierId:m.courier_id,name:m.merchant_name,phone:m.whatsapp,status:m.business_status||"CLOSED",menus:menuRows.filter(x=>x.merchant_id===m.id).map(menu=>({id:menu.id,name:menu.menu_name,price:Number(menu.base_price||0),status:menu.availability||"TERSEDIA",choiceMode:menu.variant_selection||"single",priceMode:menu.variant_price_mode||"same",variants:variantRows.filter(v=>v.menu_id===menu.id).sort((a,b)=>a.display_order-b.display_order).map(v=>({id:v.id,name:v.variant_name,price:Number(v.price||0)}))}))}));
  persistLocal();return true;
}
async function syncCoreDataToSupabase(){
  if(!state.courier)return;
  if(cloudSyncBusy){cloudSyncQueued=true;return;}
  cloudSyncBusy=true;
  try{
    const session=await ensureSupabaseSession();
    normalizeCoreIds();
    const c=state.courier,loc=c.location||{};
    const courierRow={id:c.id,auth_user_id:session.user.id,full_name:c.name,whatsapp:c.phone,
      province:loc.province||null,regency:loc.regency||null,district:loc.district||null,village:loc.village||null,hamlet:loc.hamlet||null,
      latitude:Number.isFinite(Number(loc.lat))&&loc.lat!==null?Number(loc.lat):null,
      longitude:Number.isFinite(Number(loc.lng))&&loc.lng!==null?Number(loc.lng):null,
      account_status:"active",updated_at:new Date().toISOString()};
    const {error:cError}=await supabaseClient.from("couriers").upsert(courierRow,{onConflict:"id"});
    if(cError)throw new Error("Tabel couriers: "+cError.message);
    for(const m of state.merchants){
      const merchantRow={id:m.id,courier_id:c.id,merchant_name:m.name,whatsapp:m.phone,business_status:m.status||"CLOSED",updated_at:new Date().toISOString()};
      const {error}=await supabaseClient.from("merchants").upsert(merchantRow,{onConflict:"id"});
      if(error)throw new Error("Tabel merchants: "+error.message);
      for(const menu of (m.menus||[])){
        const basePrice=Number(menu.price||0);
        const {error:menuError}=await supabaseClient.from("menus").upsert({id:menu.id,merchant_id:m.id,menu_name:menu.name,base_price:basePrice,availability:menu.status||"TERSEDIA",has_variants:!!(menu.variants||[]).length,variant_selection:menu.choiceMode||"single",variant_price_mode:menu.priceMode||"same",updated_at:new Date().toISOString()},{onConflict:"id"});
        if(menuError)throw new Error("Tabel menus: "+menuError.message);
        for(let i=0;i<(menu.variants||[]).length;i++){
          const v=menu.variants[i];
          const price=menu.priceMode==="different"?Number(v.price||0):basePrice;
          const {error:variantError}=await supabaseClient.from("menu_variants").upsert({id:v.id,menu_id:menu.id,variant_name:v.name,price,display_order:i},{onConflict:"id"});
          if(variantError)throw new Error("Tabel menu_variants: "+variantError.message);
        }
      }
    }
    persistLocal();
    const el=document.getElementById("cloudStatus");if(el)el.remove();
  }finally{
    cloudSyncBusy=false;
    if(cloudSyncQueued){cloudSyncQueued=false;queueMicrotask(()=>syncCoreDataToSupabase().catch(err=>showCloudStatus("Sinkronisasi Supabase gagal: "+err.message)));}
  }
}

function id(prefix="id"){
  // Supabase memakai UUID untuk primary key. Prefix lama tetap diterima agar
  // pemanggil tidak perlu diubah; nilai ID baru sekarang UUID valid.
  if(window.crypto&&typeof crypto.randomUUID==="function")return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)})
}
function money(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))
}
function nowText(){
  return new Date().toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})
}
function currentCourier(){
  return state.courier;
}
function merchantById(mid){return state.merchants.find(m=>m.id===mid)}
function orderById(oid){return state.orders.find(o=>o.id===oid)}
function toast(msg){
  const old=document.querySelector(".toast"); if(old)old.remove();
  const d=document.createElement("div");d.className="toast";d.textContent=msg;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2200)
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("Link berhasil disalin")).catch(()=>fallbackCopy(text))
  }else fallbackCopy(text)
}
function fallbackCopy(text){
  const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();
  try{document.execCommand("copy");toast("Link berhasil disalin")}catch(e){toast("Link: "+text)}
  t.remove()
}
/*
   LINK PUBLIK UNIVERSAL
   Isi APP_PUBLIC_URL jika aplikasi ditempatkan pada alamat web tertentu.
   Contoh: https://contoh-domain-anda.com/
   Jika dikosongkan, alamat halaman yang sedang dibuka akan dipakai.
*/
const APP_PUBLIC_URL = "";
function publicBaseUrl(){
  if(APP_PUBLIC_URL.trim()) return APP_PUBLIC_URL.trim().replace(/[?#]+$/g, "");
  // file:// saat dijalankan dari Acode: pertahankan alamat file lokal untuk pengujian di HP yang sama.
  // http(s):// saat di-hosting: gunakan URL publik, termasuk subfolder GitHub Pages.
  if(window.location.protocol === "file:"){
    return window.location.href.split("?")[0].split("#")[0];
  }
  return window.location.origin + window.location.pathname;
}
function appLink(params){
  const base=publicBaseUrl();
  const u=new URL(base,window.location.href);
  u.hash="";
  Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  return u.toString();
}
function courierCustomerLink(){return appLink({pelanggan:state.courier.id})}
function merchantLink(mid){
  const m=merchantById(mid);
  // Link khusus pemilik mitra untuk mengelola menu usaha miliknya.
  return appLink({kelola:mid,kurir:m?.courierId||state.courier?.id||""})
}
function setPendingMerchant(mid){localStorage.setItem("KURIR_SIMPLE_PENDING_MERCHANT",mid)}
function getPendingMerchant(){return localStorage.getItem("KURIR_SIMPLE_PENDING_MERCHANT")}
function clearPendingMerchant(){localStorage.removeItem("KURIR_SIMPLE_PENDING_MERCHANT")}
function setPendingCourier(cid){if(cid)localStorage.setItem("KURIR_SIMPLE_PENDING_COURIER",cid);else localStorage.removeItem("KURIR_SIMPLE_PENDING_COURIER")}
function getPendingCourier(){return localStorage.getItem("KURIR_SIMPLE_PENDING_COURIER")}
function formatDate(d){return d||nowText()}

/* =========================
   SCREEN HELPERS
========================= */
function screen(title,body,back=true){
  return `<div class="screen">
    <div class="header">${back?`<button class="back" onclick="goBack()">← KEMBALI</button>`:"<span style='width:72px'></span>"}
      <div class="title">${esc(title)}</div><span style="width:72px"></span>
    </div>${body}</div>`
}
let historyStack=[];
let currentPage="";

function render(html,push=true){
  if(push&&currentPage)historyStack.push(currentPage);
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0)
}
function goBack(){
  // Koreksi navigasi yang diminta:
  // Daftar mitra -> dashboard utama kurir.
  if(currentPage==="merchants"){
    historyStack=[];
    openDashboard(false);
    return;
  }
  // Daftar menu mitra -> daftar mitra usaha.
  if(currentPage.startsWith("menus:")){
    historyStack=[];
    openMerchants(false);
    return;
  }
  // Pesanan yang diterima kurir -> dashboard utama kurir.
  if(currentPage==="orders"){
    historyStack=[];
    openDashboard(false);
    return;
  }
  // Link publik pelanggan/mitra tidak boleh menuju dashboard kurir.
  const params=new URLSearchParams(window.location.search||"");
  if(params.has("pelanggan")||params.has("mitra")||params.has("kelola")||
     currentPage==="publicCustomer"||currentPage.startsWith("publicMerchant:")||
     currentPage.startsWith("customerHome:")||currentPage.startsWith("customerCart:")||
     currentPage.startsWith("customerRegister:")||currentPage.startsWith("survey:")){
    const p=historyStack.pop();
    if(p){openPage(p,false);return;}
    return;
  }
  const p=historyStack.pop();
  if(p){openPage(p,false);return;}
  openDashboard(false)
}
function openPage(page,push=true){
  currentPage=page;
  if(page==="dashboard")return openDashboard(push);
  if(page==="merchants")return openMerchants(push);
  if(page==="addMerchant")return openAddMerchant(push);
  if(page.startsWith("menus:"))return openMenus(page.split(":")[1],push);
  if(page.startsWith("addMenu:"))return openAddMenu(page.split(":")[1],push);
  if(page.startsWith("editMenu:"))return openEditMenu(page.split(":")[1],push);
  if(page==="orders")return openOrders(push);
  if(page.startsWith("location:"))return openLocation(page.split(":")[1],push);
  if(page.startsWith("orderDetail:"))return openOrderDetail(page.split(":")[1],push);
  if(page==="group")return openGroup(push);
  if(page.startsWith("groupDetail:"))return openGroupDetail(page.split(":")[1],push);
  if(page.startsWith("sharePartners:"))return openSharePartners(page.split(":")[1],push);
  if(page.startsWith("shareDetail:"))return openShareDetail(page.split(":")[1],push);
  if(page==="customerCode")return openCustomerCode(push);
  if(page.startsWith("customerHome:"))return openCustomerHome(page.split(":")[1],push);
  if(page.startsWith("customerCart:"))return openCustomerCart(page.split(":")[1],push);
  if(page.startsWith("survey:"))return openSurvey(page.split(":")[1],push);
  if(page==="publicCustomer")return openCustomerLogin(push);
  if(page.startsWith("publicMerchant:"))return openPublicMerchant(page.split(":")[1],push);
  if(page.startsWith("customerRegister:"))return openCustomerRegister(page.split(":")[1],push);
}
function begin(page){historyStack=[];openPage(page,false)}
function ensureCourier(){
  if(!state.courier){begin("register");return false}
  return true
}

function openRegister(){
  currentPage="register";
  render(`<div class="screen">
    <div class="home-title">DAFTAR KURIR</div>
    <div class="card">
      <label>Nama Kurir</label><input id="regName" placeholder="Masukkan nama lengkap">
      <label>Nomor WhatsApp (12 digit)</label><input id="regPhone" inputmode="numeric" maxlength="12" placeholder="12 digit nomor WhatsApp">
      <button class="btn" onclick="shareCourierLocation()">BAGIKAN LOKASI</button>
      <div id="courierLocation" class="variant-box muted">Alamat akan muncul setelah lokasi dibagikan.</div>
      <div class="muted" style="font-size:12px;line-height:1.5;margin-top:10px">Catatan: versi HTML ini masih menyimpan data di browser/perangkat ini. Data belum otomatis tersinkron ke perangkat lain.</div>
      <button class="btn success" onclick="saveCourier()">SELESAI</button>
    </div>
  </div>`,false)
}
let courierLocationDraft=null;
function shareCourierLocation(){
  if(!navigator.geolocation){toast("Perangkat tidak mendukung lokasi");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    courierLocationDraft={lat:pos.coords.latitude,lng:pos.coords.longitude,updatedAt:nowText()};
    const el=document.getElementById("courierLocation");if(el)el.textContent=`Lokasi berhasil diambil: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
    toast("Lokasi berhasil dibagikan")
  },()=>toast("Izin lokasi belum diberikan"),{enableHighAccuracy:true,timeout:10000})
}
function saveCourier(){
  const name=document.getElementById("regName").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  if(!name||!/^\d{12}$/.test(phone)){toast("Isi nama dan nomor WhatsApp tepat 12 digit");return}
  if(!courierLocationDraft&& !state.courier?.location){toast("Bagikan lokasi terlebih dahulu");return}
  state.courier=state.courier||{id:id("kurir"),name:"",phone:""};
  state.courier.name=name;state.courier.phone=phone;state.courier.location=courierLocationDraft||state.courier.location;
  if(!save())return;
  toast("Akun tersimpan di perangkat ini; sinkronisasi Supabase sedang dicoba");begin("dashboard")
}

function openMerchants(push=true){

    <div class="card merchant-card ${m.status==='OPEN'?'':'closed'}" onclick="openPage('menus:${m.id}')">

        <button class="btn small ${m.status==='CLOSED'?'danger':''}" onclick="setMerchantStatus('${m.id}','CLOSED')">CLOSED</button>
      </div>
      <button class="btn outline link-btn" onclick="event.stopPropagation();copyText(merchantLink('${m.id}'))">SALIN LINK</button>

  `),push)
}
function setMerchantStatus(mid,status){
  const m=merchantById(mid);if(!m)return;
  m.status=status;save();openMerchants(false)
}
async function deleteMerchant(mid){
  const m=merchantById(mid);if(!m)return;
  if(!confirm(`Hapus mitra usaha "${m.name}" beserta menu dan variannya?`))return;
  try{
    const {error}=await supabaseClient.rpc("delete_courier_merchant",{p_merchant_id:mid});
    if(error)throw error;
    state.merchants=state.merchants.filter(x=>x.id!==mid);
    state.orders=state.orders.map(o=>({...o,merchants:(o.merchants||[]).filter(x=>x.merchantId!==mid)}));
    persistLocal();toast("Mitra usaha berhasil dihapus");openMerchants(false);
  }catch(err){console.error(err);toast("Mitra belum dihapus dari Supabase: "+(err.message||"periksa SQL dan akses"));}
}
function openAddMerchant(push=true){
  currentPage="addMerchant";
  render(screen("TAMBAH MITRA USAHA",`
    <div class="card">
      <label>Nama Mitra Usaha</label><input id="mName">
      <label>Nomor WhatsApp</label><input id="mPhone" inputmode="numeric" maxlength="12" placeholder="12 digit nomor WhatsApp">
      <button class="btn" onclick="saveMerchant()">SIMPAN</button>
    </div>
  `),push)
}
function saveMerchant(){
  const name=document.getElementById("mName").value.trim();
  const phone=document.getElementById("mPhone").value.trim();
  if(!name||!/^\d{12}$/.test(phone)){toast("Isi nama dan nomor WhatsApp tepat 12 digit");return}
  state.merchants.push({
    id:id("mitra"),courierId:state.courier.id,name,phone,status:"CLOSED",menus:[]
  });
  save();toast("Mitra berhasil ditambahkan");
  // Setelah SIMPAN, daftar mitra menjadi halaman tujuan utama;

  historyStack=[];
  openMerchants(false)
}

function menuDisplayPrice(menu){
  if(menu.priceMode==="different"){
    const p=(menu.variants||[])[0]?.price;
    return p!=null&&p!==""?money(p):"Harga varian";
  }
  return money(menu.price)
}
function openMenus(mid,push=true){
  const m=merchantById(mid);if(!m){toast("Mitra tidak ditemukan");return}
  currentPage="menus:"+mid;
  const list=(m.menus||[]).map(menu=>`
    <div class="card menu-card">
      <div class="menu-name">${esc(menu.name)}</div>
      <div class="price">${menuDisplayPrice(menu)}</div>
      <div style="margin-top:7px"><span class="status ${menu.status==='HABIS'?'closed':'open'}">${esc(menu.status||'TERSEDIA')}</span></div>

function deleteMenu(mid,menuId){
  const m=merchantById(mid);if(!m)return;
  m.menus=m.menus.filter(x=>x.id!==menuId);save();openMenus(mid,false)
}

/* =========================
   MENU FORM / VARIANT RULES
========================= */
function newMenuDraft(){
  return {name:"",price:"",choiceMode:"single",priceMode:"same",status:"TERSEDIA",variants:[]}
}
const drafts={};

function openAddMenu(mid,push=true){
  drafts.add=newMenuDraft();drafts.add.mid=mid;
  currentPage="addMenu:"+mid;
  renderAddMenu(mid,false,push)
}
function renderAddMenu(mid,showSettings,push=true){
  const d=drafts.add||newMenuDraft();
  const priceVisible=d.priceMode==="same";
  const variants=d.variants||[];
  let variantHtml="";
  if(showSettings){
    variantHtml=variants.map((v,i)=>`
      <div class="variant-box">
        <div class="variant-head">Varian ${i+1}</div>
        <label>Nama Varian</label>
        <input class="add-v-name" data-index="${i}" value="${esc(v.name)}">
        ${d.priceMode==="different"?`
          <label>Harga</label>
          <input class="add-v-price" data-index="${i}" inputmode="numeric" value="${esc(v.price)}">
        `:""}
      </div>`).join("");
  }
  render(screen("TAMBAH MENU",`
    <div class="card">
      <label>Nama Menu</label><input id="addMenuName" value="${esc(d.name)}" oninput="drafts.add.name=this.value">
      ${priceVisible?`<label>Harga</label><input id="addMenuPrice" value="${esc(d.price)}" inputmode="numeric" oninput="drafts.add.price=this.value">`:""}
      ${showSettings?`
        <div class="setting-box">
          <div class="setting-title">PENGATURAN VARIAN</div>
          <div class="radio-line"><input type="radio" name="addChoice" ${d.choiceMode==="single"?"checked":""} onchange="setAddChoice('single')"><span>Hanya pilih satu</span></div>
          <div class="radio-line"><input type="radio" name="addChoice" ${d.choiceMode==="multiple"?"checked":""} onchange="setAddChoice('multiple')"><span>Bisa pilih lebih dari satu</span></div>
          <hr>
          <div class="setting-title">Harga Varian</div>
          <div class="radio-line"><input type="radio" name="addPriceMode" ${d.priceMode==="different"?"checked":""} onchange="setAddPriceMode('different')"><span>Harga tiap varian berbeda</span></div>
          <div class="radio-line"><input type="radio" name="addPriceMode" ${d.priceMode==="same"?"checked":""} onchange="setAddPriceMode('same')"><span>Harga tiap varian sama</span></div>
        </div>
        ${variantHtml}
        <button class="btn secondary" onclick="addVariant('add')">TAMBAH VARIAN</button>
      `:`<button class="btn secondary" onclick="showAddVariantSettings()">TAMBAH VARIAN</button>`}
      <button class="btn" onclick="saveNewMenu('${mid}')">SIMPAN</button>
    </div>
  `),push)
}
function showAddVariantSettings(){
  const d=drafts.add;
  d.name=document.getElementById("addMenuName").value.trim();
  const p=document.getElementById("addMenuPrice");if(p)d.price=p.value;
  renderAddMenu(d.mid,true,false)
}
function setAddChoice(v){drafts.add.choiceMode=v;syncAddDraft();renderAddMenu(drafts.add.mid,true,false)}
function setAddPriceMode(v){
  syncAddDraft();drafts.add.priceMode=v;
  if(v==="same"){
    drafts.add.variants.forEach(x=>x.price="")
  }
  renderAddMenu(drafts.add.mid,true,false)
}
function syncAddDraft(){
  const d=drafts.add;
  const n=document.getElementById("addMenuName");if(n)d.name=n.value.trim();
  const p=document.getElementById("addMenuPrice");if(p)d.price=p.value.trim();
  document.querySelectorAll(".add-v-name").forEach(x=>d.variants[Number(x.dataset.index)].name=x.value);
  document.querySelectorAll(".add-v-price").forEach(x=>d.variants[Number(x.dataset.index)].price=x.value);
}
function addVariant(type){
  if(type==="add"){
    syncAddDraft();drafts.add.variants.push({name:"",price:""});
    renderAddMenu(drafts.add.mid,true,false)
  }else{
    syncEditDraft();
    drafts.edit.variants.push({name:"",price:""});
    renderEditMenu(drafts.edit.mid,drafts.edit.menuId,false)
  }
}
function saveNewMenu(mid){
  syncAddDraft();const d=drafts.add;
  if(!d.name){toast("Nama Menu wajib diisi");return}
  if(d.priceMode==="same"&&!d.price){toast("Harga wajib diisi");return}
  if(d.variants.length){
    if(d.variants.some(v=>!v.name)){toast("Nama varian wajib diisi");return}
    if(d.priceMode==="different"&&d.variants.some(v=>!v.price)){toast("Harga setiap varian wajib diisi");return}
  }
  const m=merchantById(mid);if(!m)return;
  m.menus.push({
    id:id("menu"),name:d.name,price:d.price,choiceMode:d.choiceMode,
    priceMode:d.priceMode,status:d.status||"TERSEDIA",variants:d.variants.map(v=>({name:v.name,price:d.priceMode==="different"?v.price:""}))
  });
  save();delete drafts.add;toast("Menu berhasil disimpan");openMenus(mid,false)
}

/* =========================
   EDIT MENU
========================= */
function openEditMenu(menuId,push=true){
  let found=null;
  for(const m of state.merchants){
    const menu=(m.menus||[]).find(x=>x.id===menuId);
    if(menu){found={m,menu};break}
  }
  if(!found){toast("Menu tidak ditemukan");return}
  drafts.edit={
    mid:found.m.id,menuId,
    name:found.menu.name,price:found.menu.price||"",
    choiceMode:found.menu.choiceMode||"single",
    priceMode:found.menu.priceMode||"same",
    status:found.menu.status||"TERSEDIA",
    variants:(found.menu.variants||[]).map(v=>({name:v.name||"",price:v.price||""}))
  };
  currentPage="editMenu:"+menuId;
  renderEditMenu(found.m.id,menuId,push)
}
function renderEditMenu(mid,menuId,push=true){
  const d=drafts.edit;
  const variantHtml=d.variants.map((v,i)=>`
    <div class="variant-box">
      <div class="variant-head">Varian ${i+1}</div>
      <label>Nama Varian</label>
      <input class="edit-v-name" data-index="${i}" value="${esc(v.name)}">
      ${d.priceMode==="different"?`
        <label>Harga</label>
        <input class="edit-v-price" data-index="${i}" inputmode="numeric" value="${esc(v.price)}">
      `:""}
    </div>`).join("");
  render(screen("EDIT MENU",`
    <div class="card">
      <label>Nama Menu</label><input id="editMenuName" value="${esc(d.name)}">
      ${d.priceMode==="same"?`<label>Harga</label><input id="editMenuPrice" inputmode="numeric" value="${esc(d.price)}">`:""}
      <div class="setting-box">
        <div class="setting-title">PENGATURAN VARIAN</div>
        ${variantHtml||`<div class="muted">Belum ada varian.</div>`}
        <button class="btn secondary" onclick="addVariant('edit')">TAMBAH VARIAN</button>
        <hr>
        <div class="setting-title">Pengaturan Pilihan</div>
        <div class="radio-line"><input type="radio" name="editChoice" ${d.choiceMode==="single"?"checked":""} onchange="setEditChoice('single')"><span>Hanya pilih satu</span></div>
        <div class="radio-line"><input type="radio" name="editChoice" ${d.choiceMode==="multiple"?"checked":""} onchange="setEditChoice('multiple')"><span>Bisa pilih lebih dari satu</span></div>
        <hr>
        <div class="setting-title">Harga Varian</div>
        <div class="radio-line"><input type="radio" name="editPriceMode" ${d.priceMode==="different"?"checked":""} onchange="setEditPriceMode('different')"><span>Harga tiap varian berbeda</span></div>
        <div class="radio-line"><input type="radio" name="editPriceMode" ${d.priceMode==="same"?"checked":""} onchange="setEditPriceMode('same')"><span>Harga tiap varian sama</span></div>
      </div>
      <label>Status Menu</label>
      <select id="editMenuStatus" onchange="drafts.edit.status=this.value" style="width:100%;padding:12px;border:1px solid #d3ddea;border-radius:11px;background:#fff;color:var(--text)">
        <option value="TERSEDIA" ${d.status!=="HABIS"?"selected":""}>TERSEDIA</option>
        <option value="HABIS" ${d.status==="HABIS"?"selected":""}>HABIS</option>
      </select>
      <button class="btn" onclick="saveEditedMenu('${mid}','${menuId}')">SIMPAN</button>
    </div>
  `),push)
}
function syncEditDraft(){
  const d=drafts.edit;if(!d)return;
  const n=document.getElementById("editMenuName");if(n)d.name=n.value.trim();
  const p=document.getElementById("editMenuPrice");if(p)d.price=p.value.trim();
  const st=document.getElementById("editMenuStatus");if(st)d.status=st.value;
  document.querySelectorAll(".edit-v-name").forEach(x=>d.variants[Number(x.dataset.index)].name=x.value);
  document.querySelectorAll(".edit-v-price").forEach(x=>d.variants[Number(x.dataset.index)].price=x.value);
}
function setEditChoice(v){syncEditDraft();drafts.edit.choiceMode=v;renderEditMenu(drafts.edit.mid,drafts.edit.menuId,false)}
function setEditPriceMode(v){
  syncEditDraft();drafts.edit.priceMode=v;
  if(v==="same")drafts.edit.variants.forEach(x=>x.price="");
  renderEditMenu(drafts.edit.mid,drafts.edit.menuId,false)
}
function saveEditedMenu(mid,menuId){
  syncEditDraft();const d=drafts.edit,m=merchantById(mid);
  const menu=m?.menus.find(x=>x.id===menuId);
  if(!menu)return;
  if(!d.name){toast("Nama Menu wajib diisi");return}
  if(d.priceMode==="same"&&!d.price){toast("Harga wajib diisi");return}
  if(d.variants.some(v=>!v.name)){toast("Nama varian wajib diisi");return}
  if(d.priceMode==="different"&&d.variants.some(v=>!v.price)){toast("Harga setiap varian wajib diisi");return}
  menu.name=d.name;menu.price=d.price;menu.choiceMode=d.choiceMode;menu.priceMode=d.priceMode;menu.status=d.status||"TERSEDIA";
  menu.variants=d.variants.map(v=>({name:v.name,price:d.priceMode==="different"?v.price:""}));
  save();delete drafts.edit;toast("Menu berhasil diperbarui");openMenus(mid,false)
}

async function deleteCustomerCode(codeId,code){
  if(!confirm(`Hapus kode pelanggan ${code}? Kode yang sudah digunakan tidak bisa dihapus.`))return;
  try{
    const {data,error}=await supabaseClient.rpc("delete_unused_customer_code",{p_code_id:codeId});
    if(error)throw error;
    if(data!==true && data?.deleted!==true)throw new Error(data?.message||"Kode tidak dapat dihapus");
    state.customerCodes=state.customerCodes.filter(c=>c.id!==codeId);
    persistLocal();toast("Kode pelanggan berhasil dihapus");openCustomerCode(false);
  }catch(err){console.error(err);toast("Kode belum dihapus: "+(err.message||"periksa SQL dan akses"));}
}
async function createCustomerCode(){
  if(!state.courier?.id){toast("Akun Kurir belum siap");return}
  try{
    // Kode dibuat di Supabase supaya dapat dipakai dari HP pelanggan lain.
    const {data,error}=await supabaseClient.rpc("create_customer_code");
    if(error)throw error;
    const row=Array.isArray(data)?data[0]:data;
    if(!row?.code)throw new Error("Supabase tidak mengembalikan kode. Periksa fungsi create_customer_code().");
    const existing=state.customerCodes.find(x=>x.code===String(row.code));
    if(!existing)state.customerCodes.push({id:row.id,courierId:row.courier_id||state.courier.id,customerName:"",code:String(row.code),used:row.status==="used",active:row.status==="available"});
    save();openCustomerCode(false);
  }catch(err){console.error("Gagal membuat kode pelanggan",err);toast("Kode gagal dibuat di Supabase: "+(err.message||"periksa koneksi"));}
}

async function verifyCustomerCode(){
  const input=document.getElementById("customerCodeInput");
  const code=input?.value.trim()||"";
  if(!/^\d{4}$/.test(code)){toast("Kode harus 4 digit");return}
  try{
    // Pemeriksaan dilakukan di server, bukan hanya di localStorage HP ini.
    const {data,error}=await supabaseClient.rpc("validate_customer_code",{p_code:code});
    if(error)throw error;
    const row=Array.isArray(data)?data[0]:data;
    if(!row||row.valid!==true||!row.courier_id){toast(row?.message||"Kode tidak valid atau sudah digunakan");return}
    const courierId=row.courier_id;
    const pending=getPendingMerchant();
    const merchant=pending?merchantById(pending):null;
    const pendingCourier=getPendingCourier();
    if(pendingCourier&&pendingCourier!==courierId){setPendingCourier(null);toast("Kode pelanggan tidak sesuai dengan link kurir ini");return}
    if(merchant&&merchant.courierId!==courierId){clearPendingMerchant();toast("Link mitra bukan milik kode pelanggan ini");return}
    setPendingCourier(null);
    // Belum menandai kode terpakai di tahap ini. Penandaan dilakukan atomik
    // saat data nama, WhatsApp, dan lokasi berhasil disimpan.
    let customer=state.customers.find(x=>x.code===code&&x.courierId===courierId);
    if(!customer){customer={id:id("cust"),courierId,name:"",phone:"",code,codeId:row.code_id||null,location:null,registered:true,firstOrderDone:false};state.customers.push(customer)}
    customer.code=code;customer.courierId=courierId;
    persistLocal();localStorage.setItem("KURIR_SIMPLE_CURRENT_CUSTOMER",customer.id);
    openCustomerRegister(customer.id,true);
  }catch(err){console.error("Verifikasi kode pelanggan gagal",err);toast("Tidak dapat memeriksa kode di Supabase: "+(err.message||"periksa koneksi"));}
}

  navigator.geolocation.getCurrentPosition(pos=>{

async function finishCustomerRegistration(cid){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  if(!c.location){toast("Bagikan lokasi terlebih dahulu");return}
  const name=document.getElementById("custName").value.trim();
  const phone=document.getElementById("custPhone").value.trim();
  if(!name||!/\d{12}/.test(phone)||phone.length!==12){toast("Isi nama dan nomor WhatsApp tepat 12 digit");return}
  if(!c.code){toast("Kode pelanggan tidak ditemukan. Masukkan kode kembali.");return}
  try{
    // RPC server memasukkan pelanggan dan mengubah kode menjadi used dalam
    // satu transaksi; kode tidak dapat dipakai ulang di perangkat lain.
    const {data,error}=await supabaseClient.rpc("register_customer_with_code",{
      p_code:c.code,p_full_name:name,p_whatsapp:phone,
      p_latitude:Number(c.location.lat),p_longitude:Number(c.location.lng)
    });

const carts={};
// Katalog pelanggan dimuat dari Supabase melalui RPC publik yang hanya
// mengembalikan informasi katalog (nama/status mitra dan menu), bukan nomor WA.
const publicCatalogCache = new Map();
const publicCatalogLoading = new Set();
const publicCatalogErrors = new Map();
async function loadPublicCatalogForCourier(courierId, customerId){
  if(!courierId || publicCatalogLoading.has(courierId)) return;
  publicCatalogLoading.add(courierId);
  publicCatalogErrors.delete(courierId);
  try{
    const {data,error}=await supabaseClient.rpc('public_customer_catalog',{p_courier_id:courierId});
    if(error) throw new Error(error.message);
    const rows=Array.isArray(data)?data:(data?.merchants||[]);
    const catalog=rows.map(m=>({
      id:m.id, courierId:m.courier_id||courierId, name:m.merchant_name||m.name||'',
      // Data pelanggan hanya membutuhkan status OPEN/CLOSED dan menu.
      status:String(m.business_status||m.status||'CLOSED').toUpperCase(),
      menus:(m.menus||[]).map(menu=>({
        id:menu.id, name:menu.menu_name||menu.name||'', price:Number(menu.base_price??menu.price??0),
        status:String(menu.availability||menu.status||'TERSEDIA').toUpperCase(),
        choiceMode:menu.variant_selection||menu.choiceMode||'single',
        priceMode:menu.variant_price_mode||menu.priceMode||'same',
        variants:(menu.variants||[]).map(v=>({id:v.id,name:v.variant_name||v.name||'',price:Number(v.price||0)}))
      }))
    }));
    publicCatalogCache.set(courierId,catalog);
    // Sinkronkan katalog cloud ke tampilan lokal tanpa mengubah data mitra
    // milik kurir lain atau menimpa data inti lokal yang sedang dikelola Kurir.
    state.merchants=state.merchants.filter(m=>m.courierId!==courierId).concat(catalog);
    persistLocal();
  }catch(err){
    console.error('KURIR SIMPLE: gagal memuat katalog pelanggan dari Supabase',err);
    publicCatalogErrors.set(courierId,err?.message||'Kesalahan tidak diketahui');
  }finally{
    publicCatalogLoading.delete(courierId);
    const c=state.customers.find(x=>x.id===customerId);
    if(c && currentPage==='customerHome:'+customerId) openCustomerHome(customerId,false,true);
  }
}
function getCart(cid){
  if(!carts[cid])carts[cid]={};
  return carts[cid]
}
function cartForMerchant(cid,mid){
  const cart=getCart(cid);
  if(!cart[mid])cart[mid]=[];
  return cart[mid]
}
function findCartItem(cid,mid,menuId,variantName){
  return cartForMerchant(cid,mid).find(i=>i.menuId===menuId&&i.variantName===variantName)
}
function cartMerchantHas(cid,mid){
  return cartForMerchant(cid,mid).length>0
}
function openCustomerHome(cid,push=true,skipFetch=false){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  currentPage="customerHome:"+cid;
  const cached=publicCatalogCache.get(c.courierId);
  const localMerchants=state.merchants.filter(m=>m.courierId===c.courierId);

    // Tampilkan indikator saat katalog dimuat; jangan langsung menyimpulkan kosong.
    queueMicrotask(()=>loadPublicCatalogForCourier(c.courierId,cid));

  if(pending&&merchants.some(m=>m.id===pending)){
    window.customerOpenMerchant=pending;

    return `<div class="customer-merchant ${isOpen?"":"closed"}">

        ${cartMerchantHas(cid,m.id)?`<div style="margin-top:6px;color:var(--success);font-weight:800">✓ SUDAH DIPESAN</div>`:""}
      </div>
      ${expanded&&isOpen?renderCustomerMenus(cid,m):""}
    </div>`
  }).join("");
  const hasAny=Object.values(getCart(cid)).some(a=>a.length);
  render(screen("PILIH MITRA USAHA",`
    <div class="card">
      <label>Nama</label><input value="${esc(c.name)}" onchange="saveCustomerProfile('${cid}','name',this.value)" aria-label="Nama pelanggan">
      <label>Nomor WhatsApp</label><input inputmode="numeric" maxlength="12" value="${esc(c.phone||'')}" onchange="saveCustomerProfile('${cid}','phone',this.value)" aria-label="Nomor WhatsApp pelanggan">
      <div class="muted" style="margin-top:5px">${c.location?`Alamat dari lokasi: ${Number(c.location.lat).toFixed(5)}, ${Number(c.location.lng).toFixed(5)}`:"Alamat belum dibagikan"}</div>
      <button class="btn secondary" onclick="shareCustomerLocation('${cid}')">BAGIKAN ULANG LOKASI</button>
    </div>
    ${publicCatalogLoading.has(c.courierId)?`<div class="empty">Memuat mitra usaha...</div>`:
      (publicCatalogErrors.has(c.courierId)?`<div class="card"><div class="empty">Mitra belum dapat dimuat dari server.</div><div class="muted" style="margin-top:8px">${esc(publicCatalogErrors.get(c.courierId))}</div><button class="btn" onclick="retryPublicCatalog('${cid}')">COBA LAGI</button></div>`:
      (cards||`<div class="empty">Belum ada mitra usaha.</div>`))}
    <button class="btn ${hasAny?"":"secondary"}" ${hasAny?"":"disabled"} onclick="openPage('customerCart:${cid}')">LIHAT PESAN</button>
  `),push)
}
function retryPublicCatalog(cid){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  publicCatalogCache.delete(c.courierId);publicCatalogErrors.delete(c.courierId);
  openCustomerHome(cid,false);
}
function saveCustomerProfile(cid,field,value){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  const v=String(value||"").trim();
  if(field==="phone"&&!/^\d{12}$/.test(v)){toast("Nomor WhatsApp harus tepat 12 digit");openCustomerHome(cid,false);return}
  if(!v){toast("Data tidak boleh kosong");openCustomerHome(cid,false);return}
  c[field]=v;save();toast("Data akun diperbarui")
}
function customerOpenMerchant(cid,mid){
  window.customerOpenMerchant=window.customerOpenMerchant===mid?null:mid;
  openCustomerHome(cid,false)
}
function renderCustomerMenus(cid,m){
  const hasMenus=(m.menus||[]).length>0;
  return `<div class="customer-menu-list">
    ${hasMenus?(m.menus||[]).map(menu=>renderCustomerMenu(cid,m,menu)).join(""):`<div class="empty">Belum ada menu.</div>`}
    ${hasMenus?`<button class="btn" onclick="saveMerchantCustomerOrder('${cid}','${m.id}')">SIMPAN</button>`:""}
  </div>`
}
function renderCustomerMenu(cid,m,menu){
  const cart=cartForMerchant(cid,m.id);
  if(menu.status==="HABIS") return `<div class="customer-menu"><div class="menu-main-row"><div class="grow"><div class="menu-name">${esc(menu.name)}</div><div class="price">${menu.priceMode==="different"?"Harga sesuai varian":money(menu.price)}</div></div><span class="status closed">HABIS</span></div></div>`;
  if(menu.choiceMode==="multiple"){
    const rows=(menu.variants||[]).map((v,i)=>{
      const item=cart.find(x=>x.menuId===menu.id&&x.variantName===v.name);
      const q=item?.qty||0;
      const price=menu.priceMode==="different"?Number(v.price||0):Number(menu.price||0);
      return `<div class="variant-option">
        <div class="grow"><b>${esc(v.name)}</b>${price?`<div class="muted">${money(price)}</div>`:""}</div>
        <div class="variant-qty qty">
          <button onclick="changeMultiQty('${cid}','${m.id}','${menu.id}','${esc(v.name)}',-1)">−</button>
          <strong>${q}</strong>
          <button onclick="changeMultiQty('${cid}','${m.id}','${menu.id}','${esc(v.name)}',1)">+</button>
        </div>
      </div>`
    }).join("");
    return `<div class="customer-menu"><div class="menu-main-row"><div class="grow"><div class="menu-name">${esc(menu.name)}</div>${menu.priceMode==="same"?`<div class="price">${money(menu.price)}</div>`:""}</div></div>${rows}</div>`
  }
  const selected=cart.find(x=>x.menuId===menu.id);
  const qty=selected?.qty||0;
  const selectedName=selected?.variantName||"";
  const rows=(menu.variants||[]).map(v=>{
    const price=menu.priceMode==="different"?Number(v.price||0):Number(menu.price||0);
    return `<label class="variant-option">
      <input type="radio" name="single_${menu.id}" ${selectedName===v.name?"checked":""} onchange="selectSingleVariant('${cid}','${m.id}','${menu.id}','${esc(v.name)}')">
      <div class="grow"><b>${esc(v.name)}</b>${menu.priceMode==="different"?`<div class="muted">${money(price)}</div>`:""}</div>
    </label>`
  }).join("");
  return `<div class="customer-menu">
    <div class="menu-main-row">
      <div class="grow"><div class="menu-name">${esc(menu.name)}</div>${menu.priceMode==="same"?`<div class="price">${money(menu.price)}</div>`:""}</div>
      <div class="qty"><button onclick="changeSingleQty('${cid}','${m.id}','${menu.id}',-1)">−</button><strong>${qty}</strong><button onclick="changeSingleQty('${cid}','${m.id}','${menu.id}',1)">+</button></div>
    </div>
    ${rows}
  </div>`
}
function selectSingleVariant(cid,mid,menuId,variantName){
  const cart=cartForMerchant(cid,mid);
  const menu=merchantById(mid).menus.find(x=>x.id===menuId);
  const old=cart.find(x=>x.menuId===menuId);
  const price=menu.priceMode==="different"?Number(menu.variants.find(v=>v.name===variantName)?.price||0):Number(menu.price||0);
  if(old){old.variantName=variantName;old.price=price}
  else cart.push({menuId,menuName:menu.name,variantName,qty:1,price});
  openCustomerHome(cid,false)
}
function changeSingleQty(cid,mid,menuId,delta){
  const cart=cartForMerchant(cid,mid);let item=cart.find(x=>x.menuId===menuId);
  const menu=merchantById(mid).menus.find(x=>x.id===menuId);
  if(!item&&delta>0){
    toast("Pilih varian terlebih dahulu");return
  }
  if(item){
    item.qty+=delta;if(item.qty<=0)cart.splice(cart.indexOf(item),1)
  }
  openCustomerHome(cid,false)
}
function changeMultiQty(cid,mid,menuId,variantName,delta){
  const cart=cartForMerchant(cid,mid);let item=cart.find(x=>x.menuId===menuId&&x.variantName===variantName);
  const menu=merchantById(mid).menus.find(x=>x.id===menuId);
  const v=menu.variants.find(x=>x.name===variantName);
  const price=menu.priceMode==="different"?Number(v?.price||0):Number(menu.price||0);
  if(!item&&delta>0){item={menuId,menuName:menu.name,variantName,qty:0,price};cart.push(item)}
  if(item){
    item.qty+=delta;if(item.qty<=0)cart.splice(cart.indexOf(item),1)
  }
  openCustomerHome(cid,false)
}
function saveMerchantCustomerOrder(cid,mid){
  if(!cartMerchantHas(cid,mid)){toast("Belum ada menu yang dipilih");return}
  window.customerOpenMerchant=null;openCustomerHome(cid,false);toast("Pesanan mitra disimpan")
}

/* =========================
   CUSTOMER CART / SURVEY
========================= */
function openCustomerCart(cid,push=true){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  currentPage="customerCart:"+cid;
  const cart=getCart(cid);
  const mids=Object.keys(cart).filter(mid=>cart[mid].length);
  let total=0;
  const blocks=mids.map(mid=>{
    const m=merchantById(mid);if(!m)return "";
    const items=cart[mid];const sub=items.reduce((a,i)=>a+Number(i.price||0)*i.qty,0);total+=sub;
    return `<div class="cart-merchant"><b>${esc(m.name)}</b>
      ${items.map(i=>`<div class="cart-line"><span>${esc(i.menuName)}${i.variantName?` — ${esc(i.variantName)}`:""} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join("")}
      <div class="order-total">Subtotal: ${money(sub)}</div>
    </div>`
  }).join("");
  render(screen("LIHAT PESAN",`
    ${blocks||`<div class="empty">Belum ada pesanan.</div>`}
    <div class="card">
      <div class="cart-line"><b>TOTAL BELANJA</b><b>${money(total)}</b></div>
      <div class="cart-line"><span>Ongkir</span><span>Rp —</span></div>
      <div class="cart-line"><b>TOTAL PEMBAYARAN</b><b>Rp —</b></div>
      <div class="notice">Total pembayaran akan dihitung setelah ongkir diberikan oleh kurir.</div>
      <button class="btn" onclick="submitOrderDirect('${cid}')">KIRIM PESANAN</button>
    </div>
  `),push)
}
function openSurvey(cid,push=true){
  currentPage="survey:"+cid;
  render(screen("SURVEI",`
    <div class="card">
      <div class="notice">SURVEI WAJIB DILEWATI SEBELUM PESANAN DIKIRIM.</div>
      <p class="muted">Isi survei yang telah ditentukan untuk pesanan ini.</p>
      <div class="card" style="margin:12px 0 0">
        <label>Survei</label>
        <textarea id="surveyAnswer" placeholder="Isi jawaban survei"></textarea>
      </div>
      <button class="btn" onclick="submitSurveyAndOrder('${cid}')">SELESAI SURVEI</button>
    </div>
  `),push)
}
function submitSurveyAndOrder(cid){
  const answer=document.getElementById("surveyAnswer").value.trim();
  if(!answer){toast("Survei wajib diisi");return}
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  const cart=getCart(cid);const mids=Object.keys(cart).filter(mid=>cart[mid].length);
  if(!mids.length){toast("Belum ada pesanan");return}
  /*
    Alur master memiliki ketergantungan ongkir sebelum KIRIM,
    sementara ongkir diisi kurir setelah menerima pesanan.
    Karena itu pesanan disimpan sebagai draft terkirim dengan shipping 0,
    dan kurir mengisi ongkir sebelum SELESAI.
  */
  const merchants=mids.map(mid=>{
    const m=merchantById(mid);
    return {
      merchantId:mid,merchantName:m.name,
      items:cart[mid].map(i=>({menuId:i.menuId,menuName:i.menuName,variantName:i.variantName,qty:i.qty,price:i.price}))
    }
  });
  const o={
    id:id("order"),courierId:c.courierId,customerId:c.id,customerName:c.name,
    customerLocation:c.location,locationText:c.location?`${c.location.lat}, ${c.location.lng}`:"",
    merchants,time:nowText(),shipping:0,completed:false,label:"PESANAN "+String(state.orders.length+1).padStart(2,"0"),
    survey:{completed:true,answer}
  };
  state.orders.push(o);
  c.firstOrderDone=true;
  const code=state.customerCodes.find(x=>x.id===c.codeId);if(code)code.active=true;
  save();
  Object.keys(cart).forEach(k=>delete cart[k]);
  openCustomerSent(cid,false)
}

function submitOrderDirect(cid){
  const c=state.customers.find(x=>x.id===cid);if(!c)return;
  const cart=getCart(cid);const mids=Object.keys(cart).filter(mid=>cart[mid].length);
  if(!mids.length){toast("Belum ada pesanan");return}
  const merchants=mids.map(mid=>{
    const m=merchantById(mid);if(!m)return null;
    return {merchantId:mid,merchantName:m.name,items:cart[mid].map(i=>({menuId:i.menuId,menuName:i.menuName,variantName:i.variantName,qty:i.qty,price:i.price}))}
  }).filter(Boolean);
  const o={id:id("order"),courierId:c.courierId,customerId:c.id,customerName:c.name,customerLocation:c.location,locationText:c.location?`${c.location.lat}, ${c.location.lng}`:"",merchants,time:nowText(),shipping:null,completed:false,label:"PESANAN "+String(state.orders.length+1).padStart(2,"0")};
  state.orders.push(o);c.firstOrderDone=true;
  const code=state.customerCodes.find(x=>x.id===c.codeId);if(code)code.active=true;
  save();Object.keys(cart).forEach(k=>delete cart[k]);openCustomerSent(cid,false)
}

function openCustomerSent(cid,push=true){
  currentPage="customerSent:"+cid;
  render(screen("PESANAN TERKIRIM",`
    <div class="card center">
      <div style="font-size:42px">✓</div>
      <h3>Pesanan berhasil dikirim</h3>
      <p class="muted">Pesanan sudah diteruskan kepada kurir.</p>
      <button class="btn" onclick="openCustomerHome('${cid}')">KEMBALI KE MENU</button>
    </div>
  `),push)
}

/* =========================
   PUBLIC LINKS
========================= */
function openPublicMerchant(mid,push=true){
  // Jangan memeriksa data Mitra sebelum kode dimasukkan. Link Mitra harus lebih dulu
  // menampilkan permintaan kode pelanggan, lalu mengarahkan pelanggan ke Mitra tersebut.
  setPendingMerchant(mid);
  const params=new URLSearchParams(window.location.search||"");
  const courierId=params.get("kurir")||params.get("pelanggan")||"";
  if(courierId)setPendingCourier(courierId);
  const c=customerCurrent();
  if(c&&courierId&&c.courierId===courierId){
    window.customerOpenMerchant=mid;
    clearPendingMerchant();
    return openCustomerHome(c.id,push);
  }
  return openCustomerLogin(push);
}

/* =========================
   ROUTER
========================= */
function route(){
  const params=new URLSearchParams(window.location.search||"");
  const hash=location.hash||"";

  // Link Mitra: selalu minta kode terlebih dahulu untuk pelanggan baru.
  // Format: ?mitra=ID_MITRA&kurir=ID_KURIR
  if(params.has("kelola")){
    const mid=params.get("kelola");
    const m=merchantById(mid);
    if(!m){return render(screen("MITRA USAHA",`<div class="card"><div class="empty">Data mitra tidak tersedia di perangkat ini. Link pengelolaan memerlukan database online bersama.</div></div>`,false),false)}
    window.ownerMerchantId=mid;
    return begin("menus:"+mid);
  }

  if(params.has("mitra")){
    const mid=params.get("mitra");
    setPendingMerchant(mid);
    const courierId=params.get("kurir")||params.get("pelanggan")||"";
    if(courierId)setPendingCourier(courierId);
    const c=customerCurrent();
    if(c&&courierId&&c.courierId===courierId){
      window.customerOpenMerchant=mid;
      clearPendingMerchant();
      return begin("customerHome:"+c.id);
    }
    return begin("publicCustomer");
  }

  // Link Pelanggan: pelanggan baru wajib memasukkan kode 4 angka.
  // Pelanggan yang sudah terdaftar diarahkan ke halaman pelanggan milik Kurir tersebut.
  if(params.has("pelanggan")){
    const courierId=params.get("pelanggan");
    const c=customerCurrent();
    if(c&&c.courierId===courierId)return begin("customerHome:"+c.id);
    setPendingCourier(courierId);
    return begin("publicCustomer");
  }

  // Dukungan sementara untuk link lama berbentuk #mitra= / #pelanggan=.
  if(hash.startsWith("#mitra=")){
    const mid=decodeURIComponent(hash.slice(7));
    setPendingMerchant(mid);
    return begin("publicCustomer");
  }
  if(hash.startsWith("#pelanggan=" )||hash==="#pelanggan"){
    const courierId=hash.startsWith("#pelanggan=")?decodeURIComponent(hash.slice(11)):null;
    const c=customerCurrent();
    if(c&&(!courierId||c.courierId===courierId))return begin("customerHome:"+c.id);
    setPendingCourier(courierId);
    return begin("publicCustomer")
  }

  if(hash==="#dashboard")return begin("dashboard");
  if(state.courier)return begin("dashboard");
  openRegister()
}
window.addEventListener("hashchange",route);

/* =========================
   INIT
   Baca parameter URL saat aplikasi pertama kali dibuka, baik dari
   file lokal Acode maupun dari alamat web seperti GitHub Pages.
========================= */
async function initializeKurirSimple(){
  try{
    const session=await ensureSupabaseSession();
    if(!state.courier){
      await restoreCoreDataFromSupabase(session);
    }else{
      // Akun lokal terikat ke sesi Auth yang aktif; sinkronkan data inti.
      await syncCoreDataToSupabase();
    }
  }catch(err){
    console.error("KURIR SIMPLE: inisialisasi cloud gagal",err);
    showCloudStatus("Supabase belum tersambung: "+(err?.message||"periksa koneksi dan konfigurasi Auth"));
  }
  route();
}
initializeKurirSimple();

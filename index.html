}


navigator.geolocation.getCurrentPosition(


function(

){

"statusLokasi"

},

document.getElementById(

"waKurir"

}

=

await supabaseClient

.from(

"kurir"

)

.select(

"id"

)

.eq(

idKurir

error

};

function(

){

posisi.coords.latitude,


longitude:

posisi.coords.longitude


};


document.getElementById(

"statusLokasiPesanan"

).innerHTML =

"✅ Lokasi berhasil diambil";


}


);


}

// ======================================
// MENU KEDAI PELANGGAN
// ======================================


async function menuPelangganKedai(

kedaiId

){


const {

data:kedai

}

=

await supabaseClient

.from(

"kedai"

)

.select(

"*"

)

.eq(

"id",

kedaiId

)

.single();


const {

data:menuList

}

=

await supabaseClient

.from(

"menu"

)

.select(

"*"

)

.eq(

"kedai_id",

kedaiId

);


let html = `


<div class="card">


<h2>

🏪

${kedai.nama_kedai}

</h2>


`;


for(

let menu of menuList

){


const {

data:varianList

}

=

await supabaseClient

.from(

"varian"

)

.select(

"*"

)

.eq(

"menu_id",

menu.id

);


html += `


<div

class="menu-item"

>


<b>

${menu.nama_menu}

</b>


<div

class="price"

>

${rupiah(menu.harga)}

</div>


`;


if(

varianList.length > 0

){


const tipe =

varianList[0].tipe_pilihan;


varianList.forEach(


function(

varian

){


if(

tipe === "satu"

){


html += `


<div

class="variant"

>


<label>


<input

type="radio"

name="varian_${menu.id}"

value="${varian.nama_varian}"


>


${varian.nama_varian}


</label>


</div>


`;


}

else{


html += `


<div

class="variant"

>


<label>


<input

type="checkbox"

name="varian_${menu.id}"

value="${varian.nama_varian}"


>


${varian.nama_varian}


</label>


</div>


`;


}


}


);


}


html += `


<div

class="row"

>


<button

onclick="ubahJumlah('${menu.id}',-1)"

>

−

</button>


<div

class="quantity"

id="jumlah_${menu.id}"

>

0

</div>


<button

onclick="ubahJumlah('${menu.id}',1)"

>

+

</button>


</div>


</div>


`;


}


html += `


<button

class="btn-success"

onclick="selesaiMenuKedai('${kedaiId}')"

>

SELESAI

</button>


</div>


`;


app.innerHTML =

html;


}



// ======================================
// JUMLAH MENU
// ======================================


let jumlahMenu = {};


function ubahJumlah(

menuId,

nilai

){


if(

!jumlahMenu[menuId]

){

jumlahMenu[menuId] = 0;

}


jumlahMenu[menuId] +=

nilai;


if(

jumlahMenu[menuId] < 0

){

jumlahMenu[menuId] = 0;

}


document.getElementById(

"jumlah_" +

menuId

).innerText =

jumlahMenu[menuId];


}



// ======================================
// SELESAI MENU KEDAI
// ======================================


async function selesaiMenuKedai(

kedaiId

){


const {

data:menuList

}

=

await supabaseClient

.from(

"menu"

)

.select(

"*"

)

.eq(

"kedai_id",

kedaiId

);


for(

let menu of menuList

){


const jumlah =

jumlahMenu[menu.id] || 0;


if(

jumlah > 0

){


let pilihanVarian = [];


const checked =

document.querySelectorAll(

`input[name="varian_${menu.id}"]:checked`

);


checked.forEach(


function(

input

){


pilihanVarian.push(

input.value

);


}


);


keranjang.push({


kedai_id:

kedaiId,


menu_id:

menu.id,


nama_menu:

menu.nama_menu,


harga:

menu.harga,


jumlah:

jumlah,


varian:

pilihanVarian.join(

", "

)


});


}


}


localStorage.setItem(

"keranjang",

JSON.stringify(

keranjang

)

);


jumlahMenu = {};


pilihKedai();


}



// ======================================
// LIHAT KERANJANG
// ======================================


function lihatKeranjang(){


let kelompok = {};


keranjang.forEach(


function(

item

){


if(

!kelompok[item.kedai_id]

){

kelompok[item.kedai_id] = [];

}


kelompok[item.kedai_id].push(

item

);


}


);


let total = 0;


let html = `


<div class="card">


<h2>

🛒 PESANAN SAYA

</h2>


`;


Object.keys(

kelompok

).forEach(


function(

kedaiId

){


html += `


<div

class="card"

>


<h3>

🏪 KEDAI

</h3>


`;


kelompok[kedaiId].forEach(


function(

item

){


const subtotal =

item.harga *

item.jumlah;


total +=

subtotal;


html += `


<p>


<b>

${item.nama_menu}

</b>


<br>


${item.jumlah}

x

${rupiah(item.harga)}


<br>


${item.varian || ""}


</p>


`;


}


);


html +=

"</div>";


}


);


html += `


<h3>

TOTAL PESANAN

</h3>


<h2>

${rupiah(total)}

</h2>


<button

class="btn-success"

onclick="kirimPesanan(${total})"

>

KIRIM PESANAN

</button>


</div>


`;


app.innerHTML =

html;


}



// ======================================
// KIRIM PESANAN
// ======================================


async function kirimPesanan(

total

){


if(

keranjang.length === 0

){

alert(

"Pesanan kosong"

);

return;

}


const {

data:pelanggan

}

=

await supabaseClient

.from(

"pelanggan"

)

.select(

"*"

)

.eq(

"id",

pelangganAktif

)

.single();


const {

data:pesanan,

error

}

=

await supabaseClient

.from(

"pesanan"

)

.insert({

pelanggan_id:

pelangganAktif,

kurir_id:

pelanggan.kurir_id,

latitude:

lokasiPesanan.latitude,

longitude:

lokasiPesanan.longitude,

total_pesanan:

total

})

.select()

.single();


if(

error

){

alert(

error.message

);

return;

}


for(

let item of keranjang

){


await supabaseClient

.from(

"item_pesanan"

)

.insert({

pesanan_id:

pesanan.id,

kedai_id:

item.kedai_id,

menu_id:

item.menu_id,

nama_menu:

item.nama_menu,

harga:

item.harga,

jumlah:

item.jumlah,

varian:

item.varian

});


}


keranjang = [];


localStorage.removeItem(

"keranjang"

);


alert(

"Pesanan berhasil dikirim"

);


menuPelanggan();


}

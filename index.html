
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Saya</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#24334a}
.page{display:none;padding:15px 14px 88px}
.page.active{display:block}
button,input,textarea{font:inherit}
button{cursor:pointer}
input,textarea{width:100%;padding:12px;border:1px solid #dce4ef;border-radius:12px;background:white;outline-color:#4388ed;margin:6px 0 12px}
.primary{background:#287bea;color:white;border:0;border-radius:11px;padding:13px;width:100%;font-weight:bold}
h3{font-size:19px;margin:8px 0 16px}
.back{border:0;background:#e8f0fc;color:#287bea;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:bold;margin-bottom:12px}
.friend{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #e5eaf2;cursor:pointer}
.friend strong,.friend small{display:block;margin-bottom:5px}
small{font-size:12px;color:#7b8798}
.chat-heading{padding:3px 2px 15px;margin-bottom:12px;border-bottom:1px solid #e2e8f0}
.chat-heading .label{font-size:14px;font-weight:bold;letter-spacing:.5px;margin-bottom:10px;color:#526781}
.chat-heading h3{font-size:17px;margin:0 0 7px;color:#24334a}
.chat-heading small{display:block;margin-top:5px;overflow-wrap:anywhere}
#messages{display:flex;flex-direction:column;gap:9px;padding:5px 0 18px}
.msg{width:fit-content;max-width:82%;padding:10px 13px;border-radius:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#287bea;color:white;border-bottom-right-radius:5px}
.theirs{align-self:flex-start;background:white;color:#24334a;border-bottom-left-radius:5px;box-shadow:0 1px 5px #e0e6ef}
.composer{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:9px;gap:8px;align-items:flex-end;box-shadow:0 -2px 10px #e4eaf2}
.composer textarea{margin:0;min-height:44px;max-height:120px;resize:none;border-radius:22px;padding:12px 15px;line-height:20px}
.send{flex-shrink:0;width:44px;height:44px;border:0;border-radius:50%;background:#287bea;color:white;font-size:22px;display:flex;align-items:center;justify-content:center}
.floating{position:fixed;right:14px;bottom:15px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.floating button{background:white;color:#287bea;border:0;border-radius:20px;padding:9px 13px;box-shadow:0 2px 8px #dce5ef;font-weight:bold}
.floating .dots{width:44px;height:44px;border-radius:50%;font-size:22px;padding:0}
#menuOptions{display:none;flex-direction:column;align-items:flex-end;gap:8px}
</style>
</head>
<body>

<section id="register" class="page">
<h3>Buat Akun</h3>
<input id="regName" placeholder="Nama">
<input id="regAddress" placeholder="Alamat">
<input id="regPhone" placeholder="Nomor WhatsApp">
<button class="primary" onclick="register()">Daftar Sekarang</button>
</section>

<section id="home" class="page">
<h3>Teman Chat</h3>
<input id="searchHome" placeholder="Cari nama atau ID teman..." oninput="renderFriends()">
<div id="friendList"></div>
<div class="floating">
<div id="menuOptions">
<button onclick="show('edit')">Edit Akun</button>
<button onclick="show('find')">Cari Teman</button>
</div>
<button class="dots" onclick="toggleMenu()">⋮</button>
</div>
</section>

<section id="edit" class="page">
<button class="back" onclick="show('home')">← Kembali</button>
<h3>Edit Akun</h3>
<input id="editName" placeholder="Nama">
<input id="editAddress" placeholder="Alamat">
<input id="editPhone" placeholder="Nomor WhatsApp">
<button class="primary" onclick="saveAccount()">Simpan Perubahan</button>
</section>

<section id="find" class="page">
<button class="back" onclick="show('home')">← Kembali</button>
<h3>Cari Teman</h3>
<input id="findId" maxlength="5" placeholder="Masukkan ID teman 5 digit">
<button class="primary" onclick="findFriend()">Cari Teman</button>
<div id="findResult"></div>
</section>

<section id="chat" class="page">
<button class="back" onclick="show('home')">← Kembali</button>
<div class="chat-heading">
<div class="label">CHAT</div>
<h3 id="chatName">Andi</h3>
<small id="chatId">ID akun: 48217</small>
<small id="chatPhone">WhatsApp: 081234567890</small>
</div>
<div id="messages"></div>
</section>

<div id="composer" class="composer">
<textarea id="messageInput" rows="1" placeholder="Tulis pesan..."></textarea>
<button class="send" onclick="sendMessage()" aria-label="Kirim pesan">➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ephyrxssmbutevwjwwmd.supabase.co';
const SUPABASE_KEY='sb_publishable_sX4Gil8eofCFuKC4cXQMjw_UD5tlfVp';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let account=null;
let friends=[];
let activeFriend=null;
let loadingMessages=false;
let messageTimer=null;

function show(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 composer.style.display=id==='chat'?'flex':'none';
 if(id==='home')renderFriends();
 if(id==='edit'&&account){
  editName.value=account.display_name||'';
  editAddress.value=account.address||'';
  editPhone.value=account.whatsapp||'';
 }
 if(id!=='home')menuOptions.style.display='none';
 if(messageTimer){clearInterval(messageTimer);messageTimer=null;}
 if(id==='chat'&&activeFriend){
  messageTimer=setInterval(loadMessages,5000);
 }
}

function toggleMenu(){
 menuOptions.style.display=menuOptions.style.display==='flex'?'none':'flex';
}

async function ensureSession(){
 const {data,error}=await db.auth.getSession();
 if(error)throw error;
 if(!data.session){
  const {error:signError}=await db.auth.signInAnonymously();
  if(signError)throw signError;
 }
}

async function startApp(){
 try{
  await ensureSession();
  const {data:auth,error:authError}=await db.auth.getUser();
  if(authError)throw authError;
  if(!auth.user){show('register');return;}

  const {data,error}=await db.from('profiles')
   .select('id,public_id,display_name,whatsapp,address')
   .eq('id',auth.user.id).maybeSingle();
  if(error)throw error;

  if(!data){show('register');return;}
  account=data;
  await loadFriends();
  show('home');
 }catch(e){
  console.error(e);
  show('register');
  alert('Koneksi Supabase gagal: '+e.message);
 }
}

async function register(){
 const name=regName.value.trim();
 const address=regAddress.value.trim();
 const phone=regPhone.value.trim();
 if(!name||!address||!phone)return alert('Lengkapi semua data.');

 try{
  await ensureSession();
  const {data:auth,error:authError}=await db.auth.getUser();
  if(authError)throw authError;
  if(!auth.user)throw new Error('Sesi akun tidak tersedia.');

  const {data:old,error:oldError}=await db.from('profiles')
   .select('id,public_id,display_name,whatsapp,address')
   .eq('id',auth.user.id).maybeSingle();
  if(oldError)throw oldError;

  if(old){account=old;await loadFriends();show('home');return;}

  let result=null;
  for(let i=0;i<10;i++){
   const publicId=String(Math.floor(10000+Math.random()*90000));
   const {data,error}=await db.from('profiles').insert({
    id:auth.user.id,
    public_id:publicId,
    display_name:name,
    whatsapp:phone,
    address:address
   }).select('id,public_id,display_name,whatsapp,address').single();

   if(!error){result=data;break;}
   if(error.code!=='23505')throw error;
  }

  if(!result)throw new Error('Gagal membuat ID akun. Coba lagi.');
  account=result;
  friends=[];
  show('home');
 }catch(e){
  alert('Pendaftaran gagal: '+e.message);
 }
}

async function loadFriends(){
 if(!account)return;
 const {data,error}=await db.rpc('get_chat_contacts');
 if(error)throw error;
 friends=(data||[]).map(f=>({
  id:f.id,
  public_id:f.public_id,
  name:f.display_name,
  phone:f.whatsapp||'',
  address:f.address||''
 }));
 renderFriends();
}

function renderFriends(){
 const q=(searchHome.value||'').toLowerCase();
 friendList.innerHTML='';
 friends.filter(f=>(f.name+' '+f.public_id+' '+f.phone).toLowerCase().includes(q))
 .forEach(f=>{
  const el=document.createElement('div');el.className='friend';
  const n=document.createElement('strong');n.textContent=f.name;
  const i=document.createElement('small');i.textContent='ID: '+f.public_id;
  const p=document.createElement('small');p.textContent='WhatsApp: '+f.phone;
  el.append(n,i,p);el.onclick=()=>openChat(f);
  friendList.appendChild(el);
 });
 if(!friendList.children.length){
  friendList.textContent=q?'Teman tidak ditemukan.':'Belum ada teman.';
 }
}

async function saveAccount(){
 if(!account)return alert('Akun belum tersedia.');
 const name=editName.value.trim();
 const address=editAddress.value.trim();
 const phone=editPhone.value.trim();
 if(!name||!address||!phone)return alert('Lengkapi semua data.');

 const {data,error}=await db.from('profiles').update({
  display_name:name,address:address,whatsapp:phone
 }).eq('id',account.id)
 .select('id,public_id,display_name,whatsapp,address').single();

 if(error)return alert('Gagal menyimpan: '+error.message);
 account=data;
 show('home');
}

async function findFriend(){
 const id=findId.value.trim();
 findResult.innerHTML='';
 if(!/^\d{5}$/.test(id)){
  findResult.textContent='Masukkan ID yang terdiri dari 5 angka.';
  return;
 }
 if(!account)return alert('Akun belum tersedia.');

 try{
  const {data,error}=await db.rpc('find_chat_profile',{search_id:id});
  if(error)throw error;
  const f=(data||[]).find(x=>x.id!==account.id);
  if(!f){findResult.textContent='Teman tidak ditemukan.';return;}

  const already=friends.some(x=>x.id===f.id);
  const el=document.createElement('div');el.className='friend';
  const n=document.createElement('strong');n.textContent=f.display_name;
  const i=document.createElement('small');i.textContent='ID: '+f.public_id;
  const p=document.createElement('small');p.textContent='WhatsApp: '+(f.whatsapp||'');
  const b=document.createElement('button');b.className='primary';
  b.textContent=already?'Buka Chat':'Tambahkan Teman';

  b.onclick=async()=>{
   try{
    if(!already){
     const {error:addError}=await db.from('contacts').upsert({
      owner_id:account.id,contact_id:f.id
     },{onConflict:'owner_id,contact_id',ignoreDuplicates:true});
     if(addError)throw addError;
     await loadFriends();
    }
    openChat(friends.find(x=>x.id===f.id)||{
     id:f.id,public_id:f.public_id,name:f.display_name,
     phone:f.whatsapp||'',address:f.address||''
    });
   }catch(e){alert('Gagal menambahkan teman: '+e.message);}
  };

  el.append(n,i,p,b);findResult.appendChild(el);
 }catch(e){
  findResult.textContent='Pencarian gagal: '+e.message;
 }
}

function openChat(f){
 activeFriend=f;
 chatName.textContent=f.name;
 chatId.textContent='ID akun: '+f.public_id;
 chatPhone.textContent='WhatsApp: '+(f.phone||'-');
 show('chat');
 loadMessages();
}

async function loadMessages(){
 if(!account||!activeFriend||loadingMessages)return;
 loadingMessages=true;
 try{
  const {data,error}=await db.from('messages')
   .select('id,sender_id,recipient_id,content,created_at')
   .or('and(sender_id.eq.'+account.id+',recipient_id.eq.'+activeFriend.id+
       '),and(sender_id.eq.'+activeFriend.id+',recipient_id.eq.'+account.id+')')
   .order('created_at',{ascending:true}).limit(300);
  if(error)throw error;

  messages.innerHTML='';
  (data||[]).forEach(m=>{
   const b=document.createElement('div');
   b.className='msg '+(m.sender_id===account.id?'mine':'theirs');
   b.textContent=m.content;
   messages.appendChild(b);
  });
  window.scrollTo(0,document.body.scrollHeight);
 }catch(e){
  console.error('Gagal memuat pesan:',e.message);
 }finally{
  loadingMessages=false;
 }
}

async function sendMessage(){
 if(!account||!activeFriend)return;
 const content=messageInput.value.trim();
 if(!content)return;

 const btn=document.querySelector('.send');
 btn.disabled=true;
 try{
  const {error}=await db.from('messages').insert({
   sender_id:account.id,
   recipient_id:activeFriend.id,
   content:content
  });
  if(error)throw error;

  messageInput.value='';
  messageInput.style.height='44px';
  await loadMessages();
  messageInput.focus();
 }catch(e){
  alert('Pesan gagal dikirim: '+e.message);
 }finally{
  btn.disabled=false;
 }
}

messageInput.addEventListener('input',()=>{
 messageInput.style.height='44px';
 messageInput.style.height=Math.min(messageInput.scrollHeight,120)+'px';
});
messageInput.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

startApp();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NGURIR SIMPEL</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f9;
    color:#222;
}

button,
input,
select{
    font-family:inherit;
}

button{

}

.app{
    max-width:600px;

}

/* HEADER */

.header{

    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:50;
}

/* HALAMAN */

.page{
    padding:18px;
}

.card{
    background:white;
    border-radius:15px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:18px;
}

/* INPUT */

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

/* BUTTON */

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
}

.blue{
    background:#1565c0;
    color:white;
}

.green{
    background:#2e7d32;
    color:white;
}

.red{
    background:#d32f2f;
    color:white;
}

.orange{
    background:#ef6c00;
    color:white;
}

.gray{
    background:#eeeeee;
    color:#333;
}

/* FLEX */

.row{
    display:flex;
    align-items:center;
    gap:10px;
}

.space{
    justify-content:space-between;
}

/* KEDAI */

.shop{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

.shop-name{

}

.shop-status{

/* MENU */

.menu-item{
    padding:13px 0;

}

.menu-row{

.menu-name{

}

.menu-price{

}

.qty{
    display:flex;

    gap:5px;

.qty button{
    width:32px;

/* VARIAN */

.variant{
    margin-top:10px;
    padding:10px;
    background:#f5f7fa;
    border-radius:10px;
}

.variant-title{
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.variant label{
    display:block;
    margin:5px 0;
    font-weight:normal;
}

/* SEARCH */

.search{

    top:61px;
    background:white;
    padding-bottom:10px;
    z-index:30;
}

/* DAFTAR SCROLL */

.shop-scroll{
    padding-bottom:90px;
}

/* BOTTOM BAR */

.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    padding:10px 15px;
    border-top:1px solid #ddd;
    z-index:100;
}

.bottom-inner{
    max-width:600px;
    margin:auto;
}

/* BADGE */

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-green{
    background:#e8f5e9;
    color:#2e7d32;
}

.badge-red{
    background:#ffebee;
    color:#c62828;
}

.badge-blue{
    background:#e3f2fd;
    color:#1565c0;
}

/* INFO */

.info{
    padding:12px;
    background:#e3f2fd;
    border-radius:10px;
    margin:10px 0;
}

.hidden{
    display:none;
}

.small{
    font-size:13px;
    color:#666;
}

.total{
    font-size:21px;
    font-weight:bold;
    color:#1565c0;
}

.line{
    border-top:1px solid #ddd;
    margin:15px 0;
}

.stock-item{
    padding:12px;
    border-bottom:1px solid #eee;
}

.stock-buttons{
    display:flex;
    gap:8px;
}

.stock-buttons button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

.active-stock{
    outline:3px solid #1565c0;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 15px;
}

.back{
    background:none;
    border:none;
    color:#1565c0;
    font-size:16px;
    font-weight:bold;
    padding:0;
    margin-bottom:15px;
}

@media(max-width:400px){

    .menu-row{
        gap:4px;
    }

    .menu-name{
        font-size:13px;
    }

    .menu-price{
        font-size:11px;
    }

    .qty button{
        width:28px;
        height:28px;
    }

}

</style>
</head>

<body>

<div class="app">

<div class="header">

</div>

<script>

/* =====================================================
   DATABASE SEMENTARA LOCALSTORAGE
===================================================== */

const DB_KEY = "NGURIR_SIMPEL_DATABASE_V1";

function loadDB(){

    }

                menus:[
                    {
                        id:"MENU-001",
                        name:"Bakso Bakar",
                        price:15000,
                        variants:["Pedas","Sedang","Manis"]
                    },
                    {
                        id:"MENU-002",
                        name:"Es Teh",
                        price:5000,
                        variants:[]
                    },
                    {
                        id:"MENU-003",
                        name:"Sosis Bakar",
                        price:10000,
                        variants:["Pedas","Tidak Pedas"]
                    }
                ]
            },

            {
                id:"SHOP-002",
                courierId:"KURIR-001",
                name:"Kedai Nusantara",
                whatsapp:"081234567891",
                menus:[
                    {
                        id:"MENU-004",
                        name:"Ayam Geprek",
                        price:20000,
                        variants:["Pedas","Tidak Pedas"]
                    },
                    {
                        id:"MENU-005",
                        name:"Jus Jeruk",
                        price:8000,
                        variants:[]
                    }
                ]
            },

            {
                id:"SHOP-003",

                name:"Kedai Berkah",
                whatsapp:"081234567892",
                menus:[
                    {
                        id:"MENU-006",
                        name:"Nasi Goreng",
                        price:18000,
                        variants:[]
                    },
                    {
                        id:"MENU-007",

                        price:7000,
                        variants:[]
                    }
                ]
            }
        ],

        customers:[],

        orders:[]

    };

}

let db = loadDB();

function saveDB(){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(db)
    );

}


/* =====================================================
   SESSION
===================================================== */

let session = JSON.parse(
    localStorage.getItem("NGURIR_SESSION") || "null"
);

function saveSession(){

    localStorage.setItem(
        "NGURIR_SESSION",
        JSON.stringify(session)
    );

}


/* =====================================================
   CART SEMENTARA
===================================================== */

let cart = JSON.parse(
    sessionStorage.getItem("NGURIR_CART") ||
    '{"items":[]}'
);

function saveCart(){

    sessionStorage.setItem(
        "NGURIR_CART",
        JSON.stringify(cart)
    );

}

function clearCart(){

    cart = {items:[]};

    saveCart();

}


/* =====================================================
   HELPER
===================================================== */

function rupiah(number){

    return "Rp" +
    Number(number).toLocaleString("id-ID");

}

function generateId(prefix){

    return prefix + "-" +
    Date.now().toString().slice(-6);

}

function getShop(id){

    return db.shops.find(
        shop => shop.id === id
    );

}

function getCustomer(){

    if(!session) return null;

    return db.customers.find(
        customer => customer.id === session.userId
    );

}

function render(html){

    document.getElementById("content").innerHTML = html;

}


/* =====================================================
   HALAMAN AWAL
===================================================== */

function startApp(){

    if(session){

        if(session.role === "customer"){

            showShopSelection();

            return;
        }

        if(session.role === "courier"){

            showCourierDashboard();

            return;
        }

    }

    showHome();

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

render(`

</div>

</p>

</button>

class="btn green"

}


/* =====================================================
   DAFTAR KURIR
===================================================== */

function showCourierRegister(){

render(`

<div class="page">

<button
class="back"
onclick="showHome()">

← Kembali

</button>

<div class="card">

<div class="title">
🚚 DAFTAR KURIR
</div>

<label>Nama</label>

<input
id="courierName"
placeholder="Masukkan nama">

<label>Alamat</label>

<input
id="courierAddress"
placeholder="Masukkan alamat">

<label>Nomor WhatsApp</label>

<input
id="courierWhatsapp"
placeholder="Masukkan nomor WhatsApp">

<button
class="btn gray"
onclick="getCourierLocation()">

📍 BAGIKAN LOKASI

</button>

<div
id="locationStatus"
class="small">
Lokasi belum dibagikan
</div>

<button
class="btn blue"
onclick="registerCourier()">

SELESAI

</button>

</div>

</div>

`);

}


let courierLocation = null;

function getCourierLocation(){

    if(!navigator.geolocation){

        alert(
            "Browser tidak mendukung lokasi"
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            courierLocation = {

                latitude:
                position.coords.latitude,

                longitude:
                position.coords.longitude

            };

            document.getElementById(
                "locationStatus"
            ).innerHTML =
            "✅ Lokasi berhasil disimpan";

        },

        () => {

            alert(
                "Lokasi tidak dapat diambil"
            );

        }

    );

}


function registerCourier(){

    const name =
    document.getElementById("courierName").value.trim();

    const address =
    document.getElementById("courierAddress").value.trim();

    const whatsapp =
    document.getElementById("courierWhatsapp").value.trim();

    if(!name || !address || !whatsapp){

        alert(
            "Lengkapi semua data"
        );

        return;
    }

    const courierNumber =
    db.couriers.length + 1;

    const courier = {

        id:"KURIR-" +
        String(courierNumber).padStart(3,"0"),

        userId:
        generateId("USER"),

        name,
        address,
        whatsapp,

        location:courierLocation

    };

    db.couriers.push(courier);

    saveDB();

    session = {

        role:"courier",

        userId:courier.userId,

        courierId:courier.id

    };

    saveSession();

    showCourierDashboard();

}

/* =====================================================
   KEDAI MILIK KURIR

<div class="title">
🏪 ${shop.name}

function registerCustomer(){

/* =====================================================
   FITUR BARU
   HALAMAN PILIH KEDAI
===================================================== */

class="shop"

</div>

?

:
`<div class="small">
Tekan untuk melihat menu
</div>`
}

${shop.menus.length} Menu

</span>

</div>

class="btn blue"
onclick="showShopMenu('${shop.id}')">

</button>

render(`

<div class="card">

<div class="title">

</div>

<div class="search">

id="searchShop"
placeholder="🔍 Cari nama kedai..."

</div>

<div
id="shopList"
class="shop-scroll">

</div>

</div>

class="btn green"

`);

/* =====================================================
   CARI KEDAI
===================================================== */

function searchShops(){

    const keyword =
    document
    .getElementById("searchShop")
    .value
    .toLowerCase();

    const shops =
    document.querySelectorAll(
        "[data-shop]"
    );

    shops.forEach(shop => {

        const name =
        shop.dataset.shop;

        if(
            name.includes(keyword)
        ){

            shop.style.display = "block";

        }else{

            shop.style.display = "none";

        }

    });

}

   MENU SATU KEDAI
===================================================== */

function showShopMenu(shopId){

    const shop =
    getShop(shopId);

    let menuHTML = "";

    shop.menus.forEach(menu => {

        const variantsHTML =
        menu.variants.length
        ?
        `

<div class="variant">

<div class="variant-title">

Pilih Varian:

</div>

${menu.variants.map(
variant => `

<label>

<input
type="radio"
name="variant_${menu.id}"
value="${variant}">

${variant}

</label>

`
).join("")}

</div>

`
:
"";


        menuHTML += `

<div class="menu-item">

<div class="menu-row">

<div class="menu-name">

${menu.name}

</div>

<div class="menu-price">

${rupiah(menu.price)}

</div>

<div class="qty">

<button
onclick="changeQty(
'${shop.id}',
'${menu.id}',
-1
)">

−

class="qty-number"

</div>

onclick="changeQty(
'${shop.id}',
'${menu.id}',
1
)">

+

</button>

</div>

</div>

${variantsHTML}

</div>

`;

    });

🏪 ${shop.name}

/* =====================================================
   JUMLAH PESANAN
===================================================== */

function getCartQty(
shopId,
menuId
){

    const item =
    cart.items.find(
        item =>
        item.shopId === shopId &&
        item.menuId === menuId
    );

    return item
    ? item.qty
    : 0;

}


function changeQty(
shopId,
menuId,
change
){

    const shop =
    getShop(shopId);

    const menu =
    shop.menus.find(
        menu =>
        menu.id === menuId
    );

    let item =
    cart.items.find(
        item =>
        item.shopId === shopId &&
        item.menuId === menuId
    );

    if(!item){

        if(change < 0) return;

        item = {

            shopId,
            shopName:shop.name,

            menuId,
            menuName:menu.name,

            price:menu.price,

            variant:"",

            qty:0

        };

        cart.items.push(item);

    }


    item.qty += change;

    if(item.qty < 0){

        item.qty = 0;

    }


    if(item.qty === 0){

        cart.items =
        cart.items.filter(
            cartItem =>
            !(
                cartItem.shopId === shopId &&
                cartItem.menuId === menuId
            )
        );

    }


    saveCart();


    const qtyElement =
    document.getElementById(
        "qty_" + menuId
    );

    if(qtyElement){

        qtyElement.innerText =
        getCartQty(
            shopId,
            menuId
        );

    }

}


/* =====================================================
   SELESAI MEMILIH MENU KEDAI
===================================================== */

function saveShopOrder(shopId){

    const shop =
    getShop(shopId);

    shop.menus.forEach(menu => {

        const item =
        cart.items.find(
            item =>
            item.shopId === shopId &&
            item.menuId === menu.id
        );

        if(item &&
        item.qty > 0 &&
        menu.variants.length){

            const selected =
            document.querySelector(
                `input[name="variant_${menu.id}"]:checked`
            );

            if(selected){

                item.variant =
                selected.value;

            }else{

                alert(
                    "Pilih varian untuk " +
                    menu.name
                );

                throw "VARIANT_REQUIRED";

            }

        }

    });

    saveCart();

    showShopSelection();

}


/* =====================================================
   SELESAI AKHIR
===================================================== */

function finishAllShops(){

    if(
        cart.items.length === 0
    ){

        alert(
            "Silakan pilih pesanan terlebih dahulu"
        );

        return;

    }

    showOrderSummary();

}


/* =====================================================
   RINGKASAN PESANAN
===================================================== */

function showOrderSummary(){

    const grouped = {};

    cart.items.forEach(item => {

        if(!grouped[item.shopId]){

            grouped[item.shopId] = {

                shopName:
                item.shopName,

                items:[]

            };

        }

        grouped[item.shopId]
        .items
        .push(item);

    });


    let html = "";

    let total = 0;


    Object.values(grouped)
    .forEach(group => {

        let subtotal = 0;

        let itemsHTML = "";

        group.items.forEach(item => {

            const price =
            item.price *
            item.qty;

            subtotal += price;

            itemsHTML += `

<div class="row space">

<div>

<b>${item.menuName}</b>

${
item.variant
?
`<br>
<span class="small">
${item.variant}
</span>`
:
""
}

</div>

<div>

${item.qty} ×
${rupiah(item.price)}

</div>

</div>

`;

        });

        total += subtotal;

        html += `

<div class="card">

<div class="title">

🏪 ${group.shopName}

</div>

${itemsHTML}

<div class="line"></div>

<div class="row space">

<b>Subtotal</b>

<b>${rupiah(subtotal)}</b>

</div>

</div>

`;

    });


render(`

<div class="page">

<button
class="back"
onclick="showShopSelection()">

← Kembali

</button>

<div class="title">

🧾 RINGKASAN PESANAN

</div>

${html}

<div class="card">

<div class="row space">

<b>TOTAL PESANAN</b>

<div class="total">

${rupiah(total)}

</div>

</div>

</div>

<button
class="btn blue"
onclick="sendOrder()">

📦 KIRIM PESANAN

</button>

</div>

`);

}


/* =====================================================
   KIRIM PESANAN
===================================================== */

function sendOrder(){

    const customer =
    getCustomer();

    const order = {

        id:
        generateId("ORDER"),

        customerId:
        customer.id,

        customerName:
        customer.name,

        customerWhatsapp:
        customer.whatsapp,

        customerAddress:
        customer.address,

        courierId:
        session.courierId,

        items:
        [...cart.items],

        status:"MENUNGGU CEK STOK",

        createdAt:
        new Date()
        .toLocaleString("id-ID"),

        shopStatus:{},

        shipping:0

    };


    cart.items.forEach(item => {

        if(
            !order.shopStatus[item.shopId]
        ){

            order.shopStatus[item.shopId] = {

                stockChecked:false,

                customerDecision:"MENUNGGU"

            };

        }

    });


    db.orders.push(order);

    saveDB();

    clearCart();

    showOrderSent(order.id);

}

function showShipping(orderId){

function saveShipping(orderId){

    const price =
    Number(
        document
        .getElementById("shippingPrice")
        .value
    );

    if(price < 0 ||
    isNaN(price)){

        alert(
            "Masukkan ongkir yang benar"
        );

        return;

    }

    const order =
    db.orders.find(
        order =>
        order.id === orderId
    );

    order.shipping = price;

    order.status =
    "ONGKIR DIKIRIM";

    saveDB();

    alert(
        "Ongkir berhasil dikirim"
    );

    showCourierOrders();

}

}

===================================================== */

);

    );

}

function clearCart(){

    cart = {items:[]};

    saveCart();

/* =====================================================

===================================================== */

function rupiah(number){

    return "Rp" +
    Number(number).toLocaleString("id-ID");

}

function generateId(prefix){

    return prefix + "-" +
    Date.now().toString().slice(-6);

}

function getShop(id){

    return db.shops.find(
        shop => shop.id === id
    );

}

function getCustomer(){

    if(!session) return null;

    return db.customers.find(
        customer => customer.id === session.userId
    );

}

let courierLocation = null;

function getCourierLocation(){

    if(!navigator.geolocation){

        alert(
            "Browser tidak mendukung lokasi"
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            courierLocation = {

                latitude:
                position.coords.latitude,

                longitude:
                position.coords.longitude

            };

            document.getElementById(
                "locationStatus"
            ).innerHTML =
            "✅ Lokasi berhasil disimpan";

        },

        () => {

            alert(
                "Lokasi tidak dapat diambil"
            );

        }

    );

}


function registerCourier(){

    const name =
    document.getElementById("courierName").value.trim();

    const address =
    document.getElementById("courierAddress").value.trim();

    const whatsapp =
    document.getElementById("courierWhatsapp").value.trim();

    if(!name || !address || !whatsapp){

        alert(
            "Lengkapi semua data"
        );

        return;
    }

    const courierNumber =
    db.couriers.length + 1;

    const courier = {

        id:"KURIR-" +
        String(courierNumber).padStart(3,"0"),

        userId:
        generateId("USER"),

        name,
        address,
        whatsapp,

        location:courierLocation

    };

    db.couriers.push(courier);

    saveDB();

    session = {

        role:"courier",

        userId:courier.userId,

        courierId:courier.id

    };

    saveSession();

    showCourierDashboard();

}

render(`

function searchShops(){

    const keyword =
    document
    .getElementById("searchShop")
    .value
    .toLowerCase();

    const shops =
    document.querySelectorAll(
        "[data-shop]"
    );

    shops.forEach(shop => {

        const name =
        shop.dataset.shop;

        if(
            name.includes(keyword)
        ){

            shop.style.display = "block";

        }else{

            shop.style.display = "none";

        }

    });

}

/* =====================================================
   JUMLAH PESANAN
===================================================== */

function getCartQty(
shopId,
menuId
){

    const item =
    cart.items.find(
        item =>
        item.shopId === shopId &&
        item.menuId === menuId
    );

    return item
    ? item.qty
    : 0;

}


function changeQty(
shopId,
menuId,
change
){

    const shop =
    getShop(shopId);

    const menu =
    shop.menus.find(
        menu =>
        menu.id === menuId
    );

    let item =
    cart.items.find(
        item =>
        item.shopId === shopId &&
        item.menuId === menuId
    );

    if(!item){

        if(change < 0) return;

        item = {

            shopId,
            shopName:shop.name,

            menuId,
            menuName:menu.name,

            price:menu.price,

            variant:"",

            qty:0

        };

        cart.items.push(item);

    }


    item.qty += change;

    if(item.qty < 0){

        item.qty = 0;

    }


    if(item.qty === 0){

        cart.items =
        cart.items.filter(
            cartItem =>
            !(
                cartItem.shopId === shopId &&
                cartItem.menuId === menuId
            )
        );

    }


    saveCart();


    const qtyElement =
    document.getElementById(
        "qty_" + menuId
    );

    if(qtyElement){

        qtyElement.innerText =
        getCartQty(
            shopId,
            menuId
        );

    }

}


/* =====================================================
   SELESAI MEMILIH MENU KEDAI
===================================================== */

function saveShopOrder(shopId){

    const shop =
    getShop(shopId);

    shop.menus.forEach(menu => {

        const item =
        cart.items.find(
            item =>
            item.shopId === shopId &&
            item.menuId === menu.id
        );

        if(item &&
        item.qty > 0 &&
        menu.variants.length){

            const selected =
            document.querySelector(
                `input[name="variant_${menu.id}"]:checked`
            );

            if(selected){

                item.variant =
                selected.value;

            }else{

                alert(
                    "Pilih varian untuk " +
                    menu.name
                );

                throw "VARIANT_REQUIRED";

            }

        }

    });

    saveCart();

    showShopSelection();

}

function finishAllShops(){

        alert(

        );

        return;

    }

    showOrderSummary();

}


/* =====================================================
   RINGKASAN PESANAN
===================================================== */

function showOrderSummary(){

    const grouped = {};

    cart.items.forEach(item => {

        if(!grouped[item.shopId]){

            grouped[item.shopId] = {

                shopName:
                item.shopName,

                items:[]

            };

        }

        grouped[item.shopId]
        .items
        .push(item);

    });


    let html = "";

    let total = 0;


    Object.values(grouped)
    .forEach(group => {

        let subtotal = 0;

        let itemsHTML = "";

        group.items.forEach(item => {

            const price =
            item.price *
            item.qty;

            subtotal += price;

            itemsHTML += `

<div class="row space">

<div>

<b>${item.menuName}</b>

${
item.variant
?
`<br>
<span class="small">
${item.variant}
</span>`
:
""
}

</div>

<div>

${item.qty} ×
${rupiah(item.price)}

</div>

</div>

`;

        });

        total += subtotal;

        html += `

<div class="card">

<div class="title">

🏪 ${group.shopName}

</div>

${itemsHTML}

<div class="line"></div>

<div class="row space">

<b>Subtotal</b>

<b>${rupiah(subtotal)}</b>

</div>

</div>

`;

    });


render(`

class="back"
onclick="showShopSelection()">

</button>

</div>

${html}

${rupiah(total)}

</div>

class="btn blue"

`);

}

function sendOrder(){

    const customer =
    getCustomer();

    const order = {

        id:
        generateId("ORDER"),

        customerId:
        customer.id,

        customerName:
        customer.name,

        customerWhatsapp:
        customer.whatsapp,

        customerAddress:
        customer.address,

        courierId:
        session.courierId,

        items:
        [...cart.items],

        status:"MENUNGGU CEK STOK",

        createdAt:
        new Date()
        .toLocaleString("id-ID"),

        shopStatus:{},

        shipping:0

    };


    cart.items.forEach(item => {

        if(
            !order.shopStatus[item.shopId]
        ){

            order.shopStatus[item.shopId] = {

                stockChecked:false,

                customerDecision:"MENUNGGU"

            };

        }

    });


    db.orders.push(order);

    saveDB();

    clearCart();

    showOrderSent(order.id);

}

function saveShipping(orderId){

    const price =
    Number(
        document
        .getElementById("shippingPrice")
        .value
    );

    if(price < 0 ||
    isNaN(price)){

        alert(
            "Masukkan ongkir yang benar"
        );

        return;

    }

    const order =
    db.orders.find(
        order =>
        order.id === orderId
    );

    order.shipping = price;

    order.status =
    "ONGKIR DIKIRIM";

    saveDB();

    alert(
        "Ongkir berhasil dikirim"
    );

    showCourierOrders();

}

<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
/* =========================================================
   KURIR SIMPLE
   Supabase REST API
   Publishable key aman ditaruh di browser; RLS menentukan
   data apa yang boleh dibaca/ditulis.
   ========================================================= */
const SUPABASE_URL = "https://xkysusfemehvdaqkyzhg.supabase.co";
const SUPABASE_KEY = "sb_publishable_JDmN5TndzBue7Rsmeiphtw_K2MzPcbA";
const TABLE = "kurir_simple_data";
const REST = SUPABASE_URL + "/rest/v1/" + TABLE;

let state = {
  courier:null,
  partners:[],
  customers:[],
  orders:[],
  incomes:[]
};
let rowId = null;
let editingPartnerId = null;
let editingMenuId = null;
let currentPartnerId = null;
let currentOrderId = null;
let selectedCustomer = null;
let customerCart = {};
let publicMode = null;

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function uid(prefix="id"){return prefix+"_"+crypto.randomUUID().replaceAll("-","").slice(0,18)}
function rupiah(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0)}
function now(){return new Date().toISOString()}
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}
/* ============================================================
   LINK PUBLIK KURIR SIMPLE
   Jika aplikasi dijalankan dari GitHub Pages/hosting, alamat
   publik otomatis mengikuti alamat tersebut. Jika masih dibuka
   sebagai file lokal, link lokal TIDAK bisa dibuka HP lain.
   ============================================================ */
/*
  ALAMAT PUBLIK APLIKASI.
  Jika aplikasi sudah di-host di GitHub Pages/hosting, biarkan kosong:
  kode otomatis memakai alamat halaman tempat aplikasi sedang berjalan.
  Jika Anda ingin memaksa satu alamat tertentu, isi contoh:
  const PUBLIC_APP_URL = "https://username.github.io/kurir-simple/";
*/
const PUBLIC_APP_URL = ""; // ISI DENGAN ALAMAT GITHUB PAGES, contoh: https://username.github.io/kurir-simple/
function baseURL(){
  let raw = PUBLIC_APP_URL.trim();
  if(raw){
    if(!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
    const u = new URL(raw);
    u.search = "";
    u.hash = "";
    return u.href.replace(/\/$/,"") + "/";
  }
  if(!isPublicWebURL()) return "";
  const u = new URL(location.href);
  u.search = "";
  u.hash = "";
  /*
    Gunakan pathname file aplikasi yang sedang di-host.
    Contoh GitHub Pages:
    https://username.github.io/kurir-simple/index.html
  */
  return u.href.replace(/\/$/,"") + "/";
}
function isPublicWebURL(){
  return /^https?:$/i.test(location.protocol);
}
function q(name){return new URLSearchParams(location.search).get(name)}
function linkForCourier(){
  const b=baseURL();
  return b ? b+"?kurir="+encodeURIComponent(rowId)+"&pelanggan=1" : "";
}
function linkForPartner(pid){
  const b=baseURL();
  return b ? b+"?kurir="+encodeURIComponent(rowId)+"&mitra="+encodeURIComponent(pid) : "";
}
function ensurePublicLink(){
  if(!PUBLIC_APP_URL.trim() && !isPublicWebURL()){
    toast("Aplikasi masih dibuka dari file lokal. Upload ke GitHub Pages agar link dapat dibuka lewat WhatsApp.");
    return false;
  }
  if(!rowId){
    toast("ID Kurir belum tersedia. Simpan akun Kurir terlebih dahulu.");
    return false;
  }
  return true;
}
function headers(extra={}){
  return Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json","Accept":"application/json"},extra);
}
async function api(path="",options={}){
  const res=await fetch(REST+path,Object.assign({headers:headers()},options));
  const txt=await res.text();
  let data=null; try{data=txt?JSON.parse(txt):null}catch{}
  if(!res.ok){
    const msg=(data&&data.message)||txt||("HTTP "+res.status);
    if(/could not find the table .*kurir_simple_data.*schema cache/i.test(msg)){
      throw new Error("Supabase belum mengenali tabel kurir_simple_data. Jalankan SQL KURIR SIMPLE di Supabase SQL Editor, lalu jalankan: NOTIFY pgrst, 'reload schema';");
    }
    throw new Error(msg);
  }
  return data;
}
async function loadRow(id){
  const data=await api("?select=*&id=eq."+encodeURIComponent(id)+"&limit=1");
  if(!data.length) throw new Error("Data Kurir tidak ditemukan.");
  rowId=data[0].id;
  state=data[0].data||state;
  normalize();
}
async function createRow(){
  normalize();
  const data=await api("",{
    method:"POST",
    headers:headers({"Prefer":"return=representation"}),
    body:JSON.stringify({data:state})
  });
  rowId=data[0].id;
}
async function save(){
  if(!rowId) return;
  normalize();
  await api("?id=eq."+encodeURIComponent(rowId),{
    method:"PATCH",
    headers:headers({"Prefer":"return=minimal"}),
    body:JSON.stringify({data:state,updated_at:now()})
  });
}
function normalize(){
  if(!state||typeof state!=="object")state={};
  state.courier=state.courier||null;
  state.partners=Array.isArray(state.partners)?state.partners:[];
  state.customers=Array.isArray(state.customers)?state.customers:[];
  state.orders=Array.isArray(state.orders)?state.orders:[];
  state.incomes=Array.isArray(state.incomes)?state.incomes:[];
  state.partners.forEach(p=>{p.menus=Array.isArray(p.menus)?p.menus:[];p.status=p.status||"CLOSED"});
  state.partners.forEach(p=>p.menus.forEach(m=>{
    m.status=m.status||"TERSEDIA";m.hasVariants=!!m.hasVariants;
    m.variants=Array.isArray(m.variants)?m.variants:[];
    m.pickRule=m.pickRule||"single";m.priceRule=m.priceRule||"same";
  }));
}
function addressBox(a){
  if(!a)return `<div class="address muted">Lokasi belum dibagikan.</div>`;
  return `<div class="address">
    <div><b>Provinsi</b>${esc(a.province||"-")}</div>
    <div><b>Kabupaten</b>${esc(a.regency||"-")}</div>
    <div><b>Kecamatan</b>${esc(a.district||"-")}</div>
    <div><b>Desa</b>${esc(a.village||"-")}</div>
  </div>`;
}
function back(){
  /* Navigasi internal aplikasi. Jangan bergantung pada history browser,
     karena sebagian besar perpindahan halaman KURIR SIMPLE dilakukan
     dengan render() tanpa mengubah URL. */
  if(publicMode==="customer") {
    switch(currentView){
      case "customerMenu": return renderCustomerPick();
      case "customerOrders": return renderCustomerPick();
      case "customerAccount": return renderCustomerPick();
      case "customerSend": return renderCustomerOrders();
      default: return showDashboard();
    }
  }
  if(publicMode==="partner") {
    switch(currentView){
      case "partnerOrdersPublic": return renderPartnerPublic();
      case "partnerCheck": return showPartnerOrdersPublic();
      default: return renderPartnerPublic();
    }
  }

  switch(currentView){
    case "customerLink": return showDashboard();
    case "partners": return showDashboard();
    case "addPartner": return showPartners();
    case "partner": return showPartners();
    case "menuAdd": return showPartnerDetail(editingPartnerId || currentPartnerId);
    case "menuEdit": return showPartnerDetail(editingPartnerId || currentPartnerId);
    case "variant": return showMenuForm(!!editingMenuId);
    case "income": return showDashboard();
    case "account": return showDashboard();
    case "editAccount": return showAccount();
    case "ordersCourier": return showAccount();
    case "orderDetail": return showCourierOrders();
    case "register":
      if(state.courier) return showDashboard();
      if(window.history.length > 1) return window.history.back();
      return;
    default:
      if(window.history.length > 1) return window.history.back();
      return showDashboard();
  }
}
function render(html){document.getElementById("app").innerHTML=html}
function header(title,backBtn=true){
  return `<div class="top">${backBtn?`<button type="button" class="back" onclick="back()">← KEMBALI</button>`:""}</div><div class="title">${title}</div>`;
}
function requireCourier(){
  if(!state.courier){showCourierRegister();return false}
  return true;
}

/* ---------- LOCATION ---------- */
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function getBestGPSPosition(){
  if(!navigator.geolocation) throw new Error("Perangkat tidak mendukung lokasi.");
  return new Promise((resolve,reject)=>{
    let best=null, finished=false, timer=null, watchId=null;
    const finish=()=>{
      if(finished)return;
      finished=true;
      if(timer)clearTimeout(timer);
      if(watchId!==null)navigator.geolocation.clearWatch(watchId);
      if(best)resolve(best); else reject(new Error("Lokasi tidak berhasil diperoleh."));
    };
    const success=pos=>{
      if(!best || pos.coords.accuracy < best.coords.accuracy) best=pos;
      /* Hentikan lebih cepat jika akurasi sudah sangat baik. */
      if(pos.coords.accuracy <= 20) setTimeout(finish,350);
    };
    const error=err=>{
      if(!best && (err.code===1 || err.code===2)){
        if(timer)clearTimeout(timer);
        finished=true;
        if(watchId!==null)navigator.geolocation.clearWatch(watchId);
        reject(new Error(err.code===1?"Izin lokasi ditolak. Izinkan lokasi untuk browser ini.":"Lokasi belum tersedia."));
      }
    };
    try{
      watchId=navigator.geolocation.watchPosition(success,error,{
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:0
      });
      timer=setTimeout(finish,10000);
    }catch(e){reject(e)}
  });
}

function firstNonEmpty(...values){
  return values.find(v=>v!==undefined && v!==null && String(v).trim()!=="") || "";
}

function administrativeFromBigData(j){
  const out={province:"",regency:"",district:"",village:""};
  const arr=Array.isArray(j?.localityInfo?.administrative)?j.localityInfo.administrative:[];

  for(const item of arr){
    const name=firstNonEmpty(item?.name,item?.description);
    if(!name)continue;
    const order=Number(item?.order);
    const level=String(item?.adminLevel??item?.adminLevelName??"").toLowerCase();
    const desc=String(item?.description??"").toLowerCase();
    const text=(level+" "+desc).trim();

    if(/province|provinsi/.test(text) || order===4){
      out.province ||= name;
    }else if(/regency|kabupaten|county/.test(text) || order===6){
      out.regency ||= name;
    }else if(/district|kecamatan|city district/.test(text) || order===8){
      out.district ||= name;
    }else if(/village|desa|kelurahan|subdistrict/.test(text) || order>=10){
      out.village ||= name;
    }
  }

  const info=Array.isArray(j?.localityInfo?.informative)?j.localityInfo.informative:[];
  const byText=(rx)=>info.find(x=>rx.test(String(x?.description||x?.name||"")))?.name;

  out.province=firstNonEmpty(
    out.province,
    j?.principalSubdivision,
    byText(/province|provinsi/i)
  );
  out.regency=firstNonEmpty(
    out.regency,
    j?.city,
    j?.locality,
    byText(/regency|kabupaten|county/i)
  );
  out.district=firstNonEmpty(
    out.district,
    j?.district,
    byText(/district|kecamatan/i)
  );
  out.village=firstNonEmpty(
    out.village,
    j?.village,
    j?.suburb,
    j?.locality,
    byText(/village|desa|kelurahan|subdistrict/i)
  );

  return out;
}

function administrativeFromNominatim(a){
  return {
    province:firstNonEmpty(a?.state,a?.province),
    regency:firstNonEmpty(a?.county,a?.regency,a?.city,a?.municipality),
    district:firstNonEmpty(a?.city_district,a?.district,a?.subdistrict,a?.municipality),
    village:firstNonEmpty(a?.village,a?.suburb,a?.town,a?.quarter,a?.neighbourhood)
  };
}

function mergeAdministrative(n,b){
  return {
    province:firstNonEmpty(n.province,b.province),
    regency:firstNonEmpty(n.regency,b.regency),
    district:firstNonEmpty(n.district,b.district),
    village:firstNonEmpty(n.village,b.village)
  };
}

async function reverseLocation(lat,lon){
  const nomUrl="https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lon)+"&zoom=18&addressdetails=1&accept-language=id";
  const bdcUrl="https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+encodeURIComponent(lat)+"&longitude="+encodeURIComponent(lon)+"&localityLanguage=id";
  const results=await Promise.allSettled([
    fetch(nomUrl,{headers:{"Accept":"application/json"}}).then(r=>{if(!r.ok)throw new Error("Nominatim "+r.status);return r.json()}),
    fetch(bdcUrl,{headers:{"Accept":"application/json"}}).then(r=>{if(!r.ok)throw new Error("BigDataCloud "+r.status);return r.json()})
  ]);
  const nom=results[0].status==="fulfilled"?results[0].value:null;
  const bdc=results[1].status==="fulfilled"?results[1].value:null;
  if(!nom && !bdc) throw new Error("Layanan alamat tidak dapat dihubungi.");
  const na=administrativeFromNominatim(nom?.address||{});
  const ba=administrativeFromBigData(bdc||{});
  const ad=mergeAdministrative(na,ba);
  return {
    lat:Number(lat),
    lon:Number(lon),
    accuracy:null,
    province:ad.province,
    regency:ad.regency,
    district:ad.district,
    village:ad.village,
    display:firstNonEmpty(nom?.display_name,bdc?.localityInfo?.informative?.map?.(x=>x?.name).filter(Boolean).join(", "),[ad.village,ad.district,ad.regency,ad.province].filter(Boolean).join(", "))
  };
}

async function getLocation(target){
  if(!navigator.geolocation){toast("Perangkat tidak mendukung lokasi.");return false}

  /*
     Simpan dulu nilai form yang sedang diketik. Pada halaman pendaftaran,
     lokasi melakukan rerender sehingga nilai input yang belum tersimpan ke
     state bisa hilang.
  */
  if(target===state.courier && currentView==="register"){
    const nameEl=document.getElementById("cName");
    const waEl=document.getElementById("cWa");
    state.courier=state.courier||{};
    if(nameEl)state.courier.name=nameEl.value;
    if(waEl)state.courier.wa=waEl.value.replace(/\D/g,"");
  }

  toast("Mencari lokasi akurat...");
  try{
    const pos=await getBestGPSPosition();
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    const location=await reverseLocation(lat,lon);
    location.accuracy=Number(pos.coords.accuracy||0);

    /* Jangan mengganti object courier sehingga nama/WA yang sudah diketik
       tetap berada di state. */
    target.location=location;

    toast("Lokasi berhasil ditemukan.");
    rerenderCurrent();
    return true;
  }catch(e){
    toast(e.message||"Lokasi gagal diambil.");
    rerenderCurrent();
    return false;
  }
}

/* ---------- ROUTING ---------- */
let currentView="home";
function rerenderCurrent(){
  if(publicMode==="customer") return renderCustomer();
  if(publicMode==="partner") return renderPartnerPublic();
  switch(currentView){
    case "register":showCourierRegister();break;
    case "dashboard":showDashboard();break;
    case "partners":showPartners();break;
    case "partner":showPartnerDetail(currentPartnerId);break;
    case "menuAdd":showMenuForm();break;
    case "menuEdit":showMenuForm(true);break;
    case "variant":showVariantSettings();break;
    case "income":showIncome();break;
    case "account":showAccount();break;
    case "editAccount":showEditAccount();break;
    case "ordersCourier":showCourierOrders();break;
    case "orderDetail":showOrderDetail(currentOrderId);break;
    default:showDashboard();
  }
}
async function boot(){
  const k=q("kurir"),mitra=q("mitra"),pel=q("pelanggan");
  try{
    if(k){await loadRow(k)}
    else{
      const saved=localStorage.getItem("KURIR_SIMPLE_ROW");
      if(saved){try{await loadRow(saved)}catch{localStorage.removeItem("KURIR_SIMPLE_ROW")}}
    }
    if(k && mitra){publicMode="partner";currentPartnerId=mitra;return renderPartnerPublic()}
    if(k && pel){publicMode="customer";return renderCustomer()}
  }catch(e){render(`<div class="screen">${header("KURIR SIMPLE",false)}<div class="notice">${esc(e.message)}</div></div>`);return}
  if(state.courier) showDashboard(); else showCourierRegister();
}
function go(v){
  publicMode=null;currentView=v;rerenderCurrent();
}

/* ---------- COURIER REGISTRATION ---------- */
function showCourierRegister(){
  currentView="register";publicMode=null;
  const c=state.courier||{};
  render(`<div class="screen">
    ${header("DAFTAR AKUN KURIR",true)}
    <div class="label">Nama</div>
    <input id="cName" value="${esc(c.name||"")}" placeholder="">
    <div class="label">Nomor WhatsApp</div>
    <input id="cWa" inputmode="numeric" maxlength="12" value="${esc(c.wa||"")}" placeholder="12 digit">
    ${c.location?`<div class="label">Alamat</div>${addressBox(c.location)}`:`<button class="btn" onclick="registerLocation()">BAGIKAN LOKASI</button>`}
    <button class="btn primary" onclick="finishRegister()">SELESAI</button>
  </div>`);
}
function registerLocation(){
  state.courier=state.courier||{};

  /* Simpan nama dan nomor sebelum halaman di-rerender oleh proses lokasi. */
  const nameEl=document.getElementById("cName");
  const waEl=document.getElementById("cWa");
  if(nameEl)state.courier.name=nameEl.value;
  if(waEl)state.courier.wa=waEl.value.replace(/\D/g,"");

  getLocation(state.courier);
}
async function finishRegister(){
  const name=document.getElementById("cName").value.trim();
  const wa=document.getElementById("cWa").value.replace(/\D/g,"");
  if(!name)return toast("Nama wajib diisi.");
  if(wa.length!==12)return toast("Nomor WhatsApp harus 12 digit.");
  if(!state.courier?.location)return toast("Bagikan lokasi terlebih dahulu.");
  state.courier={name,wa,location:state.courier.location};
  try{
    if(!rowId)await createRow(); else await save();
    localStorage.setItem("KURIR_SIMPLE_ROW",rowId);
    showDashboard();
  }catch(e){toast("Gagal menyimpan: "+e.message)}
}

/* ---------- DASHBOARD ---------- */
function showDashboard(){
  currentView="dashboard";publicMode=null;
  render(`<div class="screen">
    <div class="title">KURIR SIMPLE</div>

function openVariantSettings(){

  if(!m){

    price:(document.getElementById("vp"+i)?.value ?? "")!==""

  const o=state.orders.find(x=>x.id===oid);
  const p=state.partners.find(x=>x.id===currentPartnerId);
  const lines=o.items.filter(i=>i.partnerId===p.id);lines[idx].check=v;renderPartnerCheckKeep(o,p)
}

async function sendCheck(oid,pid){
  const o=state.orders.find(x=>x.id===oid);
  const lines=o.items.filter(i=>i.partnerId===pid);
  if(lines.some(i=>!i.check))return toast("Tentukan ADA/KOSONG untuk semua produk.");
  const allDone=o.partnerIds.every(pid2=>o.items.filter(i=>i.partnerId===pid2).every(i=>i.check));
  o.partnerChecks=o.partnerChecks||{};
  o.partnerChecks[pid]=true;
  if(allDone)o.status="CHECKED";
  try{await save();toast("Hasil pengecekan dikirim.");renderPartnerPublic()}catch(e){toast(e.message)}
}

  </div>`);

function customerMenuHTML(m){
  const qv=customerCart[m.id]?.qty||0;
  if(m.status==="HABIS")return `<div class="menu-item disabled"><div class="menu-head"><div class="menu-name">${esc(m.name)}</div><div class="price">${rupiah(m.basePrice)}</div></div><div class="status sold">HABIS</div></div>`;
  if(!m.hasVariants)return `<div class="menu-item"><div class="menu-head"><div class="menu-name">${esc(m.name)}</div><div class="qty"><button onclick="event.stopPropagation();changeCart('${m.id}',null,-1)">−</button><span>${qv}</span><button onclick="event.stopPropagation();changeCart('${m.id}',null,1)">+</button></div></div><div class="price">${rupiah(m.basePrice)}</div></div>`;
  if(m.pickRule==="single"){
    const sel=customerCart[m.id]?.variantId||"";
    return `<div class="menu-item"><div class="menu-head"><div class="menu-name">${esc(m.name)}</div><div class="qty"><button onclick="changeCart('${m.id}',null,-1)">−</button><span>${customerCart[m.id]?.qty||0}</span><button onclick="changeCart('${m.id}',null,1)">+</button></div></div>
      ${m.variants.map(v=>`<label class="variant"><input type="radio" name="rv_${m.id}" value="${v.id}" ${sel===v.id?"checked":""} onchange="selectVariant('${m.id}','${v.id}')"><span class="grow">${esc(v.name)}</span><span>${rupiah(m.priceRule==="different"?v.price:m.basePrice)}</span></label>`).join("")}</div>`;
  }
  return `<div class="menu-item"><div class="menu-name">${esc(m.name)}</div>
    ${m.variants.map(v=>{const q2=customerCart[m.id]?.variants?.[v.id]||0;return `<div class="variant"><span class="grow">${esc(v.name)}</span><span>${rupiah(m.priceRule==="different"?v.price:m.basePrice)}</span><span class="qty"><button onclick="changeCart('${m.id}','${v.id}',-1)">−</button><span>${q2}</span><button onclick="changeCart('${m.id}','${v.id}',1)">+</button></span></div>`}).join("")}</div>`;
}
function selectVariant(mid,vid){customerCart[mid]=customerCart[mid]||{qty:0};customerCart[mid].variantId=vid;renderCustomerMenu()}
function changeCart(mid,vid,delta){
  const p=state.partners.find(x=>x.id===currentPartnerId),m=p.menus.find(x=>x.id===mid);
  customerCart[mid]=customerCart[mid]||{};
  if(!m.hasVariants){customerCart[mid].qty=Math.max(0,(customerCart[mid].qty||0)+delta)}
  else if(m.pickRule==="single"){customerCart[mid].qty=Math.max(0,(customerCart[mid].qty||0)+delta)}
  else{
    customerCart[mid].variants=customerCart[mid].variants||{};
    customerCart[mid].variants[vid]=Math.max(0,(customerCart[mid].variants[vid]||0)+delta);
  }
  renderCustomerMenu();
}
function cartPartnerTotal(pid){
  const p=state.partners.find(x=>x.id===pid),cart=customerCart;
  let total=0;
  p?.menus.forEach(m=>{
    const c=cart[m.id];if(!c||m.status==="HABIS")return;
    if(!m.hasVariants)total+=m.basePrice*(c.qty||0);
    else if(m.pickRule==="single"){
      if(c.variantId) {
        const v=m.variants.find(x=>x.id===c.variantId);
        total+=(m.priceRule==="different"?v?.price:m.basePrice||0)*(c.qty||0);
      }
    }else Object.entries(c.variants||{}).forEach(([vid,q])=>{const v=m.variants.find(x=>x.id===vid);total+=(m.priceRule==="different"?v?.price:m.basePrice||0)*q})
  });return total;
}
function cartToItems(pid){
  const p=state.partners.find(x=>x.id===pid),items=[];
  p.menus.forEach(m=>{
    const c=customerCart[m.id];if(!c||m.status==="HABIS")return;
    if(!m.hasVariants && (c.qty||0)>0)items.push({id:uid("item"),partnerId:pid,menuId:m.id,menuName:m.name,variantId:null,variantName:null,qty:c.qty,unitPrice:m.basePrice,check:null});
    else if(m.hasVariants&&m.pickRule==="single"&&c.variantId&&c.qty>0){
      const v=m.variants.find(x=>x.id===c.variantId);items.push({id:uid("item"),partnerId:pid,menuId:m.id,menuName:m.name,variantId:v.id,variantName:v.name,qty:c.qty,unitPrice:m.priceRule==="different"?v.price:m.basePrice,check:null});
    }else if(m.hasVariants&&m.pickRule==="multi")Object.entries(c.variants||{}).forEach(([vid,q])=>{if(q>0){const v=m.variants.find(x=>x.id===vid);items.push({id:uid("item"),partnerId:pid,menuId:m.id,menuName:m.name,variantId:v.id,variantName:v.name,qty:q,unitPrice:m.priceRule==="different"?v.price:m.basePrice,check:null})}})
  });return items;
}
async function saveCustomerPartnerOrder(){
  const items=cartToItems(currentPartnerId);if(!items.length)return toast("Pilih menu terlebih dahulu.");
  let draft=JSON.parse(localStorage.getItem("KS_DRAFT_"+rowId)||"[]");
  draft=draft.filter(x=>x.partnerId!==currentPartnerId);
  draft.push({partnerId:currentPartnerId,items});
  localStorage.setItem("KS_DRAFT_"+rowId,JSON.stringify(draft));
  toast("Pesanan Mitra disimpan.");
  renderCustomerPick();
}
function getDraft(){
  try{return JSON.parse(localStorage.getItem("KS_DRAFT_"+rowId)||"[]")}catch{return[]}
}
function renderCustomerOrders(){
  const draft=getDraft();
  const draftBlocks=draft.map(d=>{
    const p=state.partners.find(x=>x.id===d.partnerId),sub=d.items.reduce((s,i)=>s+i.qty*i.unitPrice,0);
    return `<div class="card"><b>${esc(p?.name||"MITRA")}</b>${d.items.map(i=>`<div class="order-line"><span>${esc(i.menuName)}${i.variantName?" "+esc(i.variantName):""} ×${i.qty}</span><span>${rupiah(i.qty*i.unitPrice)}</span></div>`).join("")}<hr class="sep"><div class="totalrow"><span>TOTAL BELANJA MITRA</span><span>${rupiah(sub)}</span></div></div>`
  }).join("");
  const total=draft.reduce((s,d)=>s+d.items.reduce((a,i)=>a+i.qty*i.unitPrice,0),0);
  const submitted=state.orders.filter(o=>o.customer?.id===selectedCustomer?.id && (o.status==="SENT_TO_PARTNER"||o.status==="CHECKED"||o.status==="READY_FOR_COURIER"));
  const submittedBlocks=submitted.map(o=>{
    const result=o.items.map(i=>`<div class="order-line"><span>${esc(i.menuName)}${i.variantName?" "+esc(i.variantName):""} ×${i.qty}</span><span>${esc(i.check||"MENUNGGU")}</span></div>`).join("");
    const sub=o.items.filter(i=>i.check!=="KOSONG").reduce((s,i)=>s+i.qty*i.unitPrice,0);
    let action="";
    if(o.status==="CHECKED") action=`<button class="btn primary" onclick="processCheckedOrder('${o.id}')">PROSES PESANAN SAYA</button><button class="btn danger" onclick="cancelCustomerOrder('${o.id}')">BATALKAN PESANAN</button>`;
    else if(o.status==="READY_FOR_COURIER") action=`<div class="notice">Pesanan sudah diproses dan diteruskan kepada Kurir.</div>`;
    else action=`<div class="notice">Menunggu hasil pengecekan Mitra.</div>`;
    return `<div class="card"><b>HASIL PENGECEKAN PESANAN</b>${result}<hr class="sep"><div class="totalrow"><span>SUBTOTAL TERSEDIA</span><span>${rupiah(sub)}</span></div>${action}</div>`;
  }).join("");
  render(`<div class="screen">${customerHeader()}<hr class="sep">
    <div class="title">LIHAT PESANAN</div>
    ${draftBlocks||`<div class="notice">Belum ada pesanan baru yang tersimpan.</div>`}
    ${draft.length?`<div class="totalbar"><div class="totalrow"><span>TOTAL SELURUH BELANJA</span><span>${rupiah(total)}</span></div><button class="btn primary" onclick="sendCustomerOrder()">KIRIM PESANAN</button></div>`:""}
    ${submittedBlocks}
  </div>`);
}
async function processCheckedOrder(oid){
  const o=state.orders.find(x=>x.id===oid);if(!o)return;
  o.items=o.items.filter(i=>i.check!=="KOSONG");
  o.status="READY_FOR_COURIER";
  o.total=o.items.reduce((s,i)=>s+i.qty*i.unitPrice,0)+(o.shippingFee||0);
  try{await save();toast("Pesanan diproses.");renderCustomerOrders()}catch(e){toast(e.message)}
}
async function cancelCustomerOrder(oid){
  const o=state.orders.find(x=>x.id===oid);if(!o)return;
  o.status="CANCELLED";
  try{await save();toast("Pesanan dibatalkan.");renderCustomerOrders()}catch(e){toast(e.message)}
}
async function sendCustomerOrder(){
  const draft=getDraft();if(!draft.length)return toast("Belum ada pesanan.");
  const c=selectedCustomer||state.customers.find(x=>x.id===localStorage.getItem("KS_CUSTOMER_"+rowId));
  const items=draft.flatMap(d=>d.items);
  const partnerIds=[...new Set(items.map(i=>i.partnerId))];
  const order={id:uid("ord"),createdAt:now(),customer:{id:c.id,name:c.name,wa:c.wa,location:c.location},partnerIds,items,status:"SENT_TO_PARTNER",partnerChecks:{},courierId:rowId,shippingFee:0,total:items.reduce((s,i)=>s+i.qty*i.unitPrice,0)};
  state.orders.push(order);
  localStorage.removeItem("KS_DRAFT_"+rowId);
  try{await save();currentOrderId=order.id;currentView="customerSend";render(`<div class="screen">${header("KIRIM PESANAN",false)}<div class="card center"><b>PESANAN AKAN DIKIRIM KE KURIR</b></div><button class="btn primary" onclick="renderCustomerPick()">KEMBALI KE PILIH MITRA USAHA</button></div>`)}catch(e){toast(e.message)}
}

/* ---------- COURIER ORDERS ---------- */
function showCourierOrders(){
  currentView="ordersCourier";
  const orders=state.orders.filter(o=>o.status==="CHECKED"||o.status==="READY_FOR_COURIER");
  render(`<div class="screen">${header("PESANAN MASUK",true)}
    ${orders.map(o=>`<div class="card"><b>Nama Pelanggan: ${esc(o.customer?.name)}</b><div class="label">Lokasi Pelanggan</div><button class="btn" onclick="openMap('${encodeURIComponent(o.customer?.location?.lat||"")}','${encodeURIComponent(o.customer?.location?.lon||"")}')">LIHAT LOKASI</button><div class="label">Mitra Usaha</div>${o.partnerIds.map(pid=>esc(state.partners.find(p=>p.id===pid)?.name||"")).join(", ")}<div class="label">Ongkir</div><input id="ongkir_${o.id}" inputmode="numeric" value="${o.shippingFee||""}"><button class="btn primary" onclick="saveOngkir('${o.id}')">SIMPAN ONGKIR</button><button class="btn" onclick="showOrderDetail('${o.id}')">LIHAT DETAIL</button></div>`).join("")||`<div class="notice">Belum ada pesanan siap diproses Kurir.</div>`}
  </div>`);
}
function openMap(lat,lon){
  if(!lat||!lon)return toast("Lokasi belum tersedia.");
  window.open("https://www.google.com/maps?q="+decodeURIComponent(lat)+","+decodeURIComponent(lon),"_blank");
}
async function saveOngkir(oid){
  const o=state.orders.find(x=>x.id===oid),el=document.getElementById("ongkir_"+oid);
  const fee=Number(el.value.replace(/\D/g,""));if(!fee)return toast("Ongkir wajib diisi.");
  o.shippingFee=fee;o.total=o.items.reduce((s,i)=>s+i.qty*i.unitPrice,0)+fee;o.status="READY_FOR_COURIER";
  state.incomes.push({id:uid("inc"),date:now(),orderId:oid,amount:fee});
  try{await save();toast("Ongkir tersimpan.");showCourierOrders()}catch(e){toast(e.message)}
}
function showOrderDetail(oid){
  currentView="orderDetail";currentOrderId=oid;
  const o=state.orders.find(x=>x.id===oid);if(!o)return showCourierOrders();
  const lines=o.items.map(i=>`<div class="order-line"><span>${esc(i.menuName)}${i.variantName?" "+esc(i.variantName):""} ×${i.qty}</span><span>${rupiah(i.qty*i.unitPrice)}</span></div>`).join("");
  const sub=o.items.reduce((s,i)=>s+i.qty*i.unitPrice,0);
  render(`<div class="screen">${header("DETAIL PESANAN",true)}
    <div class="card"><b>${esc(state.partners.find(p=>p.id===o.partnerIds[0])?.name||"MITRA USAHA")}</b>${lines}<hr class="sep"><div class="order-line"><span>Subtotal</span><span>${rupiah(sub)}</span></div><div class="order-line"><span>Ongkir</span><span>${rupiah(o.shippingFee)}</span></div><hr class="sep"><div class="totalrow"><span>Total</span><span>${rupiah(o.total)}</span></div></div>
  </div>`);
}

/* ---------- INCOME / ACCOUNT ---------- */
function showIncome(){
  currentView="income";publicMode=null;
  const groups={};
  state.incomes.forEach(i=>{const d=i.date.slice(0,10);(groups[d]??=[]).push(i)});
  const html=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,arr])=>`<div class="card"><b>${d}</b>${arr.map(i=>`<div class="order-line"><span>Ongkir</span><span>${rupiah(i.amount)}</span></div>`).join("")}<hr class="sep"><div class="totalrow"><span>TOTAL</span><span>${rupiah(arr.reduce((s,i)=>s+i.amount,0))}</span></div></div>`).join("");
  render(`<div class="screen">${header("RIWAYAT PEMASUKAN",true)}${html||`<div class="notice">Belum ada pemasukan.</div>`}</div>`);
}
function showAccount(){
  currentView="account";publicMode=null;
  const c=state.courier;
  render(`<div class="screen">${header("AKUN",true)}
    <div class="card"><div class="label">Nama</div>${esc(c.name)}<div class="label">Nomor WhatsApp</div>${esc(c.wa)}<div class="label">Alamat</div>${addressBox(c.location)}</div>
    <button class="btn primary" onclick="showEditAccount()">EDIT AKUN</button>
  </div>`);
}
function showEditAccount(){
  currentView="editAccount";publicMode=null;const c=state.courier;
  render(`<div class="screen">${header("EDIT AKUN KURIR",true)}
    <div class="label">Nama</div><input id="ecName" value="${esc(c.name)}">
    <div class="label">Nomor WhatsApp</div><input id="ecWa" inputmode="numeric" maxlength="12" value="${esc(c.wa)}">
    <div class="label">Alamat</div>${addressBox(c.location)}
    <button class="btn" onclick="editCourierLocation()">BAGIKAN ULANG LOKASI</button>
    <button class="btn primary" onclick="saveAccount()">SIMPAN</button>
  </div>`);
}
async function editCourierLocation(){const ok=await getLocation(state.courier);if(ok)showEditAccount()}
async function saveAccount(){
  const n=document.getElementById("ecName").value.trim(),w=document.getElementById("ecWa").value.replace(/\D/g,"");
  if(!n||w.length!==12)return toast("Nama dan WA 12 digit wajib diisi.");
  state.courier.name=n;state.courier.wa=w;
  try{await save();showAccount()}catch(e){toast(e.message)}
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast("Link berhasil disalin.");}
  catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Link berhasil disalin.");}
}

/* ---------- ERROR / EXTRAS ---------- */
window.addEventListener("unhandledrejection",e=>console.error(e.reason));
boot();
</script>
</body>

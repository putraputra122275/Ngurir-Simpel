<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NGURIR SIMPEL</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#111827;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:white;
}

.header{
    background:#111827;
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
}

.container{
    padding:18px;
}

.card{
    background:white;
    border:1px solid #e1e5e9;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #cfd5dc;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:80px;
}

button{
    border:0;
    cursor:pointer;
}

.btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border-radius:10px;
    background:#111827;
    color:white;
    font-weight:bold;
}

.btn.secondary{
    background:#e8ebef;
    color:#111827;
}

.btn.success{
    background:#16803c;
}

.btn.danger{
    background:#c62828;
}

.shop{
    border:2px solid #e1e5e9;
    border-radius:15px;
    padding:14px;
    margin-bottom:15px;
}

.shop-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:12px;
}

.menu{
    border-top:1px solid #eee;
    padding:14px 0;
}

.menu:first-child{
    border-top:0;
}

.menu-name{
    font-weight:bold;
    font-size:16px;
}

.price{
    color:#555;
    margin:5px 0 10px;
}

.qty{
    display:flex;
    align-items:center;
    gap:12px;
}

.qty button{
    width:35px;
    height:35px;
    border-radius:8px;
    background:#e8ebef;
    font-size:20px;
}

.qty-number{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.variant{
    margin:7px 0;
    font-weight:normal;
}

.variant input{
    width:auto;
    margin-right:7px;
}

.bottom{
    position:sticky;
    bottom:0;
    background:white;
    border-top:1px solid #ddd;
    padding:12px;
    margin:15px -18px -18px;
    box-shadow:0 -3px 10px rgba(0,0,0,.08);
}

.total-row{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
    font-weight:bold;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    background:#eee;
}

.green{
    background:#dcf5e4;
    color:#176b35;
}

.red{
    background:#fde0e0;
    color:#a51d1d;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:15px 0;
}

.center{
    text-align:center;
}

.small{
    font-size:12px;
    color:#666;
}

.link-box{
    background:#f1f3f5;
    padding:12px;
    border-radius:9px;
    word-break:break-all;
}

.menu-editor{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-top:12px;
}

.variant-row{
    display:flex;
    gap:6px;
    margin-top:7px;
}

.variant-row input{
    flex:1;
}

.variant-row button{
    width:45px;
    border-radius:8px;
    background:#c62828;
    color:white;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <h1>NGURIR SIMPEL</h1>
    <p id="judul">APLIKASI KURIR</p>
</div>

<div class="container" id="app"></div>

</div>

<script>

/* =====================================================
   DATA APLIKASI
===================================================== */

let data = JSON.parse(localStorage.getItem("ngurirSimpel")) || {

    kurir:null,

    kedai:[],

    pelanggan:null,

    keranjang:[],

    pengecekan:[],

    diproses:[],

    resi:null,

    riwayat:[]
};

function simpan(){

    localStorage.setItem(
        "ngurirSimpel",
        JSON.stringify(data)
    );

}


/* =====================================================
   FUNGSI DASAR
===================================================== */

function rupiah(angka){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(angka);

}

function halaman(judul,isi){

    document.getElementById("judul").innerText=judul;

    document.getElementById("app").innerHTML=isi;

    window.scrollTo(0,0);

}


/* =====================================================
   HALAMAN AWAL
===================================================== */

function mulai(){

    if(!data.kurir){

        daftarKurir();

    }else{

        menuKurir();

    }

}


/* =====================================================
   DAFTAR KURIR
===================================================== */

function daftarKurir(){

halaman("APLIKASI KURIR",`

<div class="card">

<h2>Daftar Akun Kurir</h2>

<label>Nama</label>

<input
id="namaKurir"
placeholder="Masukkan nama">

<label>Alamat</label>

<textarea
id="alamatKurir"
placeholder="Masukkan alamat"></textarea>

<label>WhatsApp</label>

<input
id="waKurir"
placeholder="08xxxxxxxxxx">

<button
class="btn"
onclick="simpanKurir()">

🚚 SELESAI

</button>

</div>

`);

}


function simpanKurir(){

    let nama=
        document.getElementById("namaKurir").value.trim();

    let alamat=
        document.getElementById("alamatKurir").value.trim();

    let wa=
        document.getElementById("waKurir").value.trim();

    if(!nama || !alamat || !wa){

        alert("Lengkapi data kurir.");

        return;
    }

    data.kurir={
        nama:nama,
        alamat:alamat,
        wa:wa
    };

    simpan();

    menuKurir();

}


/* =====================================================
   MENU KURIR
===================================================== */

function menuKurir(){

halaman("APLIKASI KURIR",`

<div class="card">

<h2>NGURIR SIMPEL</h2>

<button
class="btn"
onclick="editKurir()">

⚙️ EDIT AKUN

</button>

<button
class="btn"
onclick="aturLayanan()">

🛒 ATUR LAYANAN PESANAN

</button>

</div>

<div class="card">

<button
class="btn secondary"
onclick="riwayat()">

📚 RIWAYAT PESANAN

</button>

</div>

`);

}


/* =====================================================
   EDIT KURIR
===================================================== */

function editKurir(){

    let k=data.kurir;

halaman("EDIT AKUN",`

<div class="card">

<h2>Edit Akun</h2>

<label>Nama</label>

<input
id="namaKurir"
value="${k.nama}">

<label>Alamat</label>

<textarea
id="alamatKurir">${k.alamat}</textarea>

<label>WhatsApp</label>

<input
id="waKurir"
value="${k.wa}">

<button
class="btn"
onclick="simpanKurir()">

SIMPAN

</button>

<button
class="btn secondary"
onclick="menuKurir()">

KEMBALI

</button>

</div>

`);

}


/* =====================================================
   ATUR LAYANAN
===================================================== */

function aturLayanan(){

halaman("ATUR LAYANAN PESANAN",`

<div class="card">

<h2>Atur Layanan Pesanan</h2>

<button
class="btn"
onclick="buatLinkKedai()">

🔗 BUAT LINK PENDAFTARAN KEDAI

</button>

<button
class="btn"
onclick="linkPelanggan()">

🔗 SALIN APLIKASI PELANGGAN

</button>

</div>

<div class="card">

<h3>Kedai Saya</h3>

${data.kedai.length ?

data.kedai.map(k=>`

<div class="card">

<b>🏪 ${k.nama}</b>

<p class="small">
${k.wa}
</p>

<button
class="btn secondary"
onclick="editKedai('${k.id}')">

EDIT

</button>

<button
class="btn danger"
onclick="hapusKedai('${k.id}')">

HAPUS

</button>

</div>

`).join("")

:

"<p>Belum ada kedai.</p>"

}

</div>

<button
class="btn secondary"
onclick="menuKurir()">

KEMBALI

</button>

`);

}


/* =====================================================
   LINK PENDAFTARAN KEDAI
===================================================== */

function buatLinkKedai(){

    let token=
        Math.random()
        .toString(36)
        .substring(2,10);

    let link=
        location.href.split("#")[0]
        +"#daftar-kedai-"+token;

halaman("LINK PENDAFTARAN KEDAI",`

<div class="card">

<h2>Link Pendaftaran Kedai</h2>

<div class="link-box">

${link}

</div>

<button
class="btn"
onclick="salin('${link}')">

SALIN LINK

</button>

<button
class="btn secondary"
onclick="formKedai()">

BUKA FORM KEDAI

</button>

</div>

`);

}


async function salin(teks){

    try{

        await navigator.clipboard.writeText(teks);

        alert("Link berhasil disalin.");

    }catch(e){

        alert(teks);

    }

}


/* =====================================================
   FORM KEDAI
===================================================== */

function formKedai(id=null){

    let kedai=id ?
        data.kedai.find(k=>k.id===id):
        null;

halaman(
    "PENDAFTARAN KEDAI",
`

<div class="card">

<h2>
${kedai ? "Edit Kedai":"Pendaftaran Kedai"}
</h2>

<label>Nama Kedai</label>

<input
id="namaKedai"
value="${kedai ? kedai.nama:""}"
placeholder="Masukkan nama kedai">

<label>WhatsApp Kedai</label>

<input
id="waKedai"
value="${kedai ? kedai.wa:""}"
placeholder="08xxxxxxxxxx">

<div id="daftarMenu">

${kedai ?
kedai.menu.map((m,i)=>
editorMenu(m,i)
).join("")
:
""

}

</div>

<button
class="btn secondary"
onclick="tambahMenu()">

+ TAMBAH MENU

</button>

<button
class="btn success"
onclick="simpanKedai('${id||""}')">

KIRIM

</button>

<button
class="btn secondary"
onclick="aturLayanan()">

BATAL

</button>

</div>

`);

}


function editorMenu(m={},index=0){

return`

<div class="menu-editor">

<label>Nama Menu</label>

<input
class="nama-menu"
value="${m.nama||""}"
placeholder="Contoh: Bakso Bakar">

<label>Harga</label>

<input
class="harga-menu"
type="number"
value="${m.harga||""}"
placeholder="15000">

<div class="varian-list">

${(m.varian||[])
.map(v=>`

<div class="variant-row">

<input
class="varian"
value="${v}"
placeholder="Nama varian">

<button
onclick="this.parentElement.remove()">

🗑️

</button>

</div>

`).join("")}

</div>

<button
class="btn secondary"
onclick="tambahVarian(this)">

+ Tambah Varian

</button>

<button
class="btn danger"
onclick="this.parentElement.remove()">

HAPUS MENU

</button>

</div>

`;

}


function tambahMenu(){

    document
    .getElementById("daftarMenu")
    .insertAdjacentHTML(
        "beforeend",
        editorMenu()
    );

}


function tambahVarian(button){

    let daftar=
        button.previousElementSibling;

    daftar.insertAdjacentHTML(
        "beforeend",
        `
        <div class="variant-row">

        <input
        class="varian"
        placeholder="Nama varian">

        <button
        onclick="this.parentElement.remove()">

        🗑️

        </button>

        </div>
        `
    );

}


/* =====================================================
   SIMPAN KEDAI
===================================================== */

function simpanKedai(id){

    let nama=
        document.getElementById("namaKedai")
        .value.trim();

    let wa=
        document.getElementById("waKedai")
        .value.trim();

    let editor=
        [...document.querySelectorAll(".menu-editor")];

    if(!nama || !wa || !editor.length){

        alert(
            "Lengkapi data kedai dan tambahkan menu."
        );

        return;
    }

    let menu=[];

    editor.forEach(e=>{

        let namaMenu=
            e.querySelector(".nama-menu")
            .value.trim();

        let harga=
            Number(
                e.querySelector(".harga-menu")
                .value
            );

        let varian=[
            ...e.querySelectorAll(".varian")
        ]
        .map(x=>x.value.trim())
        .filter(Boolean);

        if(namaMenu){

            menu.push({

                id:
                Math.random()
                .toString(36)
                .substring(2,9),

                nama:namaMenu,

                harga:harga,

                varian:varian

            });

        }

    });

    if(id){

        let k=
            data.kedai.find(k=>k.id===id);

        k.nama=nama;
        k.wa=wa;
        k.menu=menu;

    }else{

        data.kedai.push({

            id:
            Math.random()
            .toString(36)
            .substring(2,10),

            nama:nama,

            wa:wa,

            menu:menu

        });

    }

    simpan();

    aturLayanan();

}


/* =====================================================
   EDIT / HAPUS KEDAI
===================================================== */

function editKedai(id){

    formKedai(id);

}


function hapusKedai(id){

    if(confirm("Hapus kedai ini?")){

        data.kedai=
            data.kedai.filter(k=>k.id!==id);

        simpan();

        aturLayanan();

    }

}


/* =====================================================
   LINK PELANGGAN
===================================================== */

function linkPelanggan(){

    let link=
        location.href.split("#")[0]
        +"#pelanggan";

halaman("APLIKASI PELANGGAN",`

<div class="card">

<h2>🔗 Aplikasi Pelanggan</h2>

<div class="link-box">

${link}

</div>

<button
class="btn"
onclick="salin('${link}')">

SALIN APLIKASI PELANGGAN

</button>

<button
class="btn secondary"
onclick="pelangganMulai()">

BUKA SEBAGAI PELANGGAN

</button>

</div>

`);

}


/* =====================================================
   DATA PELANGGAN
===================================================== */

function pelangganMulai(){

    if(!data.kedai.length){

        alert("Belum ada kedai.");

        return;

    }

halaman("DATA PELANGGAN",`

<div class="card">

<h2>Data Pelanggan</h2>

<label>Nama</label>

<input
id="namaPelanggan"
placeholder="Masukkan nama">

<label>WhatsApp</label>

<input
id="waPelanggan"
placeholder="08xxxxxxxxxx">

<label>Alamat Lengkap</label>

<textarea
id="alamatPelanggan"
placeholder="Masukkan alamat"></textarea>

<label>Lokasi / SERLOK</label>

<button
class="btn secondary"
onclick="ambilLokasi()">

📍 SERLOK

</button>

<div
id="lokasi"
class="small">

Lokasi belum diambil.

</div>

<button
class="btn"
onclick="simpanPelanggan()">

LANJUT

</button>

</div>

`);

}


let lokasiPelanggan=null;


function ambilLokasi(){

    if(!navigator.geolocation){

        alert(
            "Browser tidak mendukung lokasi."
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        posisi=>{

            lokasiPelanggan={

                latitude:
                posisi.coords.latitude,

                longitude:
                posisi.coords.longitude

            };

            document
            .getElementById("lokasi")
            .innerText=
            "Lokasi berhasil diambil.";

        },

        ()=>{

            alert(
                "Lokasi tidak berhasil diambil."
            );

        }

    );

}


function simpanPelanggan(){

    let nama=
        document.getElementById("namaPelanggan")
        .value.trim();

    let wa=
        document.getElementById("waPelanggan")
        .value.trim();

    let alamat=
        document.getElementById("alamatPelanggan")
        .value.trim();

    if(!nama || !wa || !alamat){

        alert(
            "Lengkapi data pelanggan."
        );

        return;
    }

    data.pelanggan={

        nama:nama,

        wa:wa,

        alamat:alamat,

        lokasi:lokasiPelanggan

    };

    data.keranjang=[];

    simpan();

    pilihKedai();

}


/* =====================================================
   PILIH KEDAI
===================================================== */

function pilihKedai(){

halaman("PILIH KEDAI",`

<div class="card">

<h2>Pilih Kedai</h2>

${data.kedai.map(k=>`

<label class="variant">

<input
type="checkbox"
class="pilihKedai"
value="${k.id}">

🏪 ${k.nama}

</label>

`).join("")}

<button
class="btn"
onclick="bukaMenu()">

LANJUT

</button>

</div>

`);

}


/* =====================================================
   MENU PELANGGAN
===================================================== */

function bukaMenu(){

    let ids=[
        ...document
        .querySelectorAll(".pilihKedai:checked")
    ]
    .map(x=>x.value);

    if(!ids.length){

        alert(
            "Pilih minimal satu kedai."
        );

        return;
    }

    data.keranjang=[];

    let html="";

    ids.forEach(id=>{

        let k=
            data.kedai.find(k=>k.id===id);

        html+=`

        <div
        class="shop"
        data-shop="${k.id}">

        <div class="shop-title">

        🏪 ${k.nama}

        </div>

        ${k.menu.map(m=>menuPelanggan(k,m)).join("")}

        </div>

        `;

    });

halaman("MENU PESANAN",`

${html}

<div class="bottom">

<div class="total-row">

<span id="jumlahItem">
0 ITEM
</span>

<span id="totalHarga">
Rp0
</span>

</div>

<button
class="btn"
onclick="ringkasan()">

LIHAT PESANAN

</button>

</div>

`);

}


function menuPelanggan(k,m){

return`

<div class="menu">

<div class="menu-name">

${m.nama}

</div>

<div class="price">

${rupiah(m.harga)}

</div>

<div class="qty">

<button
onclick="ubahJumlah(
'${k.id}',
'${m.id}',
-1
)">

−

</button>

<strong
class="qty-number"
id="jumlah-${k.id}-${m.id}">

0

</strong>

<button
onclick="ubahJumlah(
'${k.id}',
'${m.id}',
1
)">

+

</button>

</div>

${(m.varian||[]).map(v=>`

<label class="variant">

<input
type="radio"
name="varian-${k.id}-${m.id}"
value="${v}"
onchange="
pilihVarian(
'${k.id}',
'${m.id}',
this.value
)">

○ ${v}

</label>

`).join("")}

</div>

`;

}


/* =====================================================
   KERANJANG
===================================================== */

function cariKeranjang(kedaiId,menuId){

    return data.keranjang.find(

        x=>
        x.kedaiId===kedaiId &&
        x.menuId===menuId

    );

}


function ubahJumlah(
    kedaiId,
    menuId,
    perubahan
){

    let item=
        cariKeranjang(
            kedaiId,
            menuId
        );

    if(!item){

        item={

            kedaiId:kedaiId,

            menuId:menuId,

            jumlah:0,

            varian:""

        };

        data.keranjang.push(item);

    }

    item.jumlah=
        Math.max(
            0,
            item.jumlah+perubahan
        );

    data.keranjang=
        data.keranjang.filter(
            x=>x.jumlah>0
        );

    let el=
        document.getElementById(
            `jumlah-${kedaiId}-${menuId}`
        );

    if(el){

        el.innerText=
            item.jumlah;

    }

    hitungTotal();

}


function pilihVarian(
    kedaiId,
    menuId,
    varian
){

    let item=
        cariKeranjang(
            kedaiId,
            menuId
        );

    if(!item){

        item={

            kedaiId:kedaiId,

            menuId:menuId,

            jumlah:1,

            varian:varian

        };

        data.keranjang.push(item);

        let el=
            document.getElementById(
                `jumlah-${kedaiId}-${menuId}`
            );

        if(el){

            el.innerText="1";

        }

    }else{

        item.varian=varian;

    }

    hitungTotal();

}


function hitungTotal(){

    let jumlah=0;

    let total=0;

    data.keranjang.forEach(item=>{

        let k=
            data.kedai.find(
                k=>k.id===item.kedaiId
            );

        let m=
            k.menu.find(
                m=>m.id===item.menuId
            );

        jumlah+=item.jumlah;

        total+=
            m.harga*
            item.jumlah;

    });

    let a=
        document.getElementById(
            "jumlahItem"
        );

    let b=
        document.getElementById(
            "totalHarga"
        );

    if(a)a.innerText=
        jumlah+" ITEM";

    if(b)b.innerText=
        rupiah(total);

}


/* =====================================================
   RINGKASAN
===================================================== */

function ringkasan(){

    if(!data.keranjang.length){

        alert(
            "Belum ada barang."
        );

        return;
    }

    let kelompok={};

    data.keranjang.forEach(item=>{

        let k=
            data.kedai.find(
                k=>k.id===item.kedaiId
            );

        let m=
            k.menu.find(
                m=>m.id===item.menuId
            );

        if(!kelompok[k.id]){

            kelompok[k.id]={

                kedai:k,

                item:[],

                subtotal:0

            };

        }

        let sub=
            m.harga*
            item.jumlah;

        kelompok[k.id]
        .item.push({

            menu:m,

            pesanan:item,

            subtotal:sub

        });

        kelompok[k.id]
        .subtotal+=sub;

    });

    let total=0;

halaman("RINGKASAN PESANAN",`

<div class="card">

<h2>Ringkasan Pesanan</h2>

${Object.values(kelompok)
.map(g=>{

    total+=g.subtotal;

    return`

    <div class="shop">

    <div class="shop-title">

    🏪 ${g.kedai.nama}

    </div>

    ${g.item.map(i=>`

    ${i.menu.nama}
    ${i.pesanan.varian ?
    " "+i.pesanan.varian:""}
    × ${i.pesanan.jumlah}

    <br>

    <b>${rupiah(i.subtotal)}</b>

    <hr>

    `).join("")}

    <b>
    Subtotal ${g.kedai.nama}:
    ${rupiah(g.subtotal)}
    </b>

    </div>

    `;

}).join("")}

<h3>
TOTAL PESANAN:
${rupiah(total)}
</h3>

<button
class="btn success"
onclick="kirimPesanan()">

KIRIM PESANAN

</button>

</div>

`);

}


/* =====================================================
   KIRIM PESANAN KE PENGECEKAN
===================================================== */

function kirimPesanan(){

    let kelompok={};

    data.keranjang.forEach(item=>{

        let k=
            data.kedai.find(
                k=>k.id===item.kedaiId
            );

        let m=
            k.menu.find(
                m=>m.id===item.menuId
            );

        if(!kelompok[k.id]){

            kelompok[k.id]={

                kedaiId:k.id,

                kedaiNama:k.nama,

                kedaiWa:k.wa,

                item:[]

            };

        }

        kelompok[k.id].item.push({

            nama:m.nama,

            harga:m.harga,

            jumlah:item.jumlah,

            varian:item.varian,

            status:null

        });

    });

    data.pengecekan=
        Object.values(kelompok);

    simpan();

    halamanPengecekan();

}


/* =====================================================
   PENGECEKAN KEDAI
===================================================== */

halaman("CEK STOK PESANAN",`

${data.pengecekan.map((k,ki)=>`

🏪 CEK STOK

<br>

${k.kedaiNama}

</div>

<p>

<b>${data.pelanggan.nama}</b>

</p>

${k.item.map((item,ii)=>`

<div class="card">

${item.nama}
${item.varian ?
" "+item.varian:""}

× ${item.jumlah}

</b>

<div>

/* =====================================================
   STATUS BARANG
===================================================== */

function statusBarang(
    kedaiIndex,
    itemIndex,
    status
){

    data.pengecekan[
        kedaiIndex
    ].item[
        itemIndex
    ].status=status;

    simpan();

    let el=
        document.getElementById(
            `status-${kedaiIndex}-${itemIndex}`
        );

    el.innerText=status;

    el.className=
        "badge "+
        (
            status==="ADA"
            ?"green"
            :"red"
        );

}


/* =====================================================
   KIRIM HASIL PENGECEKAN
===================================================== */

function kirimPengecekan(index){

    let k=
        data.pengecekan[index];

    if(
        k.item.some(
            x=>!x.status
        )
    ){

        alert(
            "Tentukan ADA atau KOSONG untuk semua barang."
        );

        return;
    }

    k.terkirim=true;

    simpan();

    hasilPengecekan();

}


/* =====================================================
   HASIL PENGECEKAN PELANGGAN
===================================================== */

function hasilPengecekan(){

halaman("HASIL PENGECEKAN",`

<div class="card">

<h2>Hasil Pengecekan</h2>

${data.pengecekan
.filter(k=>k.terkirim)
.map(k=>`

<div class="shop">

<div class="shop-title">

🏪 ${k.kedaiNama}

</div>

${k.item.map(i=>`

<b>
${i.nama}
${i.varian ?
" "+i.varian:""}
× ${i.jumlah}

${i.status==="ADA"?"green":"red"}">

?"🟢 ADA"
:"🔴 KOSONG"}

`).join("")}

<button
class="btn success"

</div>

`);

}


/* =====================================================
   PROSES KEDAI
===================================================== */

function prosesKedai(kedaiId){

    let k=
        data.pengecekan.find(
            x=>x.kedaiId===kedaiId
        );

    if(
        !data.diproses.some(
            x=>x.kedaiId===kedaiId
        )
    ){

        data.diproses.push({

            kedaiId:k.kedaiId,

            kedaiNama:k.kedaiNama,

            kedaiWa:k.kedaiWa,

            item:
            k.item.filter(
                x=>x.status==="ADA"
            )

        });

    }

    simpan();

    pesanKurir();

}


/* =====================================================
   BATAL KEDAI
===================================================== */

function batalKedai(kedaiId){

    if(
        confirm(
            "Batalkan pesanan dari kedai ini?"
        )
    ){

        data.diproses=
            data.diproses.filter(
                x=>x.kedaiId!==kedaiId
            );

        simpan();

        hasilPengecekan();

    }

}


/* =====================================================
   PESANAN KURIR
===================================================== */

    let namaKedai=
        data.diproses

halaman("PESANAN DIPROSES",`

}

</button>

`);

}


/* =====================================================
   BUAT RESI
===================================================== */

function buatResi(){

    let ongkir=
        Number(
            document
            .getElementById("ongkir")
            .value
        );

    let totalBarang=0;

    let kedaiResi=
        data.diproses.map(k=>{

            let barang=
                k.item.map(item=>{

                    let subtotal=
                        item.harga*
                        item.jumlah;

                    totalBarang+=subtotal;

                    return{

                        nama:item.nama,

                        varian:item.varian,

                        jumlah:item.jumlah,

                        subtotal:subtotal

                    };

                });

            return{

                nama:k.kedaiNama,

                barang:barang

            };

        });

    data.resi={

        pelanggan:data.pelanggan,

        kedai:kedaiResi,

        totalBarang:totalBarang,

        ongkir:ongkir,

        total:
            totalBarang+ongkir,

        waktu:
            new Date().toISOString()

    };

    data.riwayat.unshift(
        data.resi
    );

    simpan();

    tampilResi();

}

/* =====================================================
   WHATSAPP
===================================================== */

function whatsapp(){

    let r=data.resi;

    let pesan=
`NGURIR SIMPEL

RESI PESANAN

Nama Pelanggan:
${r.pelanggan.nama}

`;

    r.kedai.forEach(k=>{

        pesan+=`
🏪 ${k.nama}

`;

        k.barang.forEach(b=>{

            pesan+=
`${b.nama}`+
            (b.varian?
            " "+b.varian:"")+
            ` × ${b.jumlah}
${rupiah(b.subtotal)}

`;

        });

        pesan+=
`Subtotal ${k.nama}:
${rupiah(
    k.barang.reduce(
        (a,b)=>a+b.subtotal,
        0
    )
)}

`;

    });

    pesan+=
`TOTAL PESANAN:
${rupiah(r.totalBarang)}

ONGKIR:
${rupiah(r.ongkir)}

TOTAL YANG HARUS DIBAYAR:
${rupiah(r.total)}`;

    let nomor=
        r.pelanggan.wa
        .replace(/\D/g,"");

    let url=
        "https://wa.me/"+
        nomor+
        "?text="+
        encodeURIComponent(pesan);

    window.open(
        url,
        "_blank"
    );

}

function bukaSesuaiHash(){

    let hash=
        location.hash;

    if(
        hash==="#pelanggan"
    ){

        pelangganMulai();

        return;

    }

    if(
        hash.startsWith(
            "#daftar-kedai-"
        )
    ){

        formKedai();

        return;

    }

    mulai();

}
